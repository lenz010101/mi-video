name: Validate compositions

# Valida el repo SIN renderizar ningun video:
#   * lint de HyperFrames (el mismo binario y version que el render)
#   * auditor de reglas del repo (demo2/audit-rules.mjs)
#   * comprobacion de que todo lo vendorizado es identico a npm
#   * 7 fotogramas de la composicion principal (prueba de que GSAP y el resto
#     de librerias vendorizadas siguen funcionando en un navegador real)
#
# Sirve para probar cambios en assets/vendor o en las librerias sin gastar
# un render completo. Para el MP4, el workflow "Render video".

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  HYPERFRAMES_VERSION: "0.8.162"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache de HyperFrames, navegador y fuentes
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache
          key: hf-${{ runner.os }}-${{ env.HYPERFRAMES_VERSION }}
          restore-keys: |
            hf-${{ runner.os }}-

      - name: Cache de FFmpeg estatico
        uses: actions/cache@v4
        with:
          path: ~/.cache/ffmpeg-static
          key: ffmpeg-static-johnvansickle-v1

      - name: Preparar el directorio de librerias
        run: |
          mkdir -p "$HOME/editing-tools"
          echo "EDITING_TOOLS=$HOME/editing-tools" >> "$GITHUB_ENV"

      - name: Cache de las librerias de edicion
        uses: actions/cache@v4
        with:
          path: ${{ env.EDITING_TOOLS }}
          key: editing-tools-node22-v1

      - name: Install the editing libraries
        env:
          HF_VERSION: ${{ env.HYPERFRAMES_VERSION }}
        run: |
          set -e
          TOOLS="$EDITING_TOOLS"
          mkdir -p "$TOOLS"
          cd "$TOOLS"
          node -e '
            const fs = require("fs");
            const deps = {
              hyperframes: process.env.HF_VERSION,
              gsap: "3.15.0",
              sharp: "0.35.5",
              "fluent-ffmpeg": "2.1.3",
              "ffmpeg-static": "5.3.0",
              "ffprobe-static": "3.1.0",
              "animejs": "4.5.0",
              "lottie-web": "5.12.2",
              three: "0.181.2",
              d3: "7.9.0",
              leaflet: "1.9.4",
              "maplibre-gl": "6.15.0",
              "mapbox-gl": "3.33.0",
              typegpu: "0.12.8"
            };
            fs.writeFileSync("package.json", JSON.stringify({
              name: "mi-video-editing-tools",
              private: true,
              version: "1.0.0",
              description: "Librerias de edicion (video, imagen, animacion) para el render en la nube",
              dependencies: deps
            }, null, 2) + "\n");
          '
          npm install --no-audit --no-fund --loglevel=error || echo "::warning::npm install fallo: se sigue con npx"
          cd "$GITHUB_WORKSPACE"
          mkdir -p "$HOME/hfbin"
          cat > "$HOME/hfbin/hf" <<'SH'
          #!/usr/bin/env bash
          LOCAL="${EDITING_TOOLS:-$HOME/editing-tools}/node_modules/.bin/hyperframes"
          if [ -x "$LOCAL" ] && "$LOCAL" --version >/dev/null 2>&1; then
            exec "$LOCAL" "$@"
          fi
          exec npx --yes "hyperframes@${HF_VERSION:-0.8.162}" "$@"
          SH
          chmod +x "$HOME/hfbin/hf"
          echo "$HOME/hfbin" >> "$GITHUB_PATH"
          echo "HF_VERSION=$HF_VERSION" >> "$GITHUB_ENV"
          echo "NODE_PATH=$TOOLS/node_modules" >> "$GITHUB_ENV"

      - name: HyperFrames skills
        uses: ./.github/actions/hf-skills

      - name: Verify the editing libraries
        run: |
          node -e '
            const fs = require("fs");
            const root = (process.env.EDITING_TOOLS || process.env.HOME + "/editing-tools") + "/node_modules/";
            const names = ["hyperframes","gsap","sharp","fluent-ffmpeg","ffmpeg-static","ffprobe-static","animejs","lottie-web","three","d3","leaflet","maplibre-gl","mapbox-gl","typegpu"];
            let missing = 0;
            for (const n of names) {
              try {
                const p = JSON.parse(fs.readFileSync(root + n + "/package.json", "utf8"));
                console.log("  OK   " + n + "@" + p.version);
              } catch (e) {
                console.log("::warning::no instalada: " + n);
                missing++;
              }
            }
            if (missing) console.log("::warning::faltan " + missing + " librerias");
          '
          node demo2/verify-vendor.mjs

      - name: Install FFmpeg
        run: |
          FF="$HOME/.cache/ffmpeg-static"
          if [ -x "$FF/ffmpeg" ] && "$FF/ffmpeg" -version >/dev/null 2>&1; then
            echo "Binario estatico ya en cache."
          else
            rm -rf "$FF"; mkdir -p "$FF"
            if curl -fsSL --retry 3 --max-time 240 -o /tmp/ff.tar.xz \
                 https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
               && tar -xJf /tmp/ff.tar.xz -C "$FF" --strip-components=1 \
               && chmod +x "$FF/ffmpeg" "$FF/ffprobe" \
               && "$FF/ffmpeg" -version >/dev/null 2>&1; then
              echo "Binario estatico descargado."
            else
              echo "::warning::Fallo el binario estatico; se instala por apt."
              rm -rf "$FF"; mkdir -p "$FF"
              sudo apt-get install -y -qq --no-install-recommends ffmpeg || {
                sudo apt-get update -qq
                sudo apt-get install -y -qq --no-install-recommends ffmpeg
              }
            fi
          fi
          if [ -x "$FF/ffmpeg" ]; then
            export PATH="$FF:$PATH"
            echo "$FF" >> "$GITHUB_PATH"
          fi
          ffmpeg -version | head -1

      - name: Preparar el directorio del material nuevo
        run: mkdir -p assets/nuevo/procesado

      - name: Cache del material nuevo
        uses: actions/cache@v4
        with:
          path: assets/nuevo/procesado
          key: nuevo-v5-${{ runner.os }}-${{ hashFiles('assets/nuevo/fuentes.json') }}

      - name: Prepare the new material
        run: node demo2/preparar-nuevo.mjs

      - name: Lint the composition
        run: hf lint .

      - name: Auditor de reglas del repo
        run: node demo2/audit-rules.mjs

      - name: Coste estimado por fotograma
        # Informativo: no falla el workflow. Dice que composicion va a ser la
        # mas cara de renderizar y que patrones caros tiene.
        run: node demo2/audit-perf.mjs

      # "hf check ." revisa TODO el proyecto (lint estatico + muestras en
      # runtime + contraste) sin renderizar ningun MP4. No acepta ficheros
      # sueltos: solo proyectos (directorios con index.html).
      - name: Check del proyecto (runtime, sin MP4)
        run: |
          hf check . --snapshots
          hf snapshot . --frames 7 --no-browser-gpu --output snapshots
          ls snapshots | head -10

      - name: Upload the validation frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyperframes-validation
          path: |
            snapshots/
            snapshots-extra/
          if-no-files-found: ignore
          retention-days: 14


