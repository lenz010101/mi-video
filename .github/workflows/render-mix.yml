name: Render mixto (Remotion + HyperFrames)

# Render en dos motores, de verdad:
#   1) REMOTION renderiza los PLANOS: uno por puesto del ranking
#      (el presentador de fondo + el carril de marcas + logos + orbes).
#      Un solo componente parametrizado genera los 5.
#   2) HYPERFRAMES monta el final: hook, titulares de marca, pies de foto,
#      veredicto, cierre, musica, grano y transiciones, usando esos planos.
#
# El resultado es un solo MP4 de 30 s con las dos tecnicas.

on:
  workflow_dispatch:
    inputs:
      filename:
        description: "Nombre de la salida (se guarda en renders/)"
        type: string
        default: "ranking-mix-30s.mp4"
      quality:
        description: "Calidad del render"
        type: choice
        default: high
        options:
          - draft
          - standard
          - high
      frames:
        description: "Subir fotogramas de revision"
        type: choice
        default: "no"
        options:
          - "no"
          - "si"
      fps:
        description: "FPS del render (15 para revision, 30 para entrega)"
        type: string
        default: "30"
      qc:
        description: "Verificar el MP4 (frames congelados + hoja)"
        type: choice
        default: "si"
        options:
          - "si"
          - "no"
      mode:
        description: "Modo: video (entrega) o frames (revision de arte, sin MP4)"
        type: choice
        default: video
        options:
          - video
          - frames
      at:
        description: "Marcas de tiempo para el modo frames (segundos, por comas)"
        type: string
        default: "1.5,6.8,12,17.2,22.5,28"

permissions:
  contents: read

env:
  HYPERFRAMES_VERSION: "0.8.162"

jobs:
  mix:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache de HyperFrames, navegador y fuentes
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache
          key: hf-${{ runner.os }}-${{ env.HYPERFRAMES_VERSION }}
          restore-keys: |
            hf-${{ runner.os }}-

      - name: Cache de FFmpeg estatico
        uses: actions/cache@v4
        with:
          path: ~/.cache/ffmpeg-static
          key: ffmpeg-static-johnvansickle-v1

      - name: Preparar el directorio de librerias
        run: |
          mkdir -p "$HOME/editing-tools"
          echo "EDITING_TOOLS=$HOME/editing-tools" >> "$GITHUB_ENV"

      - name: Cache de las librerias de edicion
        uses: actions/cache@v4
        with:
          path: ${{ env.EDITING_TOOLS }}
          key: editing-tools-node22-v1

      - name: Install the editing libraries
        env:
          HF_VERSION: ${{ env.HYPERFRAMES_VERSION }}
        run: |
          set -e
          TOOLS="$EDITING_TOOLS"
          mkdir -p "$TOOLS"
          cd "$TOOLS"
          node -e '
            const fs = require("fs");
            const deps = {
              hyperframes: process.env.HF_VERSION,
              gsap: "3.15.0",
              sharp: "0.35.5",
              "fluent-ffmpeg": "2.1.3",
              "ffmpeg-static": "5.3.0",
              "ffprobe-static": "3.1.0",
              "animejs": "4.5.0",
              "lottie-web": "5.12.2",
              three: "0.181.2",
              d3: "7.9.0",
              leaflet: "1.9.4",
              "maplibre-gl": "6.15.0",
              "mapbox-gl": "3.33.0",
              typegpu: "0.12.8"
            };
            fs.writeFileSync("package.json", JSON.stringify({
              name: "mi-video-editing-tools", private: true, version: "1.0.0",
              description: "Librerias de edicion (video, imagen, animacion) para el render en la nube",
              dependencies: deps
            }, null, 2) + "\n");
          '
          npm install --no-audit --no-fund --loglevel=error || echo "::warning::npm install fallo: el render sigue con npx"
          cd "$GITHUB_WORKSPACE"
          mkdir -p "$HOME/hfbin"
          cat > "$HOME/hfbin/hf" <<'SH'
          #!/usr/bin/env bash
          LOCAL="${EDITING_TOOLS:-$HOME/editing-tools}/node_modules/.bin/hyperframes"
          if [ -x "$LOCAL" ] && "$LOCAL" --version >/dev/null 2>&1; then
            exec "$LOCAL" "$@"
          fi
          exec npx --yes "hyperframes@${HF_VERSION:-0.8.162}" "$@"
          SH
          chmod +x "$HOME/hfbin/hf"
          echo "$HOME/hfbin" >> "$GITHUB_PATH"
          echo "HF_VERSION=$HF_VERSION" >> "$GITHUB_ENV"
          echo "NODE_PATH=$TOOLS/node_modules" >> "$GITHUB_ENV"

      - name: HyperFrames skills
        uses: ./.github/actions/hf-skills

      - name: Remotion tools
        uses: ./.github/actions/remotion-tools

      - name: Install FFmpeg
        run: |
          FF="$HOME/.cache/ffmpeg-static"
          if [ ! -x "$FF/ffmpeg" ]; then
            rm -rf "$FF"; mkdir -p "$FF"
            curl -fsSL --retry 3 --max-time 240 -o /tmp/ff.tar.xz \
              https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
              && tar -xJf /tmp/ff.tar.xz -C "$FF" --strip-components=1 \
              && chmod +x "$FF/ffmpeg" "$FF/ffprobe"
          fi
          echo "$FF" >> "$GITHUB_PATH"

      # El lint de HyperFrames revisa TODO el proyecto, asi que el material de
      # las otras piezas tiene que estar montado (o el lint se queja de los
      # audios que no encuentra). Va cacheado: solo se descarga una vez.
      - name: Cache del material nuevo
        uses: actions/cache@v4
        with:
          path: assets/nuevo/procesado
          key: nuevo-v2-${{ runner.os }}-${{ hashFiles('assets/nuevo/fuentes.json') }}

      - name: Cache del material de la inmobiliaria
        uses: actions/cache@v4
        with:
          path: assets/nuevo/inmo/procesado
          key: inmo-v1-${{ runner.os }}-${{ hashFiles('assets/nuevo/inmo/fuentes.json') }}

      - name: Prepare the new material
        run: |
          node demo2/preparar-nuevo.mjs assets/nuevo/fuentes.json
          if [ -f assets/nuevo/inmo/fuentes.json ]; then
            node demo2/preparar-nuevo.mjs assets/nuevo/inmo/fuentes.json
          fi

      # ── 1) REMOTION: los planos ──────────────────────────────────────
      - name: Prepare the remotion public folder
        run: |
          mkdir -p remotion/public/logos remotion/public/fonts remotion/props assets/mezcla
          cp assets/clips/talker-slow.mp4 remotion/public/presentador.mp4
          for m in porsche bmw mercedes honda toyota; do
            cp "assets/logos/$m.png" "remotion/public/logos/$m.png"
          done
          cp assets/fonts/anton-400.woff2 remotion/public/fonts/anton-400.woff2
          cp assets/fonts/nuevo/jetbrains-mono-latin-600-normal.woff2 remotion/public/fonts/jetbrains-mono-600.woff2
          ls remotion/public remotion/public/logos

      - name: Remotion props
        run: |
          node -e '
            const fs = require("fs");
            const marcas = [
              {nombre:"PORSCHE", logo:"logos/porsche.png", color:"#D5001C", frase:"pierden"},
              {nombre:"BMW", logo:"logos/bmw.png", color:"#0066B1", frase:"recomiendo"},
              {nombre:"MERCEDES-BENZ", logo:"logos/mercedes.png", color:"#00A19B", frase:"y confiabilidad"},
              {nombre:"HONDA", logo:"logos/honda.png", color:"#CC0000", frase:"su valor"},
              {nombre:"TOYOTA", logo:"logos/toyota.png", color:"#EB0A1E", frase:"quieres bajar"}
            ];
            // el presentador cambia de gesto en cada puesto
            const desde = [120, 260, 430, 600, 760];
            for (let i = 0; i < 5; i++) {
              const props = {
                posicion: 5 - i,
                activa: i,
                marcas,
                presentadorDesde: desde[i],
                presupuesto: "2.4 MDP"
              };
              fs.writeFileSync("remotion/props/plate-" + (5 - i) + ".json", JSON.stringify(props, null, 2));
            }
            console.log("props escritos");
          '

      - name: Install the remotion project
        working-directory: remotion
        run: |
          if [ ! -d node_modules/remotion ]; then
            npm install --no-audit --no-fund --loglevel=error --prefer-offline
          else
            echo "node_modules en cache: no se reinstala"
          fi
          node -e "console.log('remotion', require('remotion/package.json').version)"

      # La columna de orbes no cambia entre runs: se cachea (49 s ahorrados)
      - name: Cache de la columna de orbes
        uses: actions/cache@v4
        with:
          path: assets/mezcla/orbes.mp4
          key: orbes-v2-${{ runner.os }}-${{ hashFiles('remotion/src/**') }}

      - name: Render the orb column with remotion
        working-directory: remotion
        run: |
          mkdir -p ../assets/mezcla ../renders
          # La columna de orbes dorados, sobre negro: se hornea despues encima
          # del presentador en modo screen.
          if [ -f ../assets/mezcla/orbes.mp4 ]; then
            echo "columna de orbes en cache: no se vuelve a renderizar"
          else
            npx remotion render OrbColumn "../assets/mezcla/orbes.mp4" --log=error
          fi
          ls -lh ../assets/mezcla/orbes.mp4

      - name: Bake the plates (presentador + coche + orbes en un solo plano)
        run: |
          # Aplanado del comp, como en After Effects: se compone UNA vez por
          # puesto (presentador enmarcado + foto del coche + capa de orbes en
          # modo screen) y la composicion solo reproduce ese plano. Asi el
          # navegador no compone dos videos a pantalla completa en cada uno
          # de los 900 fotogramas: la captura va bastante mas rapida y el
          # resultado es identico.
          mkdir -p assets/mezcla
          # la voz del presentador, suelta (el video horneado va mudo)
          ffmpeg -v error -y -i assets/clips/talker-slow.mp4 -t 30 -c:a aac -b:a 160k -ac 2 assets/mezcla/voz.m4a
          for N in 1 2 3 4 5; do
            INI=$(node -e "const t={1:22.0,2:16.8,3:11.6,4:6.4,5:1.2}; console.log(t[$N])")
            DUR=$(node -e "const d={1:8.0,2:5.2,3:5.2,4:5.2,5:5.2}; console.log(d[$N])")
            CASE=$(node -e "const c={1:'assets/coches/toyota.jpg',2:'assets/coches/honda.jpg',3:'assets/coches/mercedes.jpg',4:'assets/coches/bmw.jpg',5:'assets/coches/porsche.jpg'}; console.log(c[$N])")
            ffmpeg -v error -y \
              -ss "$INI" -t "$DUR" -i assets/clips/talker-slow.mp4 \
              -ss "$INI" -t "$DUR" -i assets/mezcla/orbes.mp4 \
              -loop 1 -t "$DUR" -i "$CASE" \
              -filter_complex "\
                [0:v]scale=530:940,fps=30,format=rgb24,pad=1080:1920:502:360:color=black[pp];\
                [1:v]scale=1080:1920,fps=30,format=rgb24[oo];\
                [2:v]scale=1080:660:force_original_aspect_ratio=increase,crop=1080:660:0:0,fps=30,eq=brightness=-0.07:saturation=0.92,format=rgb24,pad=1080:1920:0:1260:color=black[cd];\
                [pp][cd]blend=all_mode=screen[pc];\
                [pc][oo]blend=all_mode=screen:all_opacity=1,format=yuv420p[v]" \
              -map "[v]" -c:v libx264 -profile:v baseline -level 3.1 -preset veryfast \
              -crf 21 -pix_fmt yuv420p -r 30 -movflags +faststart "assets/mezcla/plato-$N.mp4"
            echo "plato-$N listo"
          done
          ls -lh assets/mezcla

      # ── 2) HYPERFRAMES: el montaje final ────────────────────────────

      - name: Lint the composition
        run: hf lint .

      - name: Render the final edit with hyperframes
        if: inputs.mode == 'video'
        env:
          QUALITY: ${{ inputs.quality }}
          FILENAME: ${{ inputs.filename }}
          FPS: ${{ inputs.fps }}
        run: |
          # Preview rapido a 15 fps: la composicion declara data-fps y el ticker
          # tienen que ir a la misma cadencia, asi que se ajustan los dos.
          if [ "${FPS:-30}" = "15" ]; then
            sed -i 's/data-fps="30"/data-fps="15"/; s/ticker\.fps(30)/ticker.fps(15)/' \
              compositions/ranking-ref-30s.html
          fi
          hf render \
            --composition compositions/ranking-ref-30s.html \
            --quality "${QUALITY:-high}" \
            --crf 23 \
            --fps "${FPS:-30}" \
            --format mp4 \
            --no-browser-gpu \
            --low-memory-mode \
            --workers 1 \
            --browser-timeout 180 \
            --output "renders/${FILENAME:-ranking-mix-30s.mp4}"

      - name: Snapshot de fotogramas (revision de arte, sin MP4)
        if: inputs.mode == 'frames'
        env:
          AT: ${{ inputs.at }}
        run: |
          # Solo fotogramas: en ~1 min se ve la direccion de arte y se descarga
          # 1 MB en vez de 35 MB. Es el bucle de revision barato.
          mkdir -p renders/stills
          hf snapshot . \
            --composition ranking-ref \
            --at "$AT" \
            --no-end \
            -o renders/stills \
            --browser-timeout 180
          ls -lh renders/stills

      - name: Verify the MP4 (frozen frames + contact sheet)
        if: always() && inputs.qc != 'no' && inputs.mode == 'video'
        env:
          FILENAME: ${{ inputs.filename }}
        run: |
          FILE="renders/${FILENAME:-ranking-mix-30s.mp4}"
          if [ -f "$FILE" ]; then
            node demo2/verify-render.mjs "$FILE" renders/qc
            if ! ffmpeg -hide_banner -filters 2>/dev/null | grep -q drawtext; then
              sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
            fi
            node demo2/contact-sheet.mjs "$FILE" renders/qc/hoja-de-contactos.png
          else
            echo "::warning::No hay MP4 que verificar"
          fi

      - name: Verify the output
        if: always()
        run: |
          node -e '
          const fs = require("node:fs");
          const path = require("node:path");
          const dir = "renders";
          if (!fs.existsSync(dir)) { console.log("No existe renders/"); process.exit(0); }
          for (const f of fs.readdirSync(dir)) {
            const p = path.join(dir, f);
            if (fs.statSync(p).isDirectory()) continue;
            const b = fs.readFileSync(p);
            const audio = b.includes(Buffer.from("mp4a"));
            const i = b.indexOf(Buffer.from("mvhd"));
            let dur = "desconocida";
            if (i >= 0) {
              const ts = b.readUInt32BE(i + 16);
              const dn = b.readUInt32BE(i + 20);
              if (ts > 0) dur = (dn / ts).toFixed(2) + " s";
            }
            console.log("  " + f + "  " + (b.length / 1048576).toFixed(2) + " MB  duracion=" + dur + "  audio=" + (audio ? "SI" : "NO"));
          }
          '

      - name: Upload the rendered video
        if: inputs.mode == 'video'
        uses: actions/upload-artifact@v4
        with:
          name: hyperframes-video
          path: renders/
          if-no-files-found: error
          retention-days: 30

      - name: Upload the stills
        if: inputs.mode == 'frames'
        uses: actions/upload-artifact@v4
        with:
          name: hyperframes-stills
          path: renders/stills/
          if-no-files-found: error
          retention-days: 14

      - name: Upload the QC report
        uses: actions/upload-artifact@v4
        with:
          name: hyperframes-qc
          path: renders/qc/
          if-no-files-found: ignore
          retention-days: 14
