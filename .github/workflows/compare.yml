name: Comparar con el render anterior

# Mide CUÁNTO cambia el diseño respecto a una ejecución anterior, comparando
# los fotogramas de revisión con PSNR y SSIM (las métricas estándar de
# diferencia entre imágenes). Sirve para comprobar que una optimización de
# rendimiento no ha cambiado lo que se ve.
#
# Referencia: por encima de ~40 dB de PSNR y ~0,99 de SSIM la diferencia es
# imperceptible a simple vista.

on:
  workflow_dispatch:
    inputs:
      reference_run:
        description: "ID de la ejecución de la que tomar los fotogramas de referencia"
        type: string
        default: "38842003997"

permissions:
  contents: read
  actions: read

env:
  HYPERFRAMES_VERSION: "0.8.162"

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache de HyperFrames, navegador y fuentes
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache
          key: hf-${{ runner.os }}-${{ env.HYPERFRAMES_VERSION }}
          restore-keys: |
            hf-${{ runner.os }}-

      # Las mismas librerias de edicion que usa el render principal, instaladas
      # en la nube (fuera del proyecto, para no ensuciar el repo).
      - name: Preparar el directorio de librerias
        run: |
          mkdir -p "$HOME/editing-tools"
          echo "EDITING_TOOLS=$HOME/editing-tools" >> "$GITHUB_ENV"

      - name: Cache de las librerias de edicion
        uses: actions/cache@v4
        with:
          path: ${{ env.EDITING_TOOLS }}
          key: editing-tools-node22-v1

      - name: Install the editing libraries
        env:
          HF_VERSION: ${{ env.HYPERFRAMES_VERSION }}
        run: |
          set -e
          TOOLS="$EDITING_TOOLS"
          mkdir -p "$TOOLS"
          cd "$TOOLS"
          node -e '
            const fs = require("fs");
            const deps = {
              hyperframes: process.env.HF_VERSION,
              gsap: "3.15.0",
              sharp: "0.35.5",
              "fluent-ffmpeg": "2.1.3",
              "ffmpeg-static": "5.3.0",
              "ffprobe-static": "3.1.0",
              "animejs": "4.5.0",
              "lottie-web": "5.12.2",
              three: "0.181.2",
              d3: "7.9.0",
              leaflet: "1.9.4",
              "maplibre-gl": "6.15.0",
              "mapbox-gl": "3.33.0",
              typegpu: "0.12.8"
            };
            fs.writeFileSync("package.json", JSON.stringify({
              name: "mi-video-editing-tools",
              private: true,
              version: "1.0.0",
              description: "Librerias de edicion (video, imagen, animacion) para el render en la nube",
              dependencies: deps
            }, null, 2) + "\n");
          '
          npm install --no-audit --no-fund --loglevel=error || echo "::warning::npm install fallo: se sigue con npx"
          cd "$GITHUB_WORKSPACE"
          mkdir -p "$HOME/hfbin"
          cat > "$HOME/hfbin/hf" <<'SH'
          #!/usr/bin/env bash
          LOCAL="${EDITING_TOOLS:-$HOME/editing-tools}/node_modules/.bin/hyperframes"
          if [ -x "$LOCAL" ] && "$LOCAL" --version >/dev/null 2>&1; then
            exec "$LOCAL" "$@"
          fi
          exec npx --yes "hyperframes@${HF_VERSION:-0.8.162}" "$@"
          SH
          chmod +x "$HOME/hfbin/hf"
          echo "$HOME/hfbin" >> "$GITHUB_PATH"
          echo "HF_VERSION=$HF_VERSION" >> "$GITHUB_ENV"
          echo "NODE_PATH=$TOOLS/node_modules" >> "$GITHUB_ENV"

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg

      - name: Snapshot del diseno actual
        run: |
          hf snapshot . \
            --frames 7 \
            --no-browser-gpu \
            --output new-frames

      - name: Descargar los fotogramas de referencia
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.reference_run }}
        run: |
          curl -sSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
            -o artifacts.json
          node -e 'const a = require("./artifacts.json").artifacts.find((x) => x.name === "hyperframes-frames"); if (!a) { console.error("No encontre el artefacto hyperframes-frames en esa ejecucion"); process.exit(1); } require("fs").writeFileSync("url.txt", a.archive_download_url);'
          curl -sSL -H "Authorization: Bearer $GH_TOKEN" "$(cat url.txt)" -o reference.zip
          mkdir -p old-frames
          unzip -q -o reference.zip -d old-frames
          echo "--- referencia ---"
          ls old-frames
          echo "--- actual ---"
          ls new-frames

      - name: Comparar (PSNR y SSIM)
        run: |
          echo "FOTOGRAMA                      PSNR              SSIM"
          echo "---------------------------------------------------------"
          for f in new-frames/frame-*.png; do
            b=$(basename "$f")
            if [ -f "old-frames/$b" ]; then
              p=$(ffmpeg -hide_banner -i "old-frames/$b" -i "new-frames/$b" -lavfi psnr -f null - 2>&1 | grep -o 'average:[^ ]*' | head -1)
              s=$(ffmpeg -hide_banner -i "old-frames/$b" -i "new-frames/$b" -lavfi ssim -f null - 2>&1 | grep -o 'All:[^ ]*' | head -1)
              printf "%-30s %-17s %s\n" "$b" "${p:-n/a}" "${s:-n/a}"
            else
              printf "%-30s (sin referencia con ese nombre)\n" "$b"
            fi
          done

      - name: Guardar los fotogramas nuevos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comparacion-frames-nuevos
          path: new-frames/
          if-no-files-found: ignore
          retention-days: 7
