name: Render video

# Renderiza la composiciÃ³n index.html en la nube de GitHub y publica el MP4
# como artefacto descargable. No requiere instalar nada en tu ordenador.
#
# Optimizado para la mÃ¡quina gratuita de GitHub:
#   * Instala solo ffmpeg y sin paquetes recomendados (las tipografÃ­as van
#     empaquetadas en assets/fonts, no hacen falta las del sistema).
#   * Cachea ~/.npm y ~/.cache para no volver a descargar en cada ejecuciÃ³n
#     el paquete de HyperFrames, su navegador ni las tipografÃ­as.
#   * La versiÃ³n de HyperFrames estÃ¡ fijada, para que el render sea
#     reproducible y no cambie solo porque salga una versiÃ³n nueva.

on:
  # BotÃ³n "Run workflow" en la pestaÃ±a Actions.
  workflow_dispatch:
    inputs:
      quality:
        description: "Calidad del render"
        type: choice
        default: standard
        options:
          - draft
          - standard
          - high
      fps:
        description: "Frames por segundo (1-240)"
        type: string
        default: "30"
      filename:
        description: "Nombre del archivo de salida (se guarda en renders/)"
        type: string
        default: video.mp4
      format:
        description: "Formato de salida"
        type: choice
        default: mp4
        options:
          - mp4
          - webm
          - mov
          - gif
      workers:
        description: "Workers en paralelo (1 = captura en serie con encoding en flujo, que es lo mas rapido aqui)"
        type: string
        default: "1"
      frames:
        description: "Subir fotogramas de revision (anade ~18 s)"
        type: choice
        default: "no"
        options:
          - "no"
          - "si"
      qc:
        description: "Verificar el MP4 (frames congelados + hoja). En modo revision se puede apagar para ganar ~40 s"
        type: choice
        default: "si"
        options:
          - "si"
          - "no"
      composition:
        description: "Archivo de composicion a renderizar (vacio = index.html del proyecto)"
        type: string
        default: ""
      resumable:
        description: "Captura segmentada: si el render se cae, la siguiente ejecucion reutiliza los tramos ya hechos (algo de overhead, pero no se pierde el trabajo)"
        type: choice
        default: "no"
        options:
          - "no"
          - "si"
      frames_cache:
        description: "Reutilizar los fotogramas extraidos de los videos de origen (cachea entre ejecuciones; acelera los rerenders)"
        type: choice
        default: "si"
        options:
          - "si"
          - "no"
      mode:
        description: "Modo: video (entrega) o frames (revision de arte, sin MP4)"
        type: choice
        default: video
        options:
          - video
          - frames
      at:
        description: "Marcas de tiempo del modo frames (segundos, por comas)"
        type: string
        default: "1.2,4.5,8,11.5,16,22.8,25.5"

  # TambiÃ©n se ejecuta solo al cambiar la composiciÃ³n.
  push:
    branches: [main]
    paths:
      - "index.html"
      - "compositions/**"
      - "assets/**"
      - ".github/workflows/render.yml"

permissions:
  contents: read

env:
  HYPERFRAMES_VERSION: "0.8.162"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Evita volver a descargar el paquete de HyperFrames, su navegador
      # headless y las tipografÃ­as en cada ejecuciÃ³n.
      - name: Cache de HyperFrames, navegador y fuentes
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache
          key: hf-${{ runner.os }}-${{ env.HYPERFRAMES_VERSION }}
          restore-keys: |
            hf-${{ runner.os }}-

      # El binario estatico pesa 41 MB y no cambia entre runs: cacheado se
      # restaura en ~1 s en vez de descargarlo cada vez.
      - name: Cache de FFmpeg estatico
        uses: actions/cache@v4
        with:
          path: ~/.cache/ffmpeg-static
          key: ffmpeg-static-johnvansickle-v1

      # Cache de los fotogramas extraidos de los videos de origen: un rerender
      # de la misma pieza no vuelve a extraerlos (el cache se restaura solo si
      # los assets no han cambiado).
      - name: Preparar el cache de fotogramas
        run: mkdir -p "$HOME/.cache/hf-frames"

      - name: Cache de los fotogramas extraidos
        uses: actions/cache@v4
        with:
          path: ${{ env.HOME }}/.cache/hf-frames
          key: hf-frames-${{ runner.os }}-${{ hashFiles('assets/**') }}
          restore-keys: |
            hf-frames-${{ runner.os }}-

      # Las librerias de edicion se instalan aqui, en la nube. El PC del
      # usuario no instala nada. Viven en $HOME/editing-tools (fuera del
      # proyecto) a proposito: un node_modules dentro del proyecto se colaria
      # en el escaneo de assets y en el tamano que se sube al render en la nube.
      - name: Preparar el directorio de librerias
        run: |
          mkdir -p "$HOME/editing-tools"
          echo "EDITING_TOOLS=$HOME/editing-tools" >> "$GITHUB_ENV"

      - name: Cache de las librerias de edicion
        uses: actions/cache@v4
        with:
          path: ${{ env.EDITING_TOOLS }}
          key: editing-tools-node22-v1

      - name: Install the editing libraries
        env:
          HF_VERSION: ${{ env.HYPERFRAMES_VERSION }}
        run: |
          set -e
          TOOLS="$EDITING_TOOLS"
          mkdir -p "$TOOLS"
          cd "$TOOLS"
          # Las versiones van fijadas aqui (no en el repo) para que el render
          # sea reproducible: el mismo hyperframes que usa el lint, el gsap que
          # las composiciones vendorizan y las librerias de imagen y de video.
          node -e '
            const fs = require("fs");
            const deps = {
              hyperframes: process.env.HF_VERSION,
              gsap: "3.15.0",
              sharp: "0.35.5",
              "fluent-ffmpeg": "2.1.3",
              "ffmpeg-static": "5.3.0",
              "ffprobe-static": "3.1.0",
              "animejs": "4.5.0",
              "lottie-web": "5.12.2",
              three: "0.181.2",
              d3: "7.9.0",
              leaflet: "1.9.4",
              "maplibre-gl": "6.15.0",
              "mapbox-gl": "3.33.0",
              typegpu: "0.12.8"
            };
            fs.writeFileSync("package.json", JSON.stringify({
              name: "mi-video-editing-tools",
              private: true,
              version: "1.0.0",
              description: "Librerias de edicion (video, imagen, animacion) para el render en la nube",
              dependencies: deps
            }, null, 2) + "\n");
          '
          npm install --no-audit --no-fund --loglevel=error || echo "::warning::npm install fallo: el render sigue con npx"
          cd "$GITHUB_WORKSPACE"
          # Wrapper "hf": usa la libreria instalada y, si no esta sana, cae al
          # npx de siempre (el render nunca se queda sin CLI).
          mkdir -p "$HOME/hfbin"
          cat > "$HOME/hfbin/hf" <<'SH'
          #!/usr/bin/env bash
          LOCAL="${EDITING_TOOLS:-$HOME/editing-tools}/node_modules/.bin/hyperframes"
          if [ -x "$LOCAL" ] && "$LOCAL" --version >/dev/null 2>&1; then
            exec "$LOCAL" "$@"
          fi
          exec npx --yes "hyperframes@${HF_VERSION:-0.8.162}" "$@"
          SH
          chmod +x "$HOME/hfbin/hf"
          echo "$HOME/hfbin" >> "$GITHUB_PATH"
          echo "HF_VERSION=$HF_VERSION" >> "$GITHUB_ENV"
          echo "NODE_PATH=$TOOLS/node_modules" >> "$GITHUB_ENV"

      # Las skills de HyperFrames (las 21 publicadas + las 6 internas) se
      # instalan en el HOME del runner y se cachean: se descargan una vez.
      - name: HyperFrames skills
        uses: ./.github/actions/hf-skills

      - name: Remotion tools
        uses: ./.github/actions/remotion-tools

      - name: Verify the editing libraries
        run: |
          node -e '
            const fs = require("fs");
            const root = (process.env.EDITING_TOOLS || process.env.HOME + "/editing-tools") + "/node_modules/";
            const names = ["hyperframes","gsap","sharp","fluent-ffmpeg","ffmpeg-static","ffprobe-static","animejs","lottie-web","three","d3","leaflet","maplibre-gl","mapbox-gl","typegpu"];
            let missing = 0;
            for (const n of names) {
              try {
                const p = JSON.parse(fs.readFileSync(root + n + "/package.json", "utf8"));
                console.log("  OK   " + n + "@" + p.version);
              } catch (e) {
                console.log("::warning::no instalada: " + n);
                missing++;
              }
            }
            if (missing) console.log("::warning::faltan " + missing + " librerias");
          '
          # Todo lo vendorizado en assets/vendor tiene que ser IDENTICO a lo que
          # instala npm: si no, el repo y la nube renderizan distinto.
          node demo2/verify-vendor.mjs
          if [ -x "$EDITING_TOOLS/node_modules/ffmpeg-static/ffmpeg" ]; then
            "$EDITING_TOOLS/node_modules/ffmpeg-static/ffmpeg" -version | head -1
          fi

      # HyperFrames llama a ffmpeg y ffprobe desde el PATH para codificar el MP4.
      # Los runners no los traen. Medido: instalarlos por apt cuesta 13-16 s por
      # run (descarga ~50 MB + desempaquetado); el estatico ya cacheado es ~1 s.
      # Si la descarga o el binario fallan, se cae al apt de siempre para que el
      # render no se rompa por esto.
      - name: Install FFmpeg
        run: |
          FF="$HOME/.cache/ffmpeg-static"
          if [ -x "$FF/ffmpeg" ] && "$FF/ffmpeg" -version >/dev/null 2>&1; then
            echo "Binario estatico ya en cache."
          else
            rm -rf "$FF"; mkdir -p "$FF"
            if curl -fsSL --retry 3 --max-time 240 -o /tmp/ff.tar.xz \
                 https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
               && tar -xJf /tmp/ff.tar.xz -C "$FF" --strip-components=1 \
               && chmod +x "$FF/ffmpeg" "$FF/ffprobe" \
               && "$FF/ffmpeg" -version >/dev/null 2>&1; then
              echo "Binario estatico descargado."
            else
              echo "::warning::Fallo el binario estatico; se instala por apt."
              rm -rf "$FF"; mkdir -p "$FF"
              sudo apt-get install -y -qq --no-install-recommends ffmpeg || {
                sudo apt-get update -qq
                sudo apt-get install -y -qq --no-install-recommends ffmpeg
              }
            fi
          fi
          if [ -x "$FF/ffmpeg" ]; then
            export PATH="$FF:$PATH"
            echo "$FF" >> "$GITHUB_PATH"
          fi
          ffmpeg -version | head -1

      # Recorta la mÃºsica a la duraciÃ³n del vÃ­deo y le aplica los fundidos.
      - name: Prepare the soundtrack
        run: |
          mkdir -p assets/audio
          if [ -f assets/audio/music-source.mp3 ]; then
            ffmpeg -y -v error \
              -i assets/audio/music-source.mp3 \
              -t 17.5 \
              -af "afade=t=in:st=0:d=1.0,afade=t=out:st=15.9:d=1.6,volume=0.9" \
              -c:a libmp3lame -q:a 4 -ar 44100 -ac 2 \
              assets/audio/music.mp3
            ls -lh assets/audio/
          else
            echo "::warning::Falta assets/audio/music-source.mp3 - el video saldra sin musica."
          fi

      # Logos y fotos de marca: estan commiteados, pero si faltaran (repo
      # limpio o assets nuevos) se descargan aqui. Asi el render nunca
      # depende de que el asset este en el repo.
      - name: Prepare the brand assets
        run: |
          if [ -f assets/logos/bmw.png ] && [ -f assets/coches/bmw.jpg ]; then
            echo "Logos y fotos ya estan en el repo."
          else
            echo "Faltan assets: se descargan de Wikimedia."
            node demo2/get-logos.mjs || echo "::warning::Fallo la descarga de logos"
            node demo2/get-fotos-coche.mjs || echo "::warning::Fallo la descarga de fotos"
          fi
          ls assets/logos/ assets/coches/ 2>/dev/null | head -20

      # Material NUEVO del reel HUMO: se descarga de Mixkit y se monta aqui, en
      # la nube (recorte 9:16, grado de color, H.264 baseline). El repo solo
      # guarda el manifiesto, asi que el PC del usuario no toca video.
      - name: Preparar el directorio del material nuevo
        run: mkdir -p assets/nuevo/procesado assets/nuevo/inmo/procesado

      - name: Cache del material nuevo
        uses: actions/cache@v4
        with:
          path: assets/nuevo/procesado
          key: nuevo-v6-${{ runner.os }}-${{ hashFiles('assets/nuevo/fuentes.json') }}

      - name: Cache del material de la inmobiliaria
        uses: actions/cache@v4
        with:
          path: assets/nuevo/inmo/procesado
          key: inmo-v1-${{ runner.os }}-${{ hashFiles('assets/nuevo/inmo/fuentes.json') }}

      - name: Prepare the new material
        run: |
          node demo2/preparar-nuevo.mjs assets/nuevo/fuentes.json
          if [ -f assets/nuevo/inmo/fuentes.json ]; then
            node demo2/preparar-nuevo.mjs assets/nuevo/inmo/fuentes.json
          fi

      # El presentador se gradua aqui, en la nube: cuarto oscuro, contraste
      # alto, poca saturacion y una vineta. Asi el plano tiene el aire del
      # video de referencia (luz magenta a la izquierda) sin tocar el PC.
      # Solo hace falta para las piezas que usan assets/clips/talker-*.mp4.
      - name: Graduar al presentador
        if: contains(inputs.composition, 'millonario')
        run: |
          mkdir -p assets/mezcla
          # PLANO 1 (24 s): el plano largo, con su voz.
          ffmpeg -v error -y -i assets/clips/talker-slow.mp4 -t 24 \
            -vf "eq=contrast=1.20:saturation=0.60:brightness=-0.045,colorbalance=rs=0.07:rm=-0.03:bs=-0.03,vignette=angle=PI/4" \
            -c:v libx264 -profile:v baseline -level 3.1 -preset veryfast -crf 20 \
            -pix_fmt yuv420p -r 30 -c:a aac -b:a 160k -ac 2 -movflags +faststart \
            assets/mezcla/presentador-1.mp4
          # PLANO 2 (6,2 s): otro take, mas cerrado y mas frio (el corte final).
          ffmpeg -v error -y -i assets/clips/talker.mp4 -t 6.2 \
            -vf "scale=1188:2112,crop=1080:1920:0:96,eq=contrast=1.16:saturation=0.42:brightness=-0.055,colorbalance=bs=0.10:rs=-0.04,vignette=angle=PI/4" \
            -c:v libx264 -profile:v baseline -level 3.1 -preset veryfast -crf 20 \
            -pix_fmt yuv420p -r 30 -c:a aac -b:a 160k -ac 2 -movflags +faststart \
            assets/mezcla/presentador-2.mp4
          ls -lh assets/mezcla/

      - name: Lint the composition
        # "hf" = la libreria de HyperFrames instalada en la nube (misma version
        # fijada que el lint); si no esta, cae al npx de siempre.
        run: node demo2/lint-ci.mjs

      - name: Render
        if: inputs.mode == 'video'
        env:
          QUALITY: ${{ inputs.quality }}
          FPS: ${{ inputs.fps }}
          FILENAME: ${{ inputs.filename }}
          FORMAT: ${{ inputs.format }}
          WORKERS: ${{ inputs.workers }}
          COMPOSITION: ${{ inputs.composition }}
          RESUMABLE: ${{ inputs.resumable }}
          FRAMES_CACHE: ${{ inputs.frames_cache }}
        run: |
          # Con 1 worker HyperFrames usa "streaming encode" (los fotogramas van
          # a ffmpeg segun se capturan). Con 4 workers medidos: captura 116 s
          # + encoding aparte 55 s = 171 s, peor que 146 s en serie.
          # --low-memory-mode fija 1 worker y captura por pantalla (lo que ya
          # usamos) y ademas se salta la calibracion de workers, que tardaba
          # 14-20 s. La imagen no cambia.
          # --composition permite renderizar otra pieza distinta de index.html
          # (p. ej. una demo) sin tocar la composicion principal.
          #
          # PERFORMANCIO (runner de 4 vCPU, sin GPU):
          #  * --browser-timeout 180: las paginas con 11 videos + fuentes tardan
          #    mas de los 60 s por defecto en un runner lento, y el render se
          #    cae entero. Subirlo es seguro: solo evita que caduque.
          #  * --frames-cache-dir: cache de fotogramas extraidos de los videos
          #    de origen. El cache se guarda entre ejecuciones, asi que un
          #    rerender de la misma pieza no vuelve a extraerlos.
          #  * --resume (captura segmentada): cada tramo se graba por separado;
          #    si el render se cae, la siguiente ejecucion reutiliza los tramos
          #    ya terminados en vez de empezar de cero. Cuesta algo de overhead,
          #    por eso es opcional.
          #  * NO --page-side-compositing: es 6x mas rapido SOLO con shader
          #    transitions, y necesita WebGL. Con --no-browser-gpu el WebGL cae
          #    a software y sale mas lento que el blend de Node.
          COMPOSITION_ARGS=""
          if [ -n "${COMPOSITION:-}" ]; then
            COMPOSITION_ARGS="--composition ${COMPOSITION}"
          fi
          CACHE_ARGS=""
          if [ "${FRAMES_CACHE:-si}" = "si" ]; then
            mkdir -p "$HOME/.cache/hf-frames"
            CACHE_ARGS="--frames-cache-dir $HOME/.cache/hf-frames"
          fi
          RESUME_ARGS=""
          if [ "${RESUMABLE:-no}" = "si" ]; then
            export HF_SEGMENTED_CAPTURE=true
            RESUME_ARGS="--resume --keep-segments"
          fi
          hf render \
            $COMPOSITION_ARGS \
            --quality "${QUALITY:-standard}" \
            --crf 23 \
            --fps "${FPS:-30}" \
            --format "${FORMAT:-mp4}" \
            --no-browser-gpu \
            --low-memory-mode \
            --workers "${WORKERS:-1}" \
            --browser-timeout 180 \
            $CACHE_ARGS \
            $RESUME_ARGS \
            --output "renders/${FILENAME:-video.mp4}"

      # Verificacion del MP4 TODO EN LA NUBE: perfil de movimiento (fotogramas
      # congelados) y hoja de contactos con timecodes. El PC del usuario no
      # analiza nada: solo descarga el resultado del artifact.
      # Solo fotogramas: en ~1 min se ve la direccion de arte y se descarga
      # 1 MB en vez de 35 MB. Es el bucle de revision barato.
      - name: Snapshot de fotogramas (revision de arte, sin MP4)
        if: inputs.mode == 'frames'
        env:
          AT: ${{ inputs.at }}
        run: |
          mkdir -p renders/stills
          hf snapshot . \
            --composition millonario \
            --at "$AT" \
            --no-end \
            -o renders/stills \
            --no-browser-gpu \
            --browser-timeout 180
          ls -lh renders/stills

      - name: Verify the MP4 (frozen frames + contact sheet)
        if: always() && inputs.qc != 'no' && inputs.mode == 'video'
        env:
          FILENAME: ${{ inputs.filename }}
        run: |
          FILE="renders/${FILENAME:-video.mp4}"
          if [ -f "$FILE" ]; then
            node demo2/verify-render.mjs "$FILE" renders/qc
            # La hoja con timecodes necesita el filtro drawtext: el ffmpeg estatico
            # no lo trae (sin libfreetype), asi que se usa el de apt para esto.
            if ! ffmpeg -hide_banner -filters 2>/dev/null | grep -q drawtext; then
              echo "El ffmpeg activo no trae drawtext: se instala el de apt para la hoja."
              sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
            fi
            node demo2/contact-sheet.mjs "$FILE" renders/qc/hoja-de-contactos.png
          else
            echo "::warning::No hay MP4 que verificar"
          fi

      - name: Capture review frames
        # Los fotogramas de revisiÃ³n cuestan ~18 s de render aparte: solo se
        # generan si se piden a mano desde "Run workflow".
        if: ${{ inputs.frames == 'si' }}
        continue-on-error: true
        env:
          FPS: ${{ inputs.fps }}
        run: |
          hf snapshot . \
            --frames 7 \
            --no-browser-gpu \
            --output snapshots

      # Comprueba duraciÃ³n y pista de audio leyendo la cabecera del MP4,
      # sin necesitar ffprobe. Si algo falta, avisa en el resumen.
      - name: Verify the output
        if: always()
        run: |
          node -e '
          const fs = require("node:fs");
          const path = require("node:path");
          const dir = "renders";
          if (!fs.existsSync(dir)) { console.log("No existe renders/ - el render no llego a producir archivo."); process.exit(0); }
          const files = fs.readdirSync(dir);
          if (files.length === 0) { console.log("renders/ esta vacio - el render no produjo nada."); process.exit(0); }
          for (const f of files) {
            const p = path.join(dir, f);
            if (fs.statSync(p).isDirectory()) continue;
            const b = fs.readFileSync(p);
            const audio = b.includes(Buffer.from("mp4a"));
            const i = b.indexOf(Buffer.from("mvhd"));
            let dur = "desconocida";
            if (i >= 0) {
              const ts = b.readUInt32BE(i + 16);
              const dn = b.readUInt32BE(i + 20);
              if (ts > 0) dur = (dn / ts).toFixed(2) + " s";
            }
            console.log("  " + f + "  " + (b.length / 1048576).toFixed(2) + " MB  duracion=" + dur + "  audio=" + (audio ? "SI" : "NO"));
            if (!audio) console.log("::warning::" + f + " no tiene pista de audio.");
          }
          '

      - name: Upload the rendered video
        if: inputs.mode == 'video'
        uses: actions/upload-artifact@v4
        with:
          name: hyperframes-video
          path: renders/
          if-no-files-found: error
          retention-days: 30

      - name: Upload the stills
        if: inputs.mode == 'frames'
        uses: actions/upload-artifact@v4
        with:
          name: hyperframes-stills
          path: renders/stills/
          if-no-files-found: error
          retention-days: 14

      - name: Upload the QC report
        # Hoja de contactos + fotogramas clave del MP4 ya verificado.
        uses: actions/upload-artifact@v4
        with:
          name: hyperframes-qc
          path: renders/qc/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload review frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyperframes-frames
          path: snapshots/
          if-no-files-found: ignore
          retention-days: 14


