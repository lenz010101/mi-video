name: Render video

# Renderiza la composición index.html en la nube de GitHub y publica el MP4
# como artefacto descargable. No requiere instalar nada en tu ordenador.

on:
  # Botón "Run workflow" en la pestaña Actions.
  workflow_dispatch:
    inputs:
      quality:
        description: "Calidad del render"
        type: choice
        default: standard
        options:
          - draft
          - standard
          - high
      fps:
        description: "Frames por segundo (1-240)"
        type: string
        default: "30"
      filename:
        description: "Nombre del archivo de salida (se guarda en renders/)"
        type: string
        default: video.mp4
      format:
        description: "Formato de salida"
        type: choice
        default: mp4
        options:
          - mp4
          - webm
          - mov
          - gif

  # También se ejecuta solo al cambiar la composición.
  push:
    branches: [main]
    paths:
      - "index.html"
      - "compositions/**"
      - "assets/**"
      - ".github/workflows/render.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core

      - name: Prepare the soundtrack
        run: |
          mkdir -p assets/audio
          if [ -f assets/audio/music-source.mp3 ]; then
            ffmpeg -y -v error \
              -i assets/audio/music-source.mp3 \
              -t 17.5 \
              -af "afade=t=in:st=0:d=1.0,afade=t=out:st=15.9:d=1.6,volume=0.9" \
              -c:a libmp3lame -q:a 4 -ar 44100 -ac 2 \
              assets/audio/music.mp3
            echo "Pista lista:"
            ls -lh assets/audio/
          else
            echo "::warning::No hay assets/audio/music-source.mp3 — el vídeo saldrá sin música."
          fi

      - name: Show the official data-attribute reference
        continue-on-error: true
        run: npx --yes hyperframes@latest docs data-attributes

      - name: Lint the composition
        run: npx --yes hyperframes@latest lint .

      - name: Render
        env:
          QUALITY: ${{ inputs.quality }}
          FPS: ${{ inputs.fps }}
          FILENAME: ${{ inputs.filename }}
          FORMAT: ${{ inputs.format }}
        run: |
          npx --yes hyperframes@latest render \
            --quality "${QUALITY:-standard}" \
            --fps "${FPS:-30}" \
            --format "${FORMAT:-mp4}" \
            --no-browser-gpu \
            --output "renders/${FILENAME:-video.mp4}"

      - name: Capture review frames
        continue-on-error: true
        env:
          FPS: ${{ inputs.fps }}
        run: |
          npx --yes hyperframes@latest snapshot . \
            --frames 7 \
            --no-browser-gpu \
            --output snapshots

      - name: Verify the output streams
        if: always()
        run: |
          for f in renders/*; do
            echo "== $f"
            ffprobe -v error \
              -show_entries stream=codec_type,codec_name,width,height,channels \
              -show_entries format=duration,size \
              -of default=noprint_wrappers=1 "$f" || true
          done

      - name: Upload the rendered video
        uses: actions/upload-artifact@v4
        with:
          name: hyperframes-video
          path: renders/
          if-no-files-found: error
          retention-days: 30

      - name: Upload review frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyperframes-frames
          path: snapshots/
          if-no-files-found: ignore
          retention-days: 14
