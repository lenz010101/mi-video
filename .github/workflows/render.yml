name: Render video

# Renderiza la composición index.html en la nube de GitHub y publica el MP4
# como artefacto descargable. No requiere instalar nada en tu ordenador.
#
# Optimizado para la máquina gratuita de GitHub:
#   * Instala solo ffmpeg y sin paquetes recomendados (las tipografías van
#     empaquetadas en assets/fonts, no hacen falta las del sistema).
#   * Cachea ~/.npm y ~/.cache para no volver a descargar en cada ejecución
#     el paquete de HyperFrames, su navegador ni las tipografías.
#   * La versión de HyperFrames está fijada, para que el render sea
#     reproducible y no cambie solo porque salga una versión nueva.

on:
  # Botón "Run workflow" en la pestaña Actions.
  workflow_dispatch:
    inputs:
      quality:
        description: "Calidad del render"
        type: choice
        default: standard
        options:
          - draft
          - standard
          - high
      fps:
        description: "Frames por segundo (1-240)"
        type: string
        default: "30"
      filename:
        description: "Nombre del archivo de salida (se guarda en renders/)"
        type: string
        default: video.mp4
      format:
        description: "Formato de salida"
        type: choice
        default: mp4
        options:
          - mp4
          - webm
          - mov
          - gif
      workers:
        description: "Workers en paralelo (1 = captura en serie con encoding en flujo, que es lo mas rapido aqui)"
        type: string
        default: "1"
      frames:
        description: "Subir fotogramas de revision (anade ~18 s)"
        type: choice
        default: "no"
        options:
          - "no"
          - "si"
      composition:
        description: "Archivo de composicion a renderizar (vacio = index.html del proyecto)"
        type: string
        default: ""

  # También se ejecuta solo al cambiar la composición.
  push:
    branches: [main]
    paths:
      - "index.html"
      - "compositions/**"
      - "assets/**"
      - ".github/workflows/render.yml"

permissions:
  contents: read

env:
  HYPERFRAMES_VERSION: "0.8.162"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Evita volver a descargar el paquete de HyperFrames, su navegador
      # headless y las tipografías en cada ejecución.
      - name: Cache de HyperFrames, navegador y fuentes
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache
          key: hf-${{ runner.os }}-${{ env.HYPERFRAMES_VERSION }}
          restore-keys: |
            hf-${{ runner.os }}-

      # El binario estatico pesa 41 MB y no cambia entre runs: cacheado se
      # restaura en ~1 s en vez de descargarlo cada vez.
      - name: Cache de FFmpeg estatico
        uses: actions/cache@v4
        with:
          path: ~/.cache/ffmpeg-static
          key: ffmpeg-static-johnvansickle-v1

      # HyperFrames llama a ffmpeg y ffprobe desde el PATH para codificar el MP4.
      # Los runners no los traen. Medido: instalarlos por apt cuesta 13-16 s por
      # run (descarga ~50 MB + desempaquetado); el estatico ya cacheado es ~1 s.
      # Si la descarga o el binario fallan, se cae al apt de siempre para que el
      # render no se rompa por esto.
      - name: Install FFmpeg
        run: |
          FF="$HOME/.cache/ffmpeg-static"
          if [ -x "$FF/ffmpeg" ] && "$FF/ffmpeg" -version >/dev/null 2>&1; then
            echo "Binario estatico ya en cache."
          else
            rm -rf "$FF"; mkdir -p "$FF"
            if curl -fsSL --retry 3 --max-time 240 -o /tmp/ff.tar.xz \
                 https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
               && tar -xJf /tmp/ff.tar.xz -C "$FF" --strip-components=1 \
               && chmod +x "$FF/ffmpeg" "$FF/ffprobe" \
               && "$FF/ffmpeg" -version >/dev/null 2>&1; then
              echo "Binario estatico descargado."
            else
              echo "::warning::Fallo el binario estatico; se instala por apt."
              rm -rf "$FF"; mkdir -p "$FF"
              sudo apt-get install -y -qq --no-install-recommends ffmpeg || {
                sudo apt-get update -qq
                sudo apt-get install -y -qq --no-install-recommends ffmpeg
              }
            fi
          fi
          if [ -x "$FF/ffmpeg" ]; then
            export PATH="$FF:$PATH"
            echo "$FF" >> "$GITHUB_PATH"
          fi
          ffmpeg -version | head -1

      # Recorta la música a la duración del vídeo y le aplica los fundidos.
      - name: Prepare the soundtrack
        run: |
          mkdir -p assets/audio
          if [ -f assets/audio/music-source.mp3 ]; then
            ffmpeg -y -v error \
              -i assets/audio/music-source.mp3 \
              -t 17.5 \
              -af "afade=t=in:st=0:d=1.0,afade=t=out:st=15.9:d=1.6,volume=0.9" \
              -c:a libmp3lame -q:a 4 -ar 44100 -ac 2 \
              assets/audio/music.mp3
            ls -lh assets/audio/
          else
            echo "::warning::Falta assets/audio/music-source.mp3 - el video saldra sin musica."
          fi

      - name: Lint the composition
        run: npx --yes hyperframes@${{ env.HYPERFRAMES_VERSION }} lint .

      - name: Render
        env:
          QUALITY: ${{ inputs.quality }}
          FPS: ${{ inputs.fps }}
          FILENAME: ${{ inputs.filename }}
          FORMAT: ${{ inputs.format }}
          WORKERS: ${{ inputs.workers }}
          COMPOSITION: ${{ inputs.composition }}
        run: |
          # Con 1 worker HyperFrames usa "streaming encode" (los fotogramas van
          # a ffmpeg segun se capturan). Con 4 workers medidos: captura 116 s
          # + encoding aparte 55 s = 171 s, peor que 146 s en serie.
          # --low-memory-mode fija 1 worker y captura por pantalla (lo que ya
          # usamos) y ademas se salta la calibracion de workers, que tardaba
          # 14-20 s. La imagen no cambia.
          # --composition permite renderizar otra pieza distinta de index.html
          # (p. ej. una demo) sin tocar la composicion principal.
          COMPOSITION_ARGS=""
          if [ -n "${COMPOSITION:-}" ]; then
            COMPOSITION_ARGS="--composition ${COMPOSITION}"
          fi
          npx --yes hyperframes@${{ env.HYPERFRAMES_VERSION }} render \
            $COMPOSITION_ARGS \
            --quality "${QUALITY:-standard}" \
            --fps "${FPS:-30}" \
            --format "${FORMAT:-mp4}" \
            --no-browser-gpu \
            --low-memory-mode \
            --workers "${WORKERS:-1}" \
            --output "renders/${FILENAME:-video.mp4}"

      - name: Capture review frames
        # Los fotogramas de revisión cuestan ~18 s de render aparte: solo se
        # generan si se piden a mano desde "Run workflow".
        if: ${{ inputs.frames == 'si' }}
        continue-on-error: true
        env:
          FPS: ${{ inputs.fps }}
        run: |
          npx --yes hyperframes@${{ env.HYPERFRAMES_VERSION }} snapshot . \
            --frames 7 \
            --no-browser-gpu \
            --output snapshots

      # Comprueba duración y pista de audio leyendo la cabecera del MP4,
      # sin necesitar ffprobe. Si algo falta, avisa en el resumen.
      - name: Verify the output
        if: always()
        run: |
          node -e '
          const fs = require("node:fs");
          const path = require("node:path");
          const dir = "renders";
          if (!fs.existsSync(dir)) { console.log("No existe renders/ - el render no llego a producir archivo."); process.exit(0); }
          const files = fs.readdirSync(dir);
          if (files.length === 0) { console.log("renders/ esta vacio - el render no produjo nada."); process.exit(0); }
          for (const f of files) {
            const b = fs.readFileSync(path.join(dir, f));
            const audio = b.includes(Buffer.from("mp4a"));
            const i = b.indexOf(Buffer.from("mvhd"));
            let dur = "desconocida";
            if (i >= 0) {
              const ts = b.readUInt32BE(i + 16);
              const dn = b.readUInt32BE(i + 20);
              if (ts > 0) dur = (dn / ts).toFixed(2) + " s";
            }
            console.log("  " + f + "  " + (b.length / 1048576).toFixed(2) + " MB  duracion=" + dur + "  audio=" + (audio ? "SI" : "NO"));
            if (!audio) console.log("::warning::" + f + " no tiene pista de audio.");
          }
          '

      - name: Upload the rendered video
        uses: actions/upload-artifact@v4
        with:
          name: hyperframes-video
          path: renders/
          if-no-files-found: error
          retention-days: 30

      - name: Upload review frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyperframes-frames
          path: snapshots/
          if-no-files-found: ignore
          retention-days: 14
