<!DOCTYPE html>
<html lang="es" data-composition-variables='[
  {"id":"t1","type":"string","label":"Barra 1","default":"POBRE"},
  {"id":"t2","type":"string","label":"Barra 2","default":"RICO"},
  {"id":"t3","type":"string","label":"Barra 3","default":"MILLONARIO"},
  {"id":"nombres","type":"string","label":"Nombres de marca","default":"Mercedes-Benz|PORSCHE|HONDA|CHRYSLER|NISSAN|LEXUS|TOYOTA"},
  {"id":"colores","type":"string","label":"Color de cada nombre","default":"#E9EDF2|#D5001C|#CC0000|#F5C518|#111111|#C9CDD2|#EB0A1E"},
  {"id":"palabras","type":"string","label":"Palabras","default":"pierden|el valor|todos|los años|años|es|que|que siempre|recomiendo|si quieres|mezclar|y|y confiabilidad|mantienen|muy bien|su valor|compra|para el|futuro|y si tú|quieres bajar|tus pagos|y tus|intereses|y mi equipo|miraremos|tu caso|y te daremos|los mejores|números"},
  {"id":"presentador1","type":"string","label":"Plano 1","default":"assets/mezcla/presentador-1.mp4"},
  {"id":"presentador2","type":"string","label":"Plano 2","default":"assets/mezcla/presentador-2.mp4"},
  {"id":"musica","type":"string","label":"Musica","default":"assets/audio/music-30s.mp3"}
]'>
<head>
<meta charset="utf-8">
<title>Top 5 coches de los millonarios - clon de referencia</title>
<style>
  @font-face { font-family:'Anton'; font-style:normal; font-weight:400;
    src:url('../assets/fonts/anton-400.woff2') format('woff2'); }
  @font-face { font-family:'Inter'; font-style:normal; font-weight:800;
    src:url('../assets/fonts/inter-800.woff2') format('woff2'); }
  @font-face { font-family:'Playfair'; font-style:normal; font-weight:600;
    src:url('../assets/fonts/playfair+display-600.woff2') format('woff2'); }

  :root{
    --rojo:#FF2A2A; --azul:#35C8FF; --oro:#FFC02A;
    --fondo:#07070A;
  }
  html,body{ margin:0; padding:0; background:var(--fondo); }
  body{ width:1080px; height:1920px; overflow:hidden; }

  /* ── El presentador a pantalla completa ─────────────────────────── */
  .plano{ position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; opacity:0; will-change:opacity; }

  /* ── Barra de neón arriba: tres paneles + tiras de LED ──────────── */
  .barra{ position:absolute; left:0; top:0; width:1080px; height:168px;
    display:flex; align-items:center; opacity:0; will-change:opacity; }
  .p1{ width:378px; height:168px; background:linear-gradient(90deg,#2A0606 0%,#5C0F0F 55%,#7C1414 100%);
    display:flex; align-items:center; justify-content:center; }
  .p2{ width:300px; height:168px; background:linear-gradient(90deg,#0A2FB8 0%,#1447E8 45%,#0A2FB8 100%);
    display:flex; align-items:center; justify-content:center; }
  .p3{ width:402px; height:168px; background:linear-gradient(90deg,#2E1B05 0%,#5A3A0A 55%,#7A5210 100%);
    display:flex; align-items:center; justify-content:center; }
  .led{ width:20px; height:168px;
    background:repeating-linear-gradient(180deg,#FFFFFF 0 12px,#1A1A22 12px 20px);
    opacity:.92; }
  .neon{ font-family:'Anton',sans-serif; font-size:56px; letter-spacing:.02em;
    will-change:opacity; }
  .n-rojo{ color:var(--rojo); text-shadow:0 0 14px rgba(255,42,42,.95), 0 0 44px rgba(255,0,0,.65); }
  .n-azul{ color:var(--azul); text-shadow:0 0 14px rgba(53,200,255,.95), 0 0 44px rgba(0,120,255,.7); }
  .n-oro{ color:var(--oro); text-shadow:0 0 14px rgba(255,192,42,.95), 0 0 44px rgba(255,150,0,.6); }

  /* ── Logos de marca (cromados) ──────────────────────────────────── */
  .logo{ position:absolute; opacity:0; will-change:opacity,transform;
    filter:grayscale(1) brightness(1.45) contrast(1.12) drop-shadow(0 4px 10px rgba(0,0,0,.65)); }
  .logo-color{ position:absolute; opacity:0; will-change:opacity,transform;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.65)); }
  .logo, .logo-color{ will-change:opacity,transform; }

  /* ── El nombre de marca grande, abajo a la izquierda ───────────── */
  .nombre{ position:absolute; left:150px; top:1390px; font-family:'Anton',sans-serif;
    font-size:118px; line-height:1; letter-spacing:.005em; white-space:nowrap;
    opacity:0; text-shadow:0 10px 34px rgba(0,0,0,.85); will-change:opacity,transform; }
  /* El sticker rasgado (NISSAN): un recorte irregular con borde duro */
  .sticker{ position:absolute; left:132px; top:1372px; width:520px; height:158px;
    background:#F4F4F0; opacity:0; will-change:opacity,transform;
    clip-path:polygon(2% 18%,8% 4%,16% 14%,24% 2%,33% 12%,42% 3%,52% 13%,61% 2%,71% 11%,80% 1%,89% 12%,98% 5%,100% 26%,97% 42%,100% 58%,96% 74%,99% 88%,90% 96%,81% 88%,72% 98%,62% 89%,52% 97%,43% 88%,33% 98%,24% 89%,14% 97%,6% 86%,1% 70%,4% 54%,0% 38%); }
  .nombre-negro{ color:#0C0C0C; }
  .nombre-serif{ font-family:'Playfair',serif; font-size:104px; letter-spacing:.01em; }

  /* ── Las palabras: abajo a la derecha ───────────────────────────── */
  .palabra{ position:absolute; right:170px; top:1150px; font-family:'Inter',sans-serif;
    font-weight:800; font-size:64px; letter-spacing:-.015em; color:#FFFFFF;
    text-shadow:0 4px 18px rgba(0,0,0,.8), 0 1px 2px rgba(0,0,0,.9);
    white-space:nowrap; opacity:0; will-change:opacity,transform; }

  /* ── Ambiente ───────────────────────────────────────────────────── */
  .glow{ position:absolute; left:-18%; top:6%; width:78%; height:78%;
    background:radial-gradient(ellipse 52% 50% at 42% 42%, rgba(255,42,110,.30) 0%, rgba(255,20,90,.10) 45%, transparent 72%);
    opacity:0; pointer-events:none; will-change:opacity,transform; }
  .vineta{ position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(118% 78% at 46% 42%, rgba(0,0,0,0) 42%, rgba(0,0,0,.58) 100%); }
  /* La esquina inferior en diagonal */
  .diagonal{ position:absolute; left:0; bottom:0; width:1080px; height:330px; pointer-events:none;
    background:linear-gradient(to top right, rgba(4,4,6,.97) 0%, rgba(4,4,6,.97) 42%, rgba(4,4,6,0) 43%, transparent 100%); }
  .flash{ position:absolute; inset:0; background:#FFE9B0; opacity:0; pointer-events:none;
    will-change:opacity; }
</style>
</head>
<body>

<div id="root" data-composition-id="millonario" data-start="0" data-duration="30" data-width="1080" data-height="1920" data-fps="30">

  <!-- Los dos planos del presentador (graduados en la nube) -->
  <video id="p1" class="plano clip" data-start="0" data-duration="24" data-track-index="0"
    data-var-src="presentador1" src="assets/mezcla/presentador-1.mp4" data-has-audio playsinline></video>
  <video id="p2" class="plano clip" data-start="24" data-duration="6" data-track-index="0"
    data-var-src="presentador2" src="assets/mezcla/presentador-2.mp4" data-has-audio playsinline></video>

  <!-- La barra de neón -->
  <div class="barra" id="barra">
    <div class="p1"><span class="neon n-rojo" id="t1">POBRE</span></div>
    <div class="led"></div>
    <div class="p2"><span class="neon n-azul" id="t2">RICO</span></div>
    <div class="led"></div>
    <div class="p3"><span class="neon n-oro" id="t3">MILLONARIO</span></div>
  </div>

  <!-- Los logos de marca, uno a uno -->
  <img id="lgAudi"     class="logo"      style="left:620px; top:190px;  width:230px;" src="assets/logos/audi.png" alt="">
  <img id="lgBmw"      class="logo"      style="left:860px; top:190px;  width:170px;" src="assets/logos/bmw.png" alt="">
  <img id="lgMercedes" class="logo"      style="left:610px; top:400px;  width:330px;" src="assets/logos/mercedes.png" alt="">
  <img id="lgPorsche"  class="logo"      style="left:850px; top:400px;  width:210px;" src="assets/logos/porsche.png" alt="">
  <img id="lgHonda"    class="logo"      style="left:625px; top:610px;  width:250px;" src="assets/logos/honda.png" alt="">
  <img id="lgNissan"   class="logo"      style="left:855px; top:610px;  width:190px;" src="assets/logos/nissan.png" alt="">
  <img id="lgLexus"    class="logo"      style="left:630px; top:820px;  width:230px;" src="assets/logos/lexus.png" alt="">
  <img id="lgToyota"   class="logo" style="left:855px; top:820px;  width:200px; filter:drop-shadow(0 4px 10px rgba(0,0,0,.65));" src="assets/logos/toyota.png" alt="">

  <!-- Los nombres de marca -->
  <div class="nombre nombre-serif" id="nom0">Mercedes-Benz</div>
  <div class="nombre" id="nom1">PORSCHE</div>
  <div class="nombre" id="nom2">HONDA</div>
  <div class="nombre" id="nom3">CHRYSLER</div>
  <div class="sticker" id="stic4"></div>
  <div class="nombre nombre-negro" id="nom4">NISSAN</div>
  <div class="nombre nombre-serif" id="nom5">LEXUS</div>
  <div class="nombre" id="nom6">TOYOTA</div>

  <!-- Ambiente -->
  <div class="glow" id="glow"></div>
  <div class="vineta"></div>
  <div class="diagonal"></div>
  <div class="flash" id="flash"></div>

  <!-- Musica por debajo de la voz -->
  <audio id="musica" class="clip" data-start="0" data-duration="30" data-track-index="9"
    data-var-src="musica" src="assets/audio/music-30s.mp3" data-volume="0.2"></audio>
</div>

<script src="../assets/vendor/gsap.min.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════════════
   CLON DE REFERENCIA: el mismo montaje que el video original del usuario
   (barra de neon POBRE | RICO | MILLONARIO, logos que entran uno a uno,
   nombre de marca grande como sticker, palabras sueltas y corte final a
   otro plano). El presentador es el nuestro, graduado en la nube para que
   el cuarto tenga el mismo aire oscuro con luz magenta.
   ══════════════════════════════════════════════════════════════════════ */
(function () {
  const V = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
  const txt = (id, def) => (V && V[id] != null && V[id] !== '') ? String(V[id]) : def;
  const setTxt = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };

  setTxt('t1', txt('t1', 'POBRE'));
  setTxt('t2', txt('t2', 'RICO'));
  setTxt('t3', txt('t3', 'MILLONARIO'));

  const NOMBRES = txt('nombres', 'Mercedes-Benz|PORSCHE|HONDA|CHRYSLER|NISSAN|LEXUS|TOYOTA').split('|');
  const COLORES = txt('colores', '#E9EDF2|#D5001C|#CC0000|#F5C518|#111111|#C9CDD2|#EB0A1E').split('|');
  for (let i = 0; i < 7; i++) {
    const e = document.getElementById('nom' + i);
    if (e) {
      e.textContent = NOMBRES[i] || e.textContent;
      e.style.color = COLORES[i] || '#FFFFFF';
    }
  }

  const PALABRAS = txt('palabras', '').split('|').filter(function (s) { return s.length; });

  const tl = gsap.timeline({ paused: true });

  /* ── Planos ────────────────────────────────────────────────────── */
  tl.fromTo('#p1', { opacity: 0 }, { opacity: 1, duration: .4, ease: 'power1.out' }, 0);
  tl.fromTo('#p2', { opacity: 0 }, { opacity: 1, duration: .12, ease: 'none' }, 24);

  /* ── La barra entra y se va en el corte ────────────────────────── */
  tl.fromTo('#barra', { opacity: 0 }, { opacity: 1, duration: .35, ease: 'power1.out' }, .05);
  tl.to('#barra', { opacity: 0, duration: .25, ease: 'power2.in' }, 23.75);

  /* ── Los logos: entran uno a uno, en cadena ─────────────────────── */
  const logos = [
    { id: '#lgAudi', t: .6 }, { id: '#lgMercedes', t: 1.7 }, { id: '#lgBmw', t: 3.0 },
    { id: '#lgPorsche', t: 4.3 }, { id: '#lgHonda', t: 5.8 }, { id: '#lgNissan', t: 7.3 },
    { id: '#lgLexus', t: 8.8 }, { id: '#lgToyota', t: 10.3 }
  ];
  for (const l of logos) {
    tl.fromTo(l.id, { opacity: 0, scale: .55, rotation: -8 },
      { opacity: 1, scale: 1, rotation: 0, duration: .55, ease: 'back.out(1.9)' }, l.t);
  }
  /* y se van todos en el corte */
  tl.to('.logo', { opacity: 0, duration: .25, ease: 'power2.in' }, 23.75);

  /* ── Los nombres de marca, uno detras de otro ──────────────────── */
  const nombres = [
    { id: '#nom0', t: .3, d: 3.1 }, { id: '#nom1', t: 3.6, d: 2.2 }, { id: '#nom2', t: 6.0, d: 2.2 },
    { id: '#nom3', t: 8.4, d: 2.2 }, { id: '#nom4', t: 10.8, d: 2.2 }, { id: '#nom5', t: 13.2, d: 2.2 },
    { id: '#nom6', t: 15.6, d: 2.2 }
  ];
  for (const n of nombres) {
    tl.fromTo(n.id, { opacity: 0, y: 34, scale: .92 },
      { opacity: 1, y: 0, scale: 1, duration: .5, ease: 'power3.out' }, n.t);
    tl.to(n.id, { opacity: 0, y: -18, duration: .35, ease: 'power2.in' }, n.t + n.d);
  }
  /* el sticker de NISSAN sale con su nombre */
  tl.fromTo('#stic4', { opacity: 0, scale: .9 },
    { opacity: 1, scale: 1, duration: .45, ease: 'power3.out' }, 10.8);
  tl.to('#stic4', { opacity: 0, duration: .35, ease: 'power2.in' }, 13.0);

  /* ── Las palabras: al ritmo del habla ──────────────────────────── */
  /* antes del corte: ~0.85 s por palabra; despues: ~0.65 s */
  const antes = 7.6, gap1 = .85, gap2 = .65, corte = 24.0;
  let t = antes;
  for (let i = 0; i < PALABRAS.length; i++) {
    const es = 'pal' + i;
    let el = document.getElementById(es);
    if (!el) {
      el = document.createElement('div');
      el.className = 'palabra';
      el.id = es;
      el.textContent = PALABRAS[i];
      document.getElementById('root').appendChild(el);
    }
    const dur = t < corte ? gap1 : gap2;
    tl.fromTo(el, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: .22, ease: 'power2.out' }, t);
    tl.to(el, { opacity: 0, duration: .28, ease: 'power2.in' }, t + dur - .28);
    t += dur;
    if (t > 29.6) break;
  }

  /* ── El destello calido antes del corte ────────────────────────── */
  tl.fromTo('#flash', { opacity: 0 }, { opacity: .85, duration: .07, ease: 'none' }, 22.72);
  tl.to('#flash', { opacity: 0, duration: .45, ease: 'power2.out' }, 22.79);

  /* ── La luz magenta late despacio ──────────────────────────────── */
  tl.to('#glow', { opacity: .9, x: 26, y: -14, duration: 7, ease: 'sine.inOut', repeat: -1, yoyo: true }, 0);

  window.__timelines["millonario"] = tl;
  if (gsap.ticker) gsap.ticker.fps(30);
})();
</script>
</body>
</html>
