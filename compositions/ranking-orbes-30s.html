<!DOCTYPE html>
<html lang="es" data-composition-variables='[
  {"id":"presentador1","type":"string","label":"Plano 1","default":"assets/mezcla/presentador-1.mp4"},
  {"id":"presentador2","type":"string","label":"Plano 2","default":"assets/mezcla/presentador-2.mp4"},
  {"id":"frase","type":"string","label":"Frase (palabras)","default":"Estados Unidos|la F-150|en el|por que|la Tundra|sino|y aguanta|el invierno|sin problemas"},
  {"id":"musica","type":"string","label":"Musica","default":"assets/audio/music-30s.mp3"}
]'>
<head>
<meta charset="utf-8">
<title>Ranking de marcas - columna de orbes dorados</title>
<style>
  @font-face { font-family:'Anton'; font-style:normal; font-weight:400;
    src:url('../assets/fonts/anton-400.woff2') format('woff2'); }
  @font-face { font-family:'Inter'; font-style:normal; font-weight:800;
    src:url('../assets/fonts/inter-800.woff2') format('woff2'); }

  :root{ --oro:#FFC23C; --oro2:#FF8A12; }
  html,body{ margin:0; padding:0; background:#07070A; }
  body{ width:1080px; height:1920px; overflow:hidden; }

  /* El presentador a pantalla completa */
  .plano{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    opacity:0; will-change:opacity,transform; }

  /* La columna de orbes dorados (a la izquierda) */
  .orb{ position:absolute; left:90px; width:230px; height:230px; border-radius:50%;
    border:7px solid var(--oro); opacity:0; will-change:opacity,transform;
    background:radial-gradient(circle at 50% 38%, rgba(255,196,90,.34) 0%, rgba(28,18,6,.62) 58%, rgba(10,8,4,.80) 100%);
    box-shadow:0 0 22px rgba(255,180,50,.85), 0 0 62px rgba(255,140,20,.55), 0 0 130px rgba(255,110,10,.30); }
  .orb-num{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Anton',sans-serif; font-size:118px; color:#FFFFFF; opacity:0;
    text-shadow:0 0 18px rgba(255,200,80,.9); will-change:opacity; }
  .orb-logo{ position:absolute; inset:30px; width:170px; height:170px; object-fit:contain;
    opacity:0; will-change:opacity,transform;
    filter:brightness(1.35) drop-shadow(0 4px 10px rgba(0,0,0,.55)); }

  /* La frase: palabras blancas centradas sobre el pecho */
  .palabra{ position:absolute; left:0; right:0; top:980px; text-align:center;
    font-family:'Inter',sans-serif; font-weight:800; font-size:74px; letter-spacing:-.02em;
    color:#FFFFFF; white-space:nowrap; opacity:0;
    text-shadow:0 4px 14px rgba(0,0,0,.95), 0 1px 2px rgba(0,0,0,1);
    will-change:opacity,transform; }

  /* Los logos grandes de marca (arriba a la derecha) */
  .marca{ position:absolute; opacity:0; will-change:opacity,transform; }
  .marca img{ max-width:420px; max-height:220px; object-fit:contain;
    filter:drop-shadow(0 10px 22px rgba(0,0,0,.6)); }
  .marca-caja{ position:absolute; opacity:0; will-change:opacity,transform;
    background:#E4002B; padding:26px 30px; box-shadow:0 14px 40px rgba(0,0,0,.55); }
  .marca-caja img{ width:260px; height:130px; object-fit:contain; }

  /* Ambiente */
  .vineta{ position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(118% 78% at 46% 42%, rgba(0,0,0,0) 48%, rgba(0,0,0,.45) 100%); }
  .grano{ position:absolute; left:-8%; top:-8%; width:116%; height:116%;
    background-image:url('../assets/grain.png'); background-size:256px 256px;
    opacity:.05; will-change:transform; pointer-events:none; }
  .sombra-izq{ position:absolute; left:0; top:0; width:420px; height:1920px; pointer-events:none;
    background:linear-gradient(to right, rgba(6,6,10,.55) 0%, rgba(6,6,10,.30) 62%, rgba(6,6,10,0) 100%); }
</style>
</head>
<body>

<div id="root" data-composition-id="ranking-orbes" data-start="0" data-duration="30" data-width="1080" data-height="1920" data-fps="30">

  <video id="p1" class="plano clip" data-start="0" data-duration="26" data-track-index="0"
    data-var-src="presentador1" src="assets/mezcla/presentador-1.mp4" data-has-audio playsinline></video>
  <video id="p2" class="plano clip" data-start="26" data-duration="4" data-track-index="0"
    data-var-src="presentador2" src="assets/mezcla/presentador-2.mp4" data-has-audio playsinline></video>

  <!-- La columna de 5 orbes: numeros que se cambian por el logo de la marca -->
  <div class="orb" id="orb1" style="top:173px;"><div class="orb-num" id="num1">1</div></div>
  <div class="orb" id="orb2" style="top:499px;"><div class="orb-num" id="num2">2</div><img class="orb-logo" id="logoHonda" src="assets/logos/honda.png" alt=""></div>
  <div class="orb" id="orb3" style="top:826px;"><div class="orb-num" id="num3">3</div><img class="orb-logo" id="logoFord" src="assets/logos/ford.png" alt=""></div>
  <div class="orb" id="orb4" style="top:1152px;"><div class="orb-num" id="num4">4</div><img class="orb-logo" id="logoBmw" src="assets/logos/bmw.png" alt=""></div>
  <div class="orb" id="orb5" style="top:1479px;"><div class="orb-num" id="num5">5</div><img class="orb-logo" id="logoLexus" src="assets/logos/lexus.png" alt=""></div>

  <!-- Los logos grandes (arriba a la derecha) -->
  <div class="marca" id="marcaLexus" style="left:600px; top:150px;"><img src="assets/logos/lexus.png" alt=""></div>
  <div class="marca-caja" id="marcaToyota" style="left:690px; top:150px;"><img src="assets/logos/toyota.png" alt=""></div>

  <!-- Ambiente -->
  <div class="sombra-izq"></div>
  <div class="vineta"></div>
  <div class="grano" id="grano"></div>

  <audio id="musica" class="clip" data-start="0" data-duration="30" data-track-index="9"
    data-var-src="musica" src="assets/audio/music-30s.mp3" data-volume="0.18"></audio>
</div>

<script src="../assets/vendor/gsap.min.js"></script>
<script>
/* Columna de orbes dorados: el mismo montaje que la referencia del usuario.
   5 orbes a la izquierda con su numero; al revelarse cada puesto, el numero
   se sustituye por el logo de la marca; la frase se construye palabra a
   palabra y los logos grandes entran al final. */
(function () {
  const V = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
  const txt = (id, def) => (V && V[id] != null && V[id] !== '') ? String(V[id]) : def;
  const PALABRAS = txt('frase', 'Estados Unidos|la F-150|en el|por que|la Tundra|sino|y aguanta|el invierno|sin problemas').split('|');

  const tl = gsap.timeline({ paused: true });

  /* el presentador */
  tl.set('#p1', { opacity: 1 }, 0);
  tl.fromTo('#p1', { scale: 1.0 }, { scale: 1.04, duration: 30, ease: 'none' }, 0);
  tl.fromTo('#p2', { opacity: 0 }, { opacity: 1, duration: .08, ease: 'none' }, 26);

  /* los 5 orbes entran uno a uno (con su destello dorado) */
  const orbes = [0.5, 1.4, 2.3, 3.2, 4.1];
  for (let i = 0; i < 5; i++) {
    tl.fromTo('#orb' + (i + 1), { opacity: 0, scale: .35 },
      { opacity: 1, scale: 1, duration: .55, ease: 'back.out(2.2)' }, orbes[i]);
    tl.fromTo('#num' + (i + 1), { opacity: 0, scale: .4 },
      { opacity: 1, scale: 1, duration: .4, ease: 'back.out(2.4)' }, orbes[i] + .12);
  }

  /* cuando se revela cada puesto, el numero se cambia por el logo */
  const revelados = [
    { num: 3, logo: '#logoFord', t: 6.0 },
    { num: 2, logo: '#logoHonda', t: 11.5 },
    { num: 5, logo: '#logoLexus', t: 23.8 },
    { num: 4, logo: '#logoBmw', t: 24.2 }
  ];
  for (const r of revelados) {
    tl.to('#num' + r.num, { opacity: 0, scale: .6, duration: .22, ease: 'power2.in' }, r.t - .1);
    tl.fromTo(r.logo, { opacity: 0, scale: .5, rotation: -12 },
      { opacity: 1, scale: 1, rotation: 0, duration: .5, ease: 'back.out(2)' }, r.t);
  }

  /* los logos grandes de marca */
  tl.fromTo('#marcaLexus', { opacity: 0, x: 40, scale: .92 },
    { opacity: 1, x: 0, scale: 1, duration: .6, ease: 'power3.out' }, 17.6);
  tl.to('#marcaLexus', { opacity: 0, duration: .3, ease: 'power2.in' }, 23.4);
  tl.fromTo('#marcaToyota', { opacity: 0, x: 40, scale: .9 },
    { opacity: 1, x: 0, scale: 1, duration: .55, ease: 'power3.out' }, 24.4);

  /* la frase, palabra a palabra */
  const TIEMPOS = [2.2, 4.4, 7.2, 9.4, 11.6, 14.0, 16.2, 19.0, 21.4];
  for (let i = 0; i < PALABRAS.length; i++) {
    const el = document.createElement('div');
    el.className = 'palabra';
    el.id = 'pal' + i;
    el.textContent = PALABRAS[i];
    document.getElementById('root').appendChild(el);
    const t = TIEMPOS[i] !== undefined ? TIEMPOS[i] : 22.0 + i;
    tl.fromTo(el, { opacity: 0, y: 22, scale: .96 },
      { opacity: 1, y: 0, scale: 1, duration: .35, ease: 'power3.out' }, t);
    tl.to(el, { opacity: 0, y: -12, duration: .3, ease: 'power2.in' }, t + 1.7);
  }

  /* el grano se mueve */
  tl.to('#grano', { x: 18, y: -10, duration: 2.4, ease: 'steps(5)', repeat: -1, yoyo: true }, 0);

  window.__timelines["ranking-orbes"] = tl;
  if (gsap.ticker) gsap.ticker.fps(30);
})();
</script>
</body>
</html>
