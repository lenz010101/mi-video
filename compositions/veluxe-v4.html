<!DOCTYPE html>
<html
  lang="es"
  data-composition-variables='[
    {"id":"clubSrc","type":"image","label":"Clip de fiesta","default":"../demo2/new/party_v.mp4"},
    {"id":"charA","type":"image","label":"Personaje A","default":"../demo2/new/char_popeye.png"},
    {"id":"charB","type":"image","label":"Personaje B","default":"../demo2/new/char_betty.png"},
    {"id":"partyTint","type":"color","label":"Tinte de la fiesta","default":"#e8f2ff"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>VELUXE V3 · promo motel/neón (v4 · réplica de edición del v1)</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: #000; }
      #stage {
        position: relative; width: 1080px; height: 1920px;
        overflow: hidden; background: #060306;
        font-family: "Inter", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* ══ BANDA 0.00 – 5.44 ═══════════════════════════════════════
         El póster del original, sin tocar: mismo travelling, mismo
         encuadre. El pie ("out of the ordinary"...) ya va grabado en
         la banda, así que NO se duplica: sólo se recompone la fecha
         (que en el original era el overlay de Instagram). */
      #bandWin {
        position: absolute; left: 0; top: 0; width: 1080px; height: 1920px;
        overflow: hidden; z-index: 1;
      }
      #band { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; display: block; }

      /* ══ FIESTA 5.44 – 9.37 ══════════════════════════════════════ */
      #partyWin { position: absolute; inset: 0; z-index: 2; opacity: 0; }
      #club { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
      #nide { position: absolute; inset: 0; background: rgba(58,0,10,.22); z-index: 2; }
      #vig {
        position: absolute; inset: 0; z-index: 3; pointer-events: none;
        background: radial-gradient(ellipse 70% 55% at 50% 45%, transparent 40%, rgba(0,0,0,.55) 100%);
      }

      /* personajes cartoon de dominio público (die-cut con contorno blanco) */
      .char {
        position: absolute; z-index: 12; opacity: 0; will-change: transform, opacity;
        filter: drop-shadow(0 14px 22px rgba(0,0,0,.6));
      }
      #charA { left: 40px;  top: 300px; height: 1050px; width: auto; }
      #charB { right: 30px; top: 350px; height: 950px; width: auto; }

      /* ══ TIPOGRAFÍA ═══════════════════════════════════════════════
         "out of the ordinary" + lineup + access + DOBEL: recortado del
         original CON alfa. En el póster ya viene grabado, así que esta
         capa sólo se ve en la fiesta (5.44+), como en el original. */
      #dateLine {
        position: absolute; left: 0; right: 0; top: 30px; z-index: 20; text-align: center;
        font-size: 26px; font-weight: 700; letter-spacing: .34em; color: #efe8e8;
        text-shadow: 0 3px 14px rgba(0,0,0,.9); opacity: 0;
      }
      #footTxt {
        position: absolute; left: 0; top: 1210px; width: 1080px; height: 250px;
        object-fit: cover; z-index: 20; pointer-events: none; opacity: 0;
      }

      /* fogonazos medidos en el original: azul 5.50 · magenta 9.00 */
      #flashBlue { position: absolute; inset: 0; background: #e8f2ff; opacity: 0; z-index: 39; pointer-events: none; will-change: opacity; }
      #flashPink { position: absolute; inset: 0; background: #ff4fd8; opacity: 0; z-index: 39; pointer-events: none; will-change: opacity; }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="veluxe-v4"
      data-start="0"
      data-duration="9.37"
      data-width="1080"
      data-height="1920"
      data-fps="30"
    >
      <audio id="track" data-start="0" data-duration="9.37" data-media-start="0"
        data-track-index="1" data-volume="1" src="../demo2/new/audio.m4a" preload="auto"></audio>

      <!-- banda del póster: el original tal cual -->
      <div id="bandWin">
        <video id="band" class="clip" src="../demo2/new/master.mp4"
          data-start="0" data-duration="5.44" data-media-start="0"
          muted playsinline preload="auto"></video>
        <div id="bandMaskDate"></div>
        <div id="bandMaskFoot"></div>
      </div>

      <!-- fiesta -->
      <video id="club" class="clip" src="../demo2/new/party_v.mp4" data-var-src="clubSrc"
        data-start="5.44" data-duration="3.93" data-media-start="0" data-hf-media-start-basis="global"
        muted playsinline preload="auto"></video>
      <div id="partyWin">
        <div id="nide"></div>
        <div id="vig"></div>
        <img class="char" id="charA" src="../demo2/new/char_popeye.png" alt="" data-var-src="charA" />
        <img class="char" id="charB" src="../demo2/new/char_betty.png" alt="" data-var-src="charB" />
      </div>

      <!-- tipografía: pie original recortado (con alfa) + fecha como capa -->
      <img id="footTxt" src="../demo2/new/foot_txt.png" alt="" />
      <div id="dateLine">METEPEC, SÁBADO 11 DE JULIO</div>

      <div id="flashBlue"></div>
      <div id="flashPink"></div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};

        function build() {
          var V = (window.__hyperframes && window.__hyperframes.getVariables)
            ? window.__hyperframes.getVariables()
            : {};
          if (typeof V.partyTint === "string" && V.partyTint !== "") {
            document.getElementById("flashBlue").style.background = V.partyTint;
          }

          var tl = gsap.timeline({ paused: true });

          /* ══ 0.00 – 5.44 · póster ═════════════════════════════════
             El póster es el original: travelling continuo, sin cortes ni
             flashes. Sólo el pie y la fecha se recomponen (más nítidos). */
          /* el pie y la fecha ya van grabados en el póster: no se duplican */
          tl.set("#dateLine", { opacity: 0 }, 0);
          tl.set("#footTxt", { opacity: 0 }, 0);

          /* ══ 5.44 – 9.37 · fiesta ══════════════════════════════════
             Medido en el original: corte seco a 5.44 · fogonazo azul 5.50 ·
             personaje gigante 5.62 · cambio 7.45 · cambio 8.15 ·
             pop final 8.90 · fogonazo magenta 9.00. */
          tl.set("#partyWin", { opacity: 1 }, 5.44);
          /* en la fiesta sí se ve la tipografía (como en el original) */
          tl.set("#dateLine", { opacity: 1 }, 5.44);
          tl.set("#footTxt", { opacity: 1 }, 5.44);

          tl.fromTo("#flashBlue", { opacity: 0 }, { opacity: .95, duration: 0.04, ease: "none" }, 5.50);
          tl.to("#flashBlue", { opacity: 0, duration: 0.12, ease: "none" }, 5.54);

          tl.fromTo("#charA", { opacity: 0, scale: 0.25, rotation: -12 }, { opacity: 1, scale: 1, rotation: -4, duration: 0.34, ease: "back.out(2.2)" }, 5.62);
          tl.to("#charA", { y: 22, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 3 }, 6.0);

          tl.to("#charA", { opacity: 0, scale: 0.65, duration: 0.16, ease: "power2.in" }, 7.38);
          tl.fromTo("#charB", { opacity: 0, scale: 0.25, rotation: 12 }, { opacity: 1, scale: 1, rotation: 5, duration: 0.34, ease: "back.out(2.2)" }, 7.45);
          tl.to("#charB", { y: -18, duration: 0.85, ease: "sine.inOut", yoyo: true, repeat: 1 }, 7.85);

          tl.to("#charB", { opacity: 0, scale: 0.65, duration: 0.16, ease: "power2.in" }, 8.08);
          tl.fromTo("#charA", { opacity: 0, scale: 0.25, rotation: -10 }, { opacity: 1, scale: 1, rotation: -3, duration: 0.34, ease: "back.out(2.2)" }, 8.15);
          tl.to("#charA", { y: 18, duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: 1 }, 8.5);

          tl.to("#charA", { opacity: 0, scale: 0.65, duration: 0.14, ease: "power2.in" }, 8.88);
          tl.fromTo("#charB", { opacity: 0, scale: 0.3, rotation: 10 }, { opacity: 1, scale: 1, rotation: 4, duration: 0.3, ease: "back.out(2.2)" }, 8.90);
          tl.fromTo("#flashPink", { opacity: 0 }, { opacity: .92, duration: 0.05, ease: "none" }, 9.00);
          tl.to("#flashPink", { opacity: 0, duration: 0.14, ease: "none" }, 9.05);

          window.__timelines["veluxe-v4"] = tl;
        }
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(build); else build();
      </script>
    </div>
  </body>
</html>
