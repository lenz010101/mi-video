<!DOCTYPE html>
<html
  lang="es"
  data-composition-variables='[
    {"id":"e1Src","type":"image","label":"Fondo escena 1","default":"../demo2/new/e1_wide.jpg"},
    {"id":"e2Src","type":"image","label":"Fondo escena 2","default":"../demo2/new/e2_wide.jpg"},
    {"id":"partySrc","type":"image","label":"Fiesta original","default":"../demo2/new/party_orig.mp4"},
    {"id":"dateLine","type":"string","label":"Fecha","default":"METEPEC, SÁBADO 11 DE JULIO"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>VELUXE V3 · v5 (primeros 5 s nuevos + fiesta original)</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: #000; }
      #stage {
        position: relative; width: 1080px; height: 1920px;
        overflow: hidden; background: #060306;
        font-family: "Inter", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* ══ MARCO ═══════════════════════════════════════════════════
         El original 1080x1920 es una grabación de pantalla con la
         banda del reel 1080x1520 centrada (200 px de negro arriba y
         abajo). Se mantiene ese mismo marco. */
      .band {
        position: absolute; left: 0; top: 200px; width: 1080px; height: 1520px;
        overflow: hidden; background: transparent;
      }
      .band img, .band video { width: 100%; height: 100%; object-fit: cover; display: block; }
      #band1 { z-index: 1; }
      #band2 { z-index: 2; }
      #band3 { z-index: 3; }

      /* ══ E1 · 0.00 – 1.02 · cartel en el muro ═════════════════════ */
      #e1 { position: absolute; inset: 0; will-change: transform; transform-origin: 50% 50%; }
      #e1 .wall { position: absolute; inset: 0; }
      .blood {
        position: absolute; inset: 0; opacity: .85; pointer-events: none; z-index: 3;
        background:
          radial-gradient(circle 30px at 62% 18%, rgba(220,20,30,.75) 0 45%, transparent 60%),
          radial-gradient(circle 16px at 74% 26%, rgba(220,20,30,.6) 0 45%, transparent 60%),
          radial-gradient(circle 10px at 55% 32%, rgba(190,10,20,.7) 0 45%, transparent 60%),
          radial-gradient(circle 20px at 36% 46%, rgba(220,20,30,.55) 0 45%, transparent 65%),
          radial-gradient(circle 11px at 70% 54%, rgba(190,10,20,.6) 0 45%, transparent 60%),
          radial-gradient(circle 7px  at 44% 12%, rgba(220,20,30,.45) 0 45%, transparent 60%),
          radial-gradient(circle 14px at 82% 43%, rgba(220,20,30,.5) 0 45%, transparent 60%),
          radial-gradient(circle 8px  at 26% 29%, rgba(190,10,20,.45) 0 45%, transparent 60%),
          radial-gradient(circle 12px at 66% 77%, rgba(220,20,30,.4) 0 45%, transparent 62%),
          radial-gradient(circle 6px  at 51% 87%, rgba(220,20,30,.35) 0 45%, transparent 60%);
      }
      #paper {
        position: absolute; left: 200px; top: 400px; width: 400px; z-index: 6;
        background: #f4f0e6; padding: 30px 26px 18px; transform: rotate(-1.6deg);
        box-shadow: 0 14px 34px rgba(0,0,0,.6); will-change: transform, opacity;
        clip-path: polygon(0 0, 100% 0, 100% 92%, 86% 100%, 62% 93%, 40% 100%, 22% 94%, 0 100%);
      }
      #paper::before {
        content: ""; position: absolute; top: -16px; left: 50%; margin-left: -60px;
        width: 120px; height: 32px; background: rgba(222,215,196,.85); transform: rotate(1deg);
      }
      #paper .p1 { font-size: 19px; font-weight: 800; letter-spacing: .28em; color: #2a2a2a; text-align: center; }
      #paper .p2 { font-size: 42px; font-weight: 800; color: #222; text-align: center; margin: 2px 0 8px; }
      #paper .p3 { font-size: 82px; font-weight: 800; color: #d8232a; text-align: center; line-height: .95; }
      #paper .p4 { font-size: 17px; font-weight: 700; letter-spacing: .5em; color: #9a958a; text-align: center; margin-top: 4px; }
      #tickets { position: absolute; left: 230px; top: 790px; width: 200px; z-index: 5; display: flex; gap: 7px; }
      #tickets i {
        flex: 1; height: 68px; background: #f4f0e6;
        clip-path: polygon(0 0, 100% 0, 100% 96%, 50% 100%, 0 96%);
        background-image: repeating-linear-gradient(#39302a 0 6px, transparent 6px 14px),
          linear-gradient(#f4f0e6 55%, #f4f0e6 55%);
        background-size: 62% 44%, 100% 100%; background-position: 50% 96%, 0 0; background-repeat: no-repeat;
        box-shadow: 0 8px 18px rgba(0,0,0,.5);
      }
      #ghost {
        position: absolute; left: 0; right: 0; top: 760px; z-index: 7; text-align: center;
        font-size: 92px; font-weight: 800; color: rgba(255,255,255,.28); letter-spacing: .01em;
        text-shadow: 0 6px 30px rgba(255,255,255,.25); opacity: 0; will-change: opacity;
      }

      /* ══ E2 · 1.02 – 5.44 · poster del motel ═════════════════════ */
      #e2 { position: absolute; inset: 0; will-change: transform; transform-origin: 50% 30%; }
      #neon {
        position: absolute; left: 0; right: 0; top: 60px; z-index: 8; text-align: center;
        will-change: transform;
      }
      #neon .row {
        display: inline-flex; gap: 22px; padding: 24px 38px 30px; position: relative;
        background: linear-gradient(#1b0406, #120205); border-radius: 14px;
        box-shadow: 0 18px 50px rgba(0,0,0,.65), 0 0 0 3px rgba(90,8,12,.5), inset 0 0 60px rgba(0,0,0,.5);
      }
      .lt {
        position: relative; font-size: 132px; font-weight: 800; color: #f0b9b9; line-height: 1;
        text-shadow: 0 4px 0 rgba(120,10,16,.9); padding: 0 5px;
      }
      #neonLit { position: absolute; inset: 0; opacity: 0; will-change: opacity; }
      #neonLit .row { background: transparent; box-shadow: none; }
      #neonLit .lt {
        color: #ffe3e3;
        text-shadow: 0 0 12px rgba(255,90,100,.9), 0 0 34px rgba(255,40,55,.65), 0 0 70px rgba(255,20,40,.5), 0 4px 0 rgba(140,10,16,.9);
      }

      .stk {
        position: absolute; z-index: 14; opacity: 0; will-change: transform, opacity;
        filter: drop-shadow(0 10px 12px rgba(0,0,0,.55));
      }
      #stkAlien  { left: 70px;  top: 950px; width: 250px; transform: rotate(-10deg); }
      #stkSpray  { right: 60px; top: 880px; width: 190px; transform: rotate(9deg); }
      #stkBurger { right: 120px; top: 1150px; width: 270px; transform: rotate(-7deg); }
      #stkChamp  { left: 110px; top: 1180px; width: 220px; transform: rotate(12deg); }

      /* ══ FIESTA · 5.44 – 9.37 · original ═════════════════════════ */
      #partyWin { position: absolute; inset: 0; z-index: 2; opacity: 0; }
      #party { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }

      /* ══ TIPOGRAFÍA (recortada del original, con alfa) ═════════════ */
      #dateTxt {
        position: absolute; left: 0; top: 200px; width: 1080px; height: 120px;
        object-fit: cover; z-index: 20; pointer-events: none;
      }
      #footTxt {
        position: absolute; left: 0; top: 1410px; width: 1080px; height: 310px;
        object-fit: cover; z-index: 20; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="veluxe-v5"
      data-start="0"
      data-duration="9.37"
      data-width="1080"
      data-height="1920"
      data-fps="30"
    >
      <audio id="track" data-start="0" data-duration="9.37" data-media-start="0"
        data-track-index="1" data-volume="1" src="../demo2/new/audio.m4a" preload="auto"></audio>

      <!-- E1 -->
      <div class="band" id="band1">
        <div id="e1">
          <img class="wall" src="../demo2/new/e1_wide.jpg" alt="" data-var-src="e1Src" />
          <div class="blood" id="blood1"></div>
          <div id="paper">
            <div class="p1">SAVE THIS DATE</div>
            <div class="p2">11/07/2026</div>
            <div class="p3">VELUXE</div>
            <div class="p4">PARTY</div>
          </div>
          <div id="tickets"><i></i><i></i><i></i><i></i></div>
          <div id="ghost">VELUXE V3</div>
        </div>
      </div>

      <!-- E2 -->
      <div class="band" id="band2">
        <div id="e2">
          <img src="../demo2/new/e2_wide.jpg" alt="" data-var-src="e2Src" />
          <div class="blood" id="blood2" style="opacity:.55"></div>
          <div id="neon">
            <div class="row">
              <span class="lt">V</span><span class="lt">E</span><span class="lt">L</span>
              <span class="lt">U</span><span class="lt">X</span><span class="lt">E</span>
            </div>
            <div id="neonLit">
              <div class="row">
                <span class="lt">V</span><span class="lt">E</span><span class="lt">L</span>
                <span class="lt">U</span><span class="lt">X</span><span class="lt">E</span>
              </div>
            </div>
          </div>
          <svg class="stk" id="stkAlien" viewBox="0 0 120 120">
            <g stroke="#fff" stroke-width="5" stroke-linecap="round">
              <path d="M45 30 C 40 18, 30 14, 28 8" fill="none"/><circle cx="27" cy="7" r="6" fill="#6fd356"/>
              <path d="M75 30 C 80 18, 90 14, 92 8" fill="none"/><circle cx="93" cy="7" r="6" fill="#6fd356"/>
              <ellipse cx="60" cy="70" rx="34" ry="38" fill="#9ee87a"/>
              <ellipse cx="47" cy="62" rx="10" ry="14" fill="#fff"/><circle cx="49" cy="66" r="5" fill="#222"/>
              <ellipse cx="74" cy="62" rx="10" ry="14" fill="#fff"/><circle cx="71" cy="66" r="5" fill="#222"/>
              <path d="M40 92 Q 60 104 80 92" fill="none"/>
            </g>
          </svg>
          <svg class="stk" id="stkSpray" viewBox="0 0 110 160">
            <g stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
              <rect x="60" y="8" width="34" height="20" rx="4" fill="#7fb6e8"/>
              <rect x="30" y="10" width="30" height="16" rx="4" fill="#5a8fc7"/>
              <path d="M34 12 L 22 40 L 34 44 Z" fill="#5a8fc7"/>
              <rect x="34" y="34" width="42" height="22" fill="#8fd0f0"/>
              <path d="M30 56 h50 c8 0 12 8 12 16 v70 c0 10 -6 14 -14 14 h-46 c-8 0 -14 -4 -14 -14 v-70 c0 -8 4 -16 12 -16 z" fill="#7ec9ea"/>
              <path d="M92 150 L108 150" stroke-width="9"/>
            </g>
          </svg>
          <svg class="stk" id="stkBurger" viewBox="0 0 150 130">
            <g stroke="#fff" stroke-width="5" stroke-linejoin="round">
              <path d="M18 52 a57 40 0 0 1 114 0 z" fill="#f2a24b"/>
              <circle cx="45" cy="30" r="4" fill="#fff"/><circle cx="75" cy="22" r="4" fill="#fff"/><circle cx="105" cy="32" r="4" fill="#fff"/>
              <path d="M14 54 q 12 -8 24 0 t 24 0 t 24 0 t 24 0 t 24 0 v4 q 0 8 -8 8 H 22 q -8 0 -8 -8 z" fill="#71c14f"/>
              <rect x="16" y="66" width="118" height="16" rx="8" fill="#7a4326"/>
              <path d="M12 88 q 20 14 40 0 t 40 0 t 40 0 l -6 20 h -108 z" fill="#ffd23e"/>
              <rect x="16" y="102" width="118" height="22" rx="11" fill="#f2a24b"/>
            </g>
          </svg>
          <svg class="stk" id="stkChamp" viewBox="0 0 110 170">
            <g stroke="#fff" stroke-width="5" fill="none" stroke-linejoin="round">
              <rect x="14" y="6" width="22" height="30" rx="4" fill="#e8b62f"/>
              <rect x="34" y="6" width="22" height="30" rx="4" fill="#e8b62f"/>
              <rect x="14" y="44" width="42" height="34" rx="6" fill="#caa02a"/>
              <rect x="12" y="86" width="44" height="24" fill="#caa02a"/>
              <rect x="14" y="110" width="42" height="52" rx="10" fill="#caa02a"/>
              <path d="M60 6 c 8 30 8 60 0 88 l 0 66 h -10 l 0 -66 c -8 -28 -8 -58 0 -88 z" fill="#caa02a"/>
            </g>
          </svg>
        </div>
      </div>

      <!-- FIESTA: el original, tal cual -->
      <div class="band" id="band3">
        <div id="partyWin">
          <video id="party" class="clip" src="../demo2/new/party_orig.mp4" data-var-src="partySrc"
            data-start="5.47" data-duration="3.87" data-media-start="0" data-hf-media-start-basis="global"
            muted playsinline preload="auto"></video>
        </div>
      </div>

      <!-- tipografía del original (con alfa) -->
      <img id="dateTxt" src="../demo2/new/date_txt.png" alt="" />
      <img id="footTxt" src="../demo2/new/foot_txt.png" alt="" />

      <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};

        function build() {
          var V = (window.__hyperframes && window.__hyperframes.getVariables)
            ? window.__hyperframes.getVariables()
            : {};
          var el = document.querySelector('[data-var-text="dateLine"]');
          if (el && typeof V.dateLine === "string" && V.dateLine !== "") el.textContent = V.dateLine;

          var tl = gsap.timeline({ paused: true });

          /* ══ E1 · 0.00 – 1.02 ══════════════════════════════════════
             Medido en el v1: travelling continuo, el cartel sale por la
             izquierda mientras entra la puerta. Sin cortes ni flashes. */
          tl.set("#band1", { opacity: 1 }, 0);
          tl.set("#paper", { opacity: 1 }, 0.02);
          tl.set("#tickets", { opacity: 1 }, 0.06);
          tl.set("#blood1", { opacity: .35 }, 0.05);
          tl.set("#blood1", { opacity: .8 }, 0.55);
          tl.set("#ghost", { opacity: 1 }, 0.18);
          tl.set("#ghost", { opacity: 0 }, 0.86);
          /* travelling: el cartel se va a la izquierda y la escena entra */
          tl.fromTo("#e1", { x: 0, scale: 1.0 }, { x: -260, scale: 0.92, duration: 1.02, ease: "power1.in" }, 0);

          /* ══ E2 · 1.02 – 5.44 ══════════════════════════════════════
             Medido: el bloque del neon se revela 1.05 -> 1.72 (no letra a
             letra), stickers 1.72/2.35/2.80/3.20, CALMA 3.40 -> 4.70,
             push-in al primer plano 4.76 -> 5.38. */
          tl.set("#band2", { opacity: 1 }, 1.02);
          tl.set("#band1", { opacity: 0 }, 1.03);
          tl.fromTo("#e2", { scale: 1.0, x: 0, y: 0 }, { scale: 1.0, x: 0, y: 0, duration: 0.7, ease: "none" }, 1.02);
          tl.fromTo("#neonLit", { opacity: 0 }, { opacity: 1, duration: 0.66, ease: "power1.inOut" }, 1.06);
          tl.fromTo("#stkBurger", { opacity: 0, scale: 0.25, rotation: -22 }, { opacity: 1, scale: 1, rotation: -7, duration: 0.3, ease: "back.out(2.4)" }, 1.72);
          tl.fromTo("#stkSpray", { opacity: 0, scale: 0.25, rotation: 20 }, { opacity: 1, scale: 1, rotation: 9, duration: 0.3, ease: "back.out(2.4)" }, 2.35);
          tl.fromTo("#stkAlien", { opacity: 0, scale: 0.25, rotation: -18 }, { opacity: 1, scale: 1, rotation: -10, duration: 0.3, ease: "back.out(2.4)" }, 2.80);
          tl.fromTo("#stkChamp", { opacity: 0, scale: 0.25, rotation: 18 }, { opacity: 1, scale: 1, rotation: 12, duration: 0.3, ease: "back.out(2.4)" }, 3.20);
          tl.set("#blood2", { opacity: .55 }, 1.02);
          tl.set("#blood2", { opacity: .68 }, 3.05);
          tl.set("#blood2", { opacity: .52 }, 3.25);
          tl.set("#blood2", { opacity: .66 }, 3.75);
          /* 3.40 -> 4.70: el plano se queda QUIETO */
          tl.set("#e2", { transformOrigin: "50% 30%" }, 4.70);
          tl.fromTo("#e2", { scale: 1.0, x: 0, y: 0 }, { scale: 1.42, x: 0, y: 0, duration: 0.62, ease: "power2.in", immediateRender: false }, 4.76);

          /* ══ FIESTA · 5.44 – 9.37 ═════════════════════════════════
             El original departy: ya trae su propio corte, su fogonazo
             azul, los personajes y el fogonazo magenta. */
          tl.set("#band3", { opacity: 1 }, 5.44);
          tl.set("#band2", { opacity: 0 }, 5.45);
          tl.set("#dateTxt", { opacity: 0 }, 5.44);
          tl.set("#footTxt", { opacity: 0 }, 5.44);

          window.__timelines["veluxe-v5"] = tl;
        }
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(build); else build();
      </script>
    </div>
  </body>
</html>
