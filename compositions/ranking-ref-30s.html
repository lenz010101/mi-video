<!DOCTYPE html>
<html lang="es"
  data-composition-variables='[
    {"id":"marca","type":"string","label":"Marca","default":"HUMO"},
    {"id":"hookPie","type":"string","label":"Pie de apertura","default":"Top cinco"},
    {"id":"hookSub","type":"string","label":"Subtitulo","default":"los coches que conducen los millonarios"},
    {"id":"n5Name","type":"string","label":"Puesto 5","default":"PORSCHE"},
    {"id":"n5Line","type":"string","label":"Frase 5","default":"pierden"},
    {"id":"n4Name","type":"string","label":"Puesto 4","default":"BMW"},
    {"id":"n4Line","type":"string","label":"Frase 4","default":"recomiendo"},
    {"id":"n3Name","type":"string","label":"Puesto 3","default":"MERCEDES-BENZ"},
    {"id":"n3Line","type":"string","label":"Frase 3","default":"y confiabilidad"},
    {"id":"n2Name","type":"string","label":"Puesto 2","default":"HONDA"},
    {"id":"n2Line","type":"string","label":"Frase 2","default":"su valor"},
    {"id":"n1Name","type":"string","label":"Puesto 1","default":"TOYOTA"},
    {"id":"n1Line","type":"string","label":"Frase 1","default":"quieres bajar"},
    {"id":"verdictPie","type":"string","label":"Pie final","default":"y te daremos los numeros"},
    {"id":"source","type":"string","label":"Fuente","default":"FUENTE: THE NATIONAL STUDY OF MILLIONAIRES"},
    {"id":"presentador","type":"string","label":"Presentador","default":"assets/clips/talker-slow.mp4"},
    {"id":"orbes","type":"string","label":"Capa de orbes (Remotion)","default":"assets/mezcla/orbes.mp4"}
  ]'>
<head>
<meta charset="utf-8">
<title>Top 5 coches de los millonarios - Remotion + HyperFrames</title>
<style>
  @font-face { font-family:'Anton'; font-style:normal; font-weight:400;
    src:url('../assets/fonts/anton-400.woff2') format('woff2'); }
  @font-face { font-family:'JetBrains Mono'; font-style:normal; font-weight:400;
    src:url('../assets/fonts/nuevo/jetbrains-mono-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family:'JetBrains Mono'; font-style:normal; font-weight:600;
    src:url('../assets/fonts/nuevo/jetbrains-mono-latin-600-normal.woff2') format('woff2'); }

  :root{ --oro:#F5C242; --fg:#FFFFFF; --muted:#B9B4AC; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:#000; }
  #root{
    position:relative; width:100%; height:100%; overflow:hidden;
    background:#000; color:var(--fg);
    font-family:'JetBrains Mono',monospace; -webkit-font-smoothing:antialiased;
  }

  /* El presentador: protagonistico, a pantalla completa, CON SU VOZ.
     object-position lo desplaza a la derecha para que la columna de orbes
     (que Remotion dibuja a la izquierda) tenga sitio limpio, como en la
     referencia. */
  .presentador{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    object-position:78% center; opacity:0; will-change:opacity,transform; }

  /* La capa de orbes la renderiza Remotion sobre negro: en modo screen solo
     sobrevive la luz, igual que en una composicion de After Effects. */
  .orbes{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    mix-blend-mode:screen; opacity:0; pointer-events:none; will-change:opacity; }

  /* El logo gigante flotando (tecnica extruded-logo del catalogo) */
  .logo-grande{ position:absolute; left:50%; top:150px; transform:translateX(-50%);
    opacity:0; will-change:transform,opacity; }
  .logo-grande img{ max-width:820px; max-height:300px; object-fit:contain;
    filter:drop-shadow(0 22px 52px rgba(0,0,0,.62)); }
  .logo-halo{ position:absolute; left:50%; top:60px; width:1000px; height:520px;
    transform:translateX(-50%); opacity:0; pointer-events:none;
    background:radial-gradient(ellipse 50% 58% at 50% 46%, rgba(255,255,255,.13), transparent 70%);
    will-change:transform,opacity; }

  /* Los pies de foto: pequenos, blancos, abajo y centrados (como la referencia) */
  .pie{ position:absolute; left:50%; bottom:300px; transform:translateX(-50%);
    font-family:'Anton',sans-serif; font-size:52px; letter-spacing:-.01em;
    color:var(--fg); white-space:nowrap; opacity:0;
    text-shadow:0 4px 26px rgba(0,0,0,.75); will-change:transform,opacity; }
  .sub{ position:absolute; left:50%; bottom:248px; transform:translateX(-50%);
    font-family:'JetBrains Mono',monospace; font-weight:400; font-size:22px;
    letter-spacing:.08em; color:var(--muted); white-space:nowrap; opacity:0;
    text-shadow:0 3px 18px rgba(0,0,0,.7); will-change:transform,opacity; }

  /* Flash-through-white (tecnica del catalogo) */
  .flash{ position:absolute; inset:0; background:#FFF; opacity:0;
    will-change:opacity; pointer-events:none; }
  /* Fuga de luz organica (tecnica del catalogo): radiales + screen */
  .fuga{ position:absolute; inset:-10%; mix-blend-mode:screen; opacity:0; pointer-events:none;
    background:
      radial-gradient(ellipse 52% 110% at 12% 58%, rgba(255,241,197,.34) 0%, transparent 45%),
      radial-gradient(ellipse 72% 120% at 26% 54%, rgba(255,126,57,.26) 0%, transparent 66%);
    will-change:transform,opacity; }
  .grano{ position:absolute; left:-8%; top:-8%; width:116%; height:116%;
    background-image:url('../assets/grain.png'); background-size:256px 256px;
    opacity:.07; will-change:transform; pointer-events:none; }
  .vineta{ position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(120% 82% at 50% 44%, rgba(0,0,0,0) 46%, rgba(0,0,0,.52) 100%); }
  .fuente{ position:absolute; left:50%; bottom:190px; transform:translateX(-50%);
    font-family:'JetBrains Mono',monospace; font-size:17px; letter-spacing:.14em;
    color:rgba(255,255,255,.55); white-space:nowrap; opacity:0;
    will-change:transform,opacity; }
</style>
</head>
<body>

<div id="root" data-composition-id="ranking-ref" data-start="0" data-duration="30" data-width="1080" data-height="1920" data-fps="30">

  <!-- El presentador, con su audio (la voz del video) -->
  <video id="presentador" class="presentador clip" data-start="0" data-duration="30" data-track-index="0"
    data-var-src="presentador" src="assets/clips/talker-slow.mp4" data-has-audio playsinline></video>

  <!-- La capa de orbes dorados: la renderiza Remotion -->
  <video id="orbes" class="orbes clip" data-start="0" data-duration="30" data-track-index="1"
    data-var-src="orbes" src="assets/mezcla/orbes.mp4" muted playsinline></video>

  <!-- Ambiente -->
  <div class="fuga" id="fuga"></div>
  <div class="grano" id="grano"></div>
  <div class="vineta"></div>
  <div class="flash" id="flash"></div>

  <!-- Los logos flotantes, uno por marca -->
  <div class="logo-halo" id="halo5"></div>
  <div class="logo-grande" id="lg5"><img src="assets/logos/porsche.png" alt=""></div>
  <div class="logo-halo" id="halo4"></div>
  <div class="logo-grande" id="lg4"><img src="assets/logos/bmw.png" alt=""></div>
  <div class="logo-halo" id="halo3"></div>
  <div class="logo-grande" id="lg3"><img src="assets/logos/mercedes.png" alt=""></div>
  <div class="logo-halo" id="halo2"></div>
  <div class="logo-grande" id="lg2"><img src="assets/logos/honda.png" alt=""></div>
  <div class="logo-halo" id="halo1"></div>
  <div class="logo-grande" id="lg1"><img src="assets/logos/toyota.png" alt=""></div>

  <!-- Los pies de foto -->
  <div class="pie" id="pie0">Top cinco</div>
  <div class="sub" id="sub0">los coches que conducen los millonarios</div>
  <div class="pie" id="pie5">pierden</div>
  <div class="pie" id="pie4">recomiendo</div>
  <div class="pie" id="pie3">y confiabilidad</div>
  <div class="pie" id="pie2">su valor</div>
  <div class="pie" id="pie1">quieres bajar</div>
  <div class="pie" id="pieV">y te daremos los numeros</div>
  <div class="fuente" id="fuente">FUENTE: THE NATIONAL STUDY OF MILLIONAIRES</div>

  <!-- Musica por debajo de la voz -->
  <audio id="musica" class="clip" data-start="0" data-duration="30" data-track-index="9"
    src="assets/audio/music-30s.mp3" data-volume="0.22"></audio>
</div>

<script src="../assets/vendor/gsap.min.js"></script>
<script src="../assets/vendor/gsap/CustomEase.min.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════════════
   TOP 5 COCHOS DE LOS MILLONARIOS - estilo de la referencia del usuario.
   REMOTION hace la columna de orbes dorados (sobre negro, se compone en
   modo screen). HYPERFRAMES hace el montaje: presentador con su voz, logos
   flotantes, pies de foto, flashes y musica.
   ══════════════════════════════════════════════════════════════════════ */
(function () {
  const V = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
  const txt = (id, def) => (V && V[id] != null && V[id] !== '') ? String(V[id]) : def;
  const set = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };

  if (window.CustomEase) {
    gsap.registerPlugin(CustomEase);
    CustomEase.create('ref', 'M0,0 C0.16,0.9 0.2,1 1,1');
  }
  const EASE = window.CustomEase ? 'ref' : 'power3.out';

  set('pie0', txt('hookPie', 'Top cinco'));
  set('sub0', txt('hookSub', 'los coches que conducen los millonarios'));
  set('pie5', txt('n5Line', 'pierden'));
  set('pie4', txt('n4Line', 'recomiendo'));
  set('pie3', txt('n3Line', 'y confiabilidad'));
  set('pie2', txt('n2Line', 'su valor'));
  set('pie1', txt('n1Line', 'quieres bajar'));
  set('pieV', txt('verdictPie', 'y te daremos los numeros'));
  set('fuente', txt('source', 'FUENTE: THE NATIONAL STUDY OF MILLIONAIRES'));

  const tl = gsap.timeline({ paused: true });

  /* Ambiente: la fuga de luz late despacio y el grano se mueve */
  tl.to('#fuga', { opacity: .8, x: 30, y: -18, duration: 9, ease: 'sine.inOut', repeat: -1, yoyo: true }, 0);
  tl.to('#grano', { x: 20, y: -12, duration: 2.6, ease: 'steps(6)', repeat: -1 }, 0);

  /* El presentador entra con un empuje corto */
  tl.fromTo('#presentador', { opacity: 0 }, { opacity: 1, duration: .6, ease: 'power1.out' }, 0);
  tl.fromTo('#presentador', { scale: 1.02 }, { scale: 1.08, duration: 30, ease: 'none' }, 0);
  tl.fromTo('#orbes', { opacity: 0 }, { opacity: 1, duration: .8, ease: 'power1.out' }, .15);

  /* Apertura */
  tl.fromTo('#pie0', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: .55, ease: EASE }, .5);
  tl.fromTo('#sub0', { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: .5, ease: EASE }, .75);
  tl.to('#pie0', { opacity: 0, duration: .4, ease: 'power2.in' }, 5.2);
  tl.to('#sub0', { opacity: 0, duration: .4, ease: 'power2.in' }, 5.2);

  /* Los 5 puestos: enciende el orbe (Remotion), entra el logo flotante,
     el pie de foto, y un flash-through-white en el corte. */
  const puestos = [
    { n: 5, t: 1.2, dur: 5.2, lg: 'lg5', halo: 'halo5', pie: 'pie5' },
    { n: 4, t: 6.4, dur: 5.2, lg: 'lg4', halo: 'halo4', pie: 'pie4' },
    { n: 3, t: 11.6, dur: 5.2, lg: 'lg3', halo: 'halo3', pie: 'pie3' },
    { n: 2, t: 16.8, dur: 5.2, lg: 'lg2', halo: 'halo2', pie: 'pie2' },
    { n: 1, t: 22.0, dur: 5.2, lg: 'lg1', halo: 'halo1', pie: 'pie1' },
  ];
  for (const p of puestos) {
    tl.fromTo('#' + p.lg, { opacity: 0, y: -26, scale: .92 }, { opacity: 1, y: 0, scale: 1, duration: .7, ease: EASE }, p.t + .15);
    tl.fromTo('#' + p.halo, { opacity: 0 }, { opacity: 1, duration: .6, ease: EASE }, p.t + .15);
    tl.to('#' + p.lg, { y: -10, duration: 2.4, ease: 'sine.inOut', yoyo: true, repeat: 1 }, p.t + .9);
    tl.fromTo('#' + p.pie, { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: .5, ease: EASE }, p.t + .45);
    /* el flash-through-white marca el corte */
    tl.fromTo('#flash', { opacity: 0 }, { opacity: .30, duration: .06, ease: 'none' }, p.t);
    tl.to('#flash', { opacity: 0, duration: .26, ease: 'power2.out' }, p.t + .06);
    /* y se apagan antes del siguiente */
    tl.to('#' + p.pie, { opacity: 0, duration: .35, ease: 'power2.in' }, p.t + p.dur - .5);
    tl.to('#' + p.lg, { opacity: 0, y: -20, duration: .4, ease: 'power2.in' }, p.t + p.dur - .5);
    tl.to('#' + p.halo, { opacity: 0, duration: .4, ease: 'power2.in' }, p.t + p.dur - .5);
  }

  /* Veredicto */
  tl.fromTo('#pieV', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: .6, ease: EASE }, 27.3);
  tl.fromTo('#fuente', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: .5, ease: EASE }, 27.8);

  window.__timelines["ranking-ref"] = tl;
  if (gsap.ticker) gsap.ticker.fps(30);
})();
</script>
</body>
</html>
