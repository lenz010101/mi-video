      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: #000; }
      #stage {
        position: relative; width: 1080px; height: 1920px;
        overflow: hidden; background: #060306;
        font-family: "Inter", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .scene { position: absolute; inset: 0; background: #060306; opacity: 0; }
      .scene img, .scene video { width: 100%; height: 100%; object-fit: cover; display: block; }

      /* capas de salpicadura roja (gradientes, sin blur) */
      .blood {
        position: absolute; inset: 0; opacity: .85; pointer-events: none; z-index: 3;
        background:
          radial-gradient(circle 26px at 62% 20%, rgba(220,20,30,.75) 0 45%, transparent 60%),
          radial-gradient(circle 14px at 74% 27%, rgba(220,20,30,.6) 0 45%, transparent 60%),
          radial-gradient(circle 9px  at 57% 33%, rgba(190,10,20,.7) 0 45%, transparent 60%),
          radial-gradient(circle 18px at 38% 47%, rgba(220,20,30,.55) 0 45%, transparent 65%),
          radial-gradient(circle 10px at 70% 55%, rgba(190,10,20,.6) 0 45%, transparent 60%),
          radial-gradient(circle 6px  at 45% 13%, rgba(220,20,30,.45) 0 45%, transparent 60%),
          radial-gradient(circle 13px at 82% 44%, rgba(220,20,30,.5) 0 45%, transparent 60%),
          radial-gradient(circle 7px  at 27% 30%, rgba(190,10,20,.45) 0 45%, transparent 60%),
          radial-gradient(circle 11px at 66% 78%, rgba(220,20,30,.4) 0 45%, transparent 62%),
          radial-gradient(circle 5px  at 52% 88%, rgba(220,20,30,.35) 0 45%, transparent 60%);
      }

      /* E1: muro de motel + cartel papel */
      #paper {
        position: absolute; left: 150px; top: 560px; width: 460px; z-index: 6;
        background: #f4f0e6; padding: 34px 30px 20px; transform: rotate(-1.6deg);
        box-shadow: 0 14px 34px rgba(0,0,0,.6);
        clip-path: polygon(0 0, 100% 0, 100% 92%, 86% 100%, 62% 93%, 40% 100%, 22% 94%, 0 100%);
      }
      #paper::before { /* cinta adhesiva */
        content: ""; position: absolute; top: -16px; left: 50%; margin-left: -60px;
        width: 120px; height: 32px; background: rgba(222,215,196,.85); transform: rotate(1deg);
      }
      #paper .p1 { font-size: 20px; font-weight: 800; letter-spacing: .28em; color: #2a2a2a; text-align: center; }
      #paper .p2 { font-size: 46px; font-weight: 800; color: #222; text-align: center; margin: 2px 0 10px; }

      #tickets { position: absolute; left: 380px; top: 970px; width: 230px; z-index: 5; display: flex; gap: 8px; }

        flex: 1; height: 74px; background: #f4f0e6;

      #ghost {

      #vMark, #vMark2 {
        position: absolute; left: 0; right: 0; top: 128px; z-index: 9; text-align: center;

      .lt::after { /* bombilla del borde */

      #marqueeLit .lt { color: #ffe3e3; text-shadow: 0 0 12px rgba(255,90,100,.9), 0 0 34px rgba(255,40,55,.65), 0 0 70px rgba(255,20,40,.5), 0 4px 0 rgba(140,10,16,.9); }

      /* viders: video visible tras el corte de la fiesta */
      #s1

      /* will-change: elementos animados por GSAP */

      #marquee { will-change: opacity; }
      #vidWrap { will-change: opacity, transform; }
      #stkChamp { will-change: opacity, transform; }
    </style>
  </head>

      <script>
        window.__timelines = window.__timelines || {};
        function build() {
          /* Variables en render-time (defaults -> overrides del host -> --variables CLI).
             El runtime inyecta data-var-text / data-var-src; aqui se aplican como
             respaldo y se reconstruye la marquesina letra a letra. */
          var V = (window.__hyperframes && window.__hyperframes.getVariables)
            ? window.__hyperframes.getVariables()
            : {};
          ["saveTitle", "saveDate", "brandName", "brandName2", "vMark", "ghostText",
            "dateLine", "slogan", "lineUp", "access", "djTitle", "djName"].forEach(function (k) {
            var el = document.querySelector('[data-var-text="' + k + '"]');
            if (el && el.childElementCount === 0 && typeof V[k] === "string" && V[k] !== "") {
              el.textContent = V[k];
            }
          });
          var marquee = document.querySelector("#marquee .row");
          if (marquee && typeof V.marqueeText === "string" && V.marqueeText !== "") {
            marquee.innerHTML = "";
            V.marqueeText.split("").forEach(function (ch) {
              var s = document.createElement("span");
              s.className = "lt";
              s.textContent = ch;
              marquee.appendChild(s);
            });
          }

          var tl = gsap.timeline({ paused: true });
          /* E1: flicker de encendido + cartel + tickets + fantasma */
          tl.set("#s1", { opacity: 1 }, 0);
          tl.fromTo("#s1 img", { opacity: 0 }, { opacity: 1, duration: 0.28, ease: "steps(3)" }, 0);
          tl.set("#vMark", { opacity: 1 }, 0.0);
          tl.set("#vMark", { opacity: 0 }, 1.2);
          tl.fromTo("#paper", { y: 26 }, { y: 0, duration: 0.7, ease: "power3.out" }, 0.12);
          tl.set("#tickets", { opacity: 1 }, 0.3);
          tl.set("#ghost", { opacity: 1 }, 0.55);
          tl.set("#ghost", { opacity: 0 }, 1.05);
          /* flash → E2. Flash fuerte del original + punch-out del plano entrante */
          tl.set("#flash", { opacity: 1 }, 1.22); tl.set("#flash", { opacity: 0 }, 1.30);
          tl.set("#s2", { opacity: 1 }, 1.24);
          tl.fromTo("#s2", { scale: 1.09 }, { scale: 1.0, duration: 0.34, ease: "power3.out" }, 1.24);
          tl.set("#vMark2", { opacity: 1 }, 1.24);
          tl.set("#vMark2", { opacity: 0 }, 2.3);
          tl.set("#s2 #marquee .lt", { opacity: 0.38 }, 1.24);
          const lit = "0 0 12px rgba(255,90,100,.9), 0 0 34px rgba(255,40,55,.65), 0 0 70px rgba(255,20,40,.5), 0 4px 0 rgba(140,10,16,.9)";
          [["#s2 .lt:nth-child(1)", 1.35], ["#s2 .lt:nth-child(2)", 1.51], ["#s2 .lt:nth-child(3)", 1.67],
           ["#s2 .lt:nth-child(4)", 1.83], ["#s2 .lt:nth-child(5)", 1.99], ["#s2 .lt:nth-child(6)", 2.15]].forEach(([q, t]) => {
            tl.set(q, { opacity: 1, color: "#ffe3e3", textShadow: lit }, t);
          });
          /* drift hand-held orgánico sobre las stills (como el original) */
          tl.fromTo("#s1 img", { x: -14, y: 8 }, { x: 14, y: -8, duration: 5.0, ease: "none" }, 0);
          tl.fromTo("#s2 img", { x: 12, y: -7 }, { x: -12, y: 7, duration: 3.7, ease: "none" }, 1.25);
          /* ola de stickers 1.7→2.4 (como el original) + float suave */
          tl.fromTo("#stkAlien", { opacity: 0, scale: 0.4, rotation: -18 }, { opacity: 1, scale: 1, rotation: -10, duration: 0.3, ease: "back.out(2.2)" }, 1.72);
          tl.to("#stkAlien", { y: 10, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 4 }, 2.05);
          tl.fromTo("#stkSpray", { opacity: 0, scale: 0.4, rotation: 16 }, { opacity: 1, scale: 1, rotation: 9, duration: 0.3, ease: "back.out(2.2)" }, 1.93);
          tl.to("#stkSpray", { y: -9, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 4 }, 2.25);
          tl.fromTo("#stkBurger", { opacity: 0, scale: 0.4, rotation: -14 }, { opacity: 1, scale: 1, rotation: -7, duration: 0.3, ease: "back.out(2.2)" }, 2.03);
          tl.to("#stkBurger", { y: 8, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 4 }, 2.35);
          /* splatter en dos olas */
