<!DOCTYPE html>
<html lang="es" data-composition-variables='[
  {"id":"resource","type":"string","label":"Toma cruda","default":"../assets/clips/alpro-raw-cut.mp4"},
  {"id":"meme","type":"string","label":"Meme del espejo","default":"../assets/clips/alpro-meme.mp4"},
  {"id":"captions","type":"string","label":"Subtitulos (JSON)","default":"[{\"t\":0.13,\"d\":1.47,\"a\":\"si tienes\",\"b\":\"más de 40\"},{\"t\":1.87,\"d\":0.66,\"a\":\"eres\",\"b\":\"vegana\"},{\"t\":2.80,\"d\":0.64,\"a\":\"y pesas\"},{\"t\":3.44,\"d\":0.94,\"a\":\"lo mismo que a los\",\"b\":\"30\"},{\"t\":4.56,\"d\":0.64,\"a\":\"que estés\"},{\"t\":5.20,\"d\":1.07,\"a\":\"celebrando justo\"},{\"t\":6.31,\"d\":0.39,\"a\":\"lo que tienes\"},{\"t\":6.70,\"d\":0.64,\"a\":\"que\",\"b\":\"vigilar\",\"big\":true},{\"t\":7.45,\"d\":0.85,\"a\":\"porque puedes\"},{\"t\":8.30,\"d\":1.00,\"a\":\"estar\",\"b\":\"pensando\"},{\"t\":9.30,\"d\":0.45,\"a\":\"y estar\"},{\"t\":9.75,\"d\":1.00,\"p\":[\"perdiendo\",\"lo más\",\"importante\"],\"c\":[\"R\",\"\",\"M\"]},{\"t\":10.87,\"d\":1.43,\"a\":\"el\",\"b\":\"MÚSCULO\",\"big\":true},{\"t\":12.30,\"d\":1.45,\"a\":\"te describo.\"}]"}
]'>
<head>
<meta charset="utf-8">
<title>Alpro - edicion estilo PRUEBA (capcut)</title>
<style>
  @font-face { font-family:'Inter'; font-style:normal; font-weight:800;
    src:url('../assets/fonts/inter-800.woff2') format('woff2'); }
  @font-face { font-family:'Inter'; font-style:normal; font-weight:500;
    src:url('../assets/fonts/inter-500.woff2') format('woff2'); }

  :root{
    --amarillo:#F8E33C;
    --rojo:#FF4038;
  }
  html,body{ margin:0; padding:0; background:#000; }
  body{ width:1080px; height:1920px; overflow:hidden; }

  /* Las tomas */
  .plano{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    opacity:0; will-change:opacity,transform; }

  /* El velo del fondo (la cabeza no choca con los bordes) */
  .vineta{ position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(120% 80% at 46% 40%, rgba(0,0,0,0) 55%, rgba(0,0,0,.28) 100%); }

  /* Subtitulos estilo PRUEBA: blanco + palabras clave en amarillo, borde negro */
  .cap{ position:absolute; left:90px; right:90px; top:52%; transform:translateY(-50%);
    text-align:center; opacity:0; pointer-events:none;
    will-change:opacity,transform; }
  .cap-estilo{ position:relative; display:inline-block; }
  .cap-texto{ position:relative; z-index:2;
    font-family:'Inter',sans-serif; font-weight:800;
    font-size:72px; line-height:1.14; letter-spacing:-.005em; color:#FFFFFF; }
  .cap-borde{ position:absolute; left:0; top:0; z-index:1;
    font-family:'Inter',sans-serif; font-weight:800;
    font-size:72px; line-height:1.14; letter-spacing:-.005em; color:transparent;
    -webkit-text-stroke:10px #0B0B0B; }
  .cap-grande .cap-texto, .cap-grande .cap-borde{ font-size:104px; }
  .m-amar{ color:var(--amarillo); text-shadow:0 0 22px rgba(248,227,60,.35); }
  .m-rojo{ color:var(--rojo); text-shadow:0 0 26px rgba(255,64,56,.35); }

  .fundido{ position:absolute; inset:0; background:#000; opacity:0;
    pointer-events:none; will-change:opacity; }
</style>
</head>
<body>

<div id="root" data-composition-id="alpro-edit" data-start="0" data-duration="16.4" data-width="1080" data-height="1920" data-fps="30">

  <!-- La toma cruda ya cortada (sin pausas) y el meme del espejo -->
  <video id="mainv" class="plano" data-start="0" data-duration="13.8" data-track-index="0"
    data-var-src="resource" src="../assets/clips/alpro-raw-cut.mp4" data-has-audio playsinline></video>
  <video id="memev" class="plano" data-start="13.77" data-duration="2.57" data-track-index="0"
    data-var-src="meme" src="../assets/clips/alpro-meme.mp4" data-has-audio playsinline></video>

  <div class="vineta"></div>
  <div class="fundido" id="fundido"></div>
</div>

<script src="../assets/vendor/gsap.min.js"></script>
<script>
(function () {
  const V = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
  const txt = (id, def) => (V && V[id] != null && V[id] !== '') ? String(V[id]) : def;
  const root = document.getElementById('root');

  /* ---- reconstruccion de los subtitulos desde la variable ---- */
  let TARJETAS = [];
  try { TARJETAS = JSON.parse(txt('captions', '[]')); }
  catch (e) { TARJETAS = []; }
  const span = (s, cls) => { const el = document.createElement('span'); if (cls) el.className = cls; el.textContent = s; return el; };

  TARJETAS.forEach((c, i) => {
    const cap = document.createElement('div');
    cap.className = 'cap' + (c.big ? ' cap-grande' : '');
    cap.id = 'cap' + i;
    const estilo = document.createElement('div');
    estilo.className = 'cap-estilo';
    const borde = document.createElement('div');
    borde.className = 'cap-borde';
    const texto = document.createElement('div');
    texto.className = 'cap-texto';
    const piezas = c.p ? c.p : [c.a || '', c.b || ''];
    const colores = (c.c && c.p) ? c.c : (c.p ? ['', 'M'] : ['', '']);
    piezas.forEach((p, j) => {
      if (!p) return;
      const cls = (colores[j] === 'R') ? 'm-rojo' : (colores[j] === 'M' ? 'm-amar' : '');
      texto.appendChild(span(p, cls));
      borde.appendChild(span(p, ''));
      // separador de una linea completa (la segunda pieza baja de linea si viene
      // de dos piezas con el flag big, como el MUSCULO del original)
      if (j === 0 && piezas[1] && piezas[1].length) {
        texto.appendChild(document.createElement('br'));
        borde.appendChild(document.createElement('br'));
      }
    });
    estilo.appendChild(borde);
    estilo.appendChild(texto);
    cap.appendChild(estilo);
    root.appendChild(cap);
  });

  /* ---- timeline ---- */
  const tl = gsap.timeline({ paused: true });

  tl.set('#mainv', { opacity: 1 }, 0);
  /* deriva lenta de la toma + los empujes al estilo PRUEBA */
  tl.fromTo('#mainv', { scale: 1.04 }, { scale: 1.10, duration: 13.77, ease: 'none' }, 0);
  tl.to('#mainv', { scale: 1.20, duration: .30, ease: 'power3.out' }, 9.75);
  tl.to('#mainv', { scale: 1.30, duration: .55, ease: 'power3.out' }, 10.87);
  tl.to('#mainv', { scale: 1.05, duration: .45, ease: 'power3.out' }, 12.30);

  /* el meme del espejo entra con corte seco a los 13.77 */
  tl.set('#mainv', { opacity: 0 }, 13.76);
  tl.set('#memev', { opacity: 1 }, 13.77);
  tl.fromTo('#memev', { scale: 1.02 }, { scale: 1.065, duration: 2.57, ease: 'none' }, 13.77);

  /* subtitulos */
  TARJETAS.forEach((c, i) => {
    tl.fromTo('#cap' + i, { opacity: 0, y: 16, scale: .92 },
      { opacity: 1, y: 0, scale: 1, duration: .24, ease: 'power3.out' }, c.t);
    tl.to('#cap' + i, { opacity: 0, y: -12, duration: .18, ease: 'power2.in' }, c.t + c.d);
  });

  tl.to('#fundido', { opacity: 1, duration: .60, ease: 'power2.inOut' }, 15.75);
  window.__timelines["alpro-edit"] = tl;
  if (gsap.ticker) gsap.ticker.fps(30);
})();
</script>
</body>
</html>
