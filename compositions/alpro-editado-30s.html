<!DOCTYPE html>
<html lang="es" data-composition-variables='[
  {"id":"video","type":"string","label":"Material montado","default":"../assets/clips/alpro-final.mp4"},
  {"id":"voz","type":"string","label":"Voz","default":"../assets/clips/alpro-voz.m4a"}
]'>
<head>
<meta charset="utf-8">
<title>Alpro · edición motion graphics</title>
<style>
  @font-face { font-family:'Inter'; font-style:normal; font-weight:800;
    src:url('../assets/fonts/inter-800.woff2') format('woff2'); }
  @font-face { font-family:'Inter'; font-style:normal; font-weight:600;
    src:url('../assets/fonts/inter-600.woff2') format('woff2'); }

  :root{ --amarillo:#F7E733; }
  html,body{ margin:0; padding:0; background:#000; }
  body{ width:1080px; height:1920px; overflow:hidden; }

  .plano{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    opacity:0; will-change:opacity,transform; }

  .grano{ position:absolute; inset:0; pointer-events:none; opacity:.16;
    background-image:repeating-linear-gradient(0deg, rgba(255,255,255,.045) 0 1px, rgba(0,0,0,0) 1px 3px); }
  .vig{ position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(115% 78% at 50% 42%, rgba(0,0,0,0) 52%, rgba(0,0,0,.34) 100%); }

  /* ── subtítulos estilo "mujer triste": cascada, minúsculas, halo ── */
  .cap{ position:absolute; left:118px; right:118px; top:47%; transform:translateY(-50%);
    text-align:left; opacity:1; pointer-events:none; }
  .ln{ display:flex; flex-wrap:wrap; align-items:baseline; gap:.02em .14em; }
  .ln + .ln{ margin-top:2px; }
  .w{ display:inline-block; opacity:0; font-family:'Inter',sans-serif; font-weight:800;
    letter-spacing:-.015em; text-transform:lowercase; line-height:1.04;
    will-change:transform,opacity; color:#fff;
    text-shadow: 0 0 16px rgba(255,255,255,.42), 0 0 38px rgba(255,255,255,.22),
                 0 3px 14px rgba(0,0,0,.55), 0 1px 4px rgba(0,0,0,.45); }
  .ln.w .w{ font-size:76px; }
  .ln.y .w{ font-size:124px; color:var(--amarillo);
    text-shadow: 0 0 20px rgba(247,231,51,.75), 0 0 52px rgba(240,205,35,.50),
                 0 4px 18px rgba(0,0,0,.45), 0 2px 5px rgba(0,0,0,.35); }
  .ln.s .w{ font-size:62px; }

  .end{ position:absolute; inset:0; opacity:0; will-change:opacity;
    background:
      radial-gradient(75% 55% at 50% 40%, rgba(247,231,51,.10) 0%, rgba(247,231,51,0) 62%),
      linear-gradient(180deg,#0A0A0C 0%,#050506 100%); }
  .end .cap{ top:50%; }

  .fade{ position:absolute; inset:0; background:#000; opacity:0; pointer-events:none; will-change:opacity; }
</style>
</head>
<body>

<div id="root" data-composition-id="alpro-edit" data-start="0" data-duration="26.2"
     data-width="1080" data-height="1920" data-fps="30">

  <video id="plano" class="plano clip" data-start="0" data-duration="22.24" data-track-index="0"
    data-var-src="video" src="../assets/clips/alpro-final.mp4" muted playsinline></video>

  <audio id="voz" class="clip" data-start="0" data-duration="22.24" data-track-index="9"
    data-var-src="voz" src="../assets/clips/alpro-voz.m4a" data-volume="1"></audio>

  <div class="grano"></div>
  <div class="vig"></div>

  <div id="caps"></div>

  <div class="end" id="end">
    <div class="cap">
      <div class="ln w"><span class="w" id="ew0">más de</span></div>
      <div class="ln y" style="margin-left:60px"><span class="w" id="ew1">40</span></div>
    </div>
  </div>

  <div class="fade" id="fade"></div>
</div>

<script src="../assets/vendor/gsap.min.js"></script>
<script>
(function () {
  const V = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
  const g = (id, def) => (V && V[id] != null && V[id] !== '') ? String(V[id]) : def;

  /* Tarjetas estilo "mujer triste": líneas en cascada.
     s: 'w' línea blanca chica | 'y' línea amarilla grande | 's' blanca muy chica
     x: sangría px de la línea (efecto escalera)                          */
  const CAPS = [
    { t: 2.40,  d: 0.62, lines: [ { s:'w', words:['si tienes'] } ] },
    { t: 3.02,  d: 1.13, lines: [ { s:'w', words:['más de'] },
                                  { s:'y', words:['40'], x:60 } ] },
    { t: 4.237, d: 0.86, lines: [ { s:'w', words:['eres'] },
                                  { s:'y', words:['vegana'], x:60 } ] },
    { t: 5.204, d: 0.52, lines: [ { s:'w', words:['y pesas'] } ] },
    { t: 5.75,  d: 1.27, lines: [ { s:'w', words:['lo mismo'] },
                                  { s:'w', words:['que a los'], x:60 },
                                  { s:'y', words:['30'], x:130 } ] },
    { t: 7.139, d: 0.69, lines: [ { s:'w', words:['que estés'] } ] },
    { t: 7.86,  d: 1.12, lines: [ { s:'w', words:['celebrando'] },
                                  { s:'y', words:['justo'], x:60 } ] },
    { t: 9.096, d: 0.35, lines: [ { s:'w', words:['lo que tienes'] } ] },
    { t: 9.46,  d: 0.82, lines: [ { s:'w', words:['que'] },
                                  { s:'y', words:['vigilar'], x:60 } ] },
    { t: 10.335,d: 1.01, lines: [ { s:'w', words:['porque puedes'] } ] },
    { t: 11.40, d: 1.05, lines: [ { s:'w', words:['estar'] },
                                  { s:'y', words:['pensando'], x:60 } ] },
    { t: 12.90, d: 1.12, lines: [ { s:'w', words:['y estar'] },
                                  { s:'s', words:['perdiendo'], x:110 },
                                  { s:'y', words:['lo más importante'], x:40 } ] },
    { t: 16.633,d: 1.17, lines: [ { s:'w', words:['el'] },
                                  { s:'y', words:['músculo'], x:60 } ] },
    { t: 17.85, d: 1.80, lines: [ { s:'w', words:['te describo.'] } ] }
  ];

  const caps = document.getElementById('caps');
  CAPS.forEach((c, i) => {
    const cap = document.createElement('div');
    cap.className = 'cap';
    cap.id = 'cap' + i;
    c.lines.forEach((ln, k) => {
      const row = document.createElement('div');
      row.className = 'ln ' + ln.s;
      if (ln.x) row.style.marginLeft = ln.x + 'px';
      if (ln.y !== undefined) row.style.marginTop = (ln.y || 0) + 'px';
      (ln.words || []).forEach(word => {
        word.split(' ').forEach((token, j) => {
          if (j > 0) row.appendChild(document.createTextNode(' '));
          const s = document.createElement('span');
          s.className = 'w';
          s.id = 'w' + i + '_' + k + '_' + j;
          s.textContent = token;
          row.appendChild(s);
        });
      });
      cap.appendChild(row);
    });
    caps.appendChild(cap);
  });

  /* ── timeline ── */
  const tl = gsap.timeline({ paused: true });
  if (gsap.ticker) gsap.ticker.fps(30);

  tl.set('#plano', { opacity: 1 }, 0);
  tl.fromTo('#plano', { scale: 1.00 }, { scale: 1.035, duration: 2.40, ease: 'none' }, 0);
  const CUTS = [
    [2.40, 1.075], [4.237, 1.05], [5.204, 1.10], [7.139, 1.055], [9.096, 1.105],
    [10.335, 1.06], [14.063, 1.09], [16.633, 1.055], [19.883, 1.08]
  ];
  CUTS.forEach((c) => {
    tl.fromTo('#plano', { scale: c[1] + 0.055 }, { scale: c[1], duration: 0.6, ease: 'power3.out' }, c[0]);
  });

  /* subtítulos: palabras aparecen en cadena, línea a línea (estilo capcut) */
  CAPS.forEach((c, i) => {
    c.lines.forEach((ln, k) => {
      const n = (ln.words || []).join(' ').split(' ').length;
      for (let j = 0; j < n; j++) {
        tl.fromTo('#w' + i + '_' + k + '_' + j,
          { opacity: 0, y: 26, scale: 0.78 },
          { opacity: 1, y: 0, scale: 1, duration: 0.30, ease: 'back.out(1.8)' },
          c.t + k * 0.14 + j * 0.05);
      }
    });
    tl.to('#cap' + i, { opacity: 0, duration: 0.13, ease: 'power1.in' }, Math.max(c.t + 0.22, c.t + c.d - 0.13));
    tl.set('#cap' + i, { opacity: 0 }, c.t + c.d + 0.30);
  });

  tl.set('#end', { opacity: 1 }, 22.18);
  tl.fromTo('#ew0', { opacity: 0, y: 26, scale: 0.78 },
    { opacity: 1, y: 0, scale: 1, duration: 0.30, ease: 'back.out(1.8)' }, 22.36);
  tl.fromTo('#ew1', { opacity: 0, y: 26, scale: 0.78 },
    { opacity: 1, y: 0, scale: 1, duration: 0.30, ease: 'back.out(1.8)' }, 22.55);
  tl.set('#ew0,#ew1', { opacity: 1 });

  tl.to('#fade', { opacity: 1, duration: 0.70, ease: 'power2.inOut' }, 25.40);

  window.__timelines["alpro-edit"] = tl;
})();
</script>
</body>
</html>
