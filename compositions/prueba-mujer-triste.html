<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>prueba-mujer-triste</title>
<style>
  @font-face{
    font-family:'InterCap'; font-weight:800; font-style:normal;
    src:url('../assets/fonts/inter-800.woff2') format('woff2');
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:1080px; height:1920px; overflow:hidden; background:#000; }
  body{ font-family:'InterCap',system-ui,sans-serif; }

  #root{ position:relative; width:1080px; height:1920px; overflow:hidden; background:#000; }

  /* ── material ─────────────────────────────────────────────────────── */
  .wrap{ position:absolute; inset:0; will-change:transform; }
  .shot{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; will-change:transform,opacity; }

  /* ── subtítulos estilo motion-graphics (logo de la referencia) ───── */
  .cap{ position:absolute; left:40px; right:40px; top:952px;
        text-align:center; opacity:0; will-change:transform,opacity; }
  .cap-pre{ display:block; font-size:72px; line-height:1.04; font-weight:800; color:#fff;
        letter-spacing:-0.005em; text-shadow:0 3px 12px rgba(0,0,0,.55); will-change:transform,opacity; }
  .cap-pre.r{ color:#FF2A24; text-shadow:0 0 22px rgba(255,42,36,.32), 0 3px 12px rgba(0,0,0,.45); }
  .cap-main{ display:block; font-size:164px; line-height:.98; font-weight:800;
        margin-top:18px; will-change:transform,opacity; overflow:hidden;
        padding-bottom:.06em; margin-bottom:-.06em; }
  .cap-main.y{ color:#FFE800; text-shadow:0 0 26px rgba(255,232,0,.45), 0 4px 16px rgba(0,0,0,.35); }
  .cap-main.w{ color:#fff; text-shadow:0 4px 16px rgba(0,0,0,.5); }
  .cap-main.mx i{ display:inline-block; font-style:normal; opacity:0; }
  #c13 .mx i{ will-change:transform,opacity; }
  .cap .m{ display:inline-block; overflow:hidden; vertical-align:bottom;
        padding-bottom:.06em; margin-bottom:-.06em; will-change:transform; }
  .cap .w{ display:inline-block; opacity:0; will-change:transform,opacity; }
  #c1p .w,#c3p .w,#c4p .w,#c8p .w,#c10p .w,#c12p .w,#c13p .w,
  #c1m .w,#c2m .w,#c3m .w,#c4m .w,#c5m .w,#c6m .w,#c7m .w,#c8m .w,
  #c9m .w,#c10m .w,#c10s .w,#c11m .w,#c12m .w{ will-change:transform,opacity; }
  .cap-sub{ display:block; font-size:66px; line-height:1.04; font-weight:800; color:#fff;
        margin-top:12px; opacity:0; text-shadow:0 3px 12px rgba(0,0,0,.55); will-change:transform,opacity; }

  .fade{ position:absolute; inset:0; background:#000; opacity:0; will-change:opacity; pointer-events:none; }

  /* ── toma de apoyo (la mujer al espejo): tarjeta arriba, la cocina
     sigue rodando debajo ───────────────────────────────────────────── */
  .pip{ position:absolute; left:70px; right:70px; top:150px; height:700px;
        border-radius:26px; overflow:hidden; opacity:0; background:#0b0a08;
        box-shadow:0 26px 70px rgba(0,0,0,.55), 0 0 0 2px rgba(255,255,255,.08);
        will-change:transform,opacity,visibility; }
  #w3{ will-change:transform; }
  .pip video{ position:absolute; inset:0; width:100%; height:100%;
        object-fit:cover; object-position:50% 45%;
        will-change:transform; }
</style>
</head>
<body>

<div id="root" data-composition-id="prueba-mujer" data-start="0" data-duration="18.75" data-width="1080" data-height="1920" data-fps="30">

  <!-- ═══ MATERIAL ═══ -->
  <div class="wrap" id="w1">
    <video id="v1" class="shot clip" data-start="0" data-duration="12.98" data-track-index="0" src="../assets/prueba/toma-a.mp4" muted playsinline></video>
  </div>
  <video id="v3" class="shot clip" data-start="12.98" data-duration="3.50" data-track-index="0" src="../assets/prueba/toma-b.mp4" muted playsinline></video>

  <!-- ═══ VOZ (audio de la toma) + música instrumental de fondo ═══ -->
  <audio id="vozA" class="clip" data-start="0"     data-duration="12.98" data-track-index="1" src="../assets/prueba/voz-a.m4a" data-volume="1"></audio>
  <audio id="vozb" class="clip" data-start="12.98" data-duration="3.50"  data-track-index="1" src="../assets/prueba/voz-b.m4a" data-volume="1"></audio>
  <audio id="mus"  class="clip" data-start="0"     data-duration="18.75" data-track-index="9" src="../assets/nuevo/mus/m614.mp3" data-volume="0.16"></audio>

  <!-- ═══ TOMA DE APOYO arriba: la mujer al espejo (12.98 - 15.18) ═══ -->
  <div class="pip" id="pip">
    <video id="v2" class="pipv clip" data-start="12.98" data-duration="2.20" data-track-index="2" src="../assets/prueba/espejo.mp4" muted playsinline></video>
  </div>

  <!-- ═══ SUBTÍTULOS (mismo texto y ritmo que la referencia) ·
       cada frase entra palabra a palabra (karaoke con pop) ═══ -->
  <div class="cap" id="c1"><span class="cap-pre" id="c1p"><span class="m"><span class="w">Si</span></span> <span class="m"><span class="w">tienes</span></span></span><span class="cap-main y" id="c1m"><span class="m"><span class="w">más</span></span> <span class="m"><span class="w">de</span></span> <span class="m"><span class="w">40</span></span></span></div>
  <div class="cap" id="c2"><span class="cap-main y" id="c2m"><span class="m"><span class="w">vegana</span></span></span></div>
  <div class="cap" id="c3"><span class="cap-pre" id="c3p"><span class="m"><span class="w">y</span></span></span><span class="cap-main y" id="c3m"><span class="m"><span class="w">pesas</span></span></span></div>
  <div class="cap" id="c4"><span class="cap-pre" id="c4p"><span class="m"><span class="w">lo</span></span> <span class="m"><span class="w">mismo</span></span> <span class="m"><span class="w">que</span></span></span><span class="cap-main y" id="c4m"><span class="m"><span class="w">a</span></span> <span class="m"><span class="w">los</span></span> <span class="m"><span class="w">30</span></span></span></div>
  <div class="cap" id="c5"><span class="cap-main w" id="c5m"><span class="m"><span class="w">puede</span></span></span></div>
  <div class="cap" id="c6"><span class="cap-main w" id="c6m"><span class="m"><span class="w">celebrando</span></span></span></div>
  <div class="cap" id="c7"><span class="cap-main w" id="c7m"><span class="m"><span class="w">justo</span></span></span></div>
  <div class="cap" id="c8"><span class="cap-pre" id="c8p"><span class="m"><span class="w">lo</span></span> <span class="m"><span class="w">que</span></span> <span class="m"><span class="w">tienes</span></span> <span class="m"><span class="w">que</span></span></span><span class="cap-main y" id="c8m"><span class="m"><span class="w">vigilar</span></span></span></div>
  <div class="cap" id="c9"><span class="cap-main w" id="c9m"><span class="m"><span class="w">porque</span></span> <span class="m"><span class="w">puedes</span></span></span></div>
  <div class="cap" id="c10"><span class="cap-pre" id="c10p"><span class="m"><span class="w">estar</span></span></span><span class="cap-main y" id="c10m"><span class="m"><span class="w">pensando</span></span></span><span class="cap-sub" id="c10s"><span class="m"><span class="w">lo</span></span> <span class="m"><span class="w">mismo</span></span></span></div>
  <div class="cap" id="c11"><span class="cap-main w" id="c11m"><span class="m"><span class="w">y</span></span> <span class="m"><span class="w">estar</span></span></span></div>
  <div class="cap" id="c12"><span class="cap-pre r" id="c12p"><span class="m"><span class="w">perdiendo</span></span> <span class="m"><span class="w">lo</span></span></span><span class="cap-main y" id="c12m"><span class="m"><span class="w">más</span></span> <span class="m"><span class="w">importante</span></span></span></div>
  <div class="cap" id="c13"><span class="cap-main w" id="c13p"><span class="m"><span class="w">el</span></span></span><span class="cap-main y mx" id="c13m"><i>M</i><i>Ú</i><i>S</i><i>C</i><i>U</i><i>L</i><i>O</i></span></div>

  <div class="fade" id="fade"></div>
</div>

<script src="../assets/vendor/gsap.min.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════════════
   PRUEBA-MUJER — la toma de cocina (1.MP4) con la edición de la
   referencia "PRUEBA 30 SEC.mp4": subtítulos palabra a palabra
   (blanca + palabra activa amarilla, rojo para lo negativo, "MÚSCULO"
   tecleado) + inserto de la mujer al espejo + punch-ins por frase.
   Timeline única pausada en window.__timelines["prueba-mujer"]. Build
   síncrono, sin rAF ni timeouts, gsap.ticker.fps sincronizado.
   ══════════════════════════════════════════════════════════════════════ */
(function () {
  gsap.ticker.fps(30);

  if (window.CustomEase) {
    gsap.registerPlugin(CustomEase);
    CustomEase.create('prb', 'M0,0 C0.12,0.86 0.18,1 1,1');
  }
  const EASE = window.CustomEase ? 'prb' : 'power3.out';
  const POP  = 'back.out(2)';

  const tl = gsap.timeline({ paused: true });

  /* ── material: zoom lento + fundido de cierre ───────────────────── */
  tl.fromTo('#w1', { scale: 1.02 }, { scale: 1.075, duration: 12.98, ease: 'none', immediateRender: false }, 0);
  tl.fromTo('#w3', { scale: 1.075 }, { scale: 1.02, duration: 5.50, ease: 'none', immediateRender: false }, 12.98);
  tl.fromTo('#fade', { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'power1.in', immediateRender: false }, 18.2);

  /* ── toma de apoyo (espejo): pop de entrada arriba, salida deslizando ── */
  tl.set('#pip', { visibility: 'visible' }, 12.98);
  tl.fromTo('#pip', { opacity: 0, y: 26, scale: 0.95 }, { opacity: 1, y: 0, scale: 1, duration: 0.36, ease: EASE, immediateRender: false }, 12.98);
  tl.to('#pip', { opacity: 0, y: -30, scale: 1.02, duration: 0.3, ease: 'power2.in' }, 15.1);

  /* ── frases: contenedor + punch-in del plano ───────────────────── */
  const bloques = [
    { id: 'c1',  t: 0.30, e: 1.90 },
    { id: 'c2',  t: 1.90, e: 2.40 },
    { id: 'c3',  t: 2.40, e: 3.40 },
    { id: 'c4',  t: 3.40, e: 4.40 },
    { id: 'c5',  t: 4.40, e: 4.95 },
    { id: 'c6',  t: 4.95, e: 5.45 },
    { id: 'c7',  t: 5.45, e: 6.65 },
    { id: 'c8',  t: 6.90, e: 8.30 },
    { id: 'c9',  t: 8.30, e: 8.95 },
    { id: 'c10', t: 8.95, e: 10.00 },
    { id: 'c11', t: 10.00, e: 10.40 },
    { id: 'c12', t: 10.40, e: 11.55 },
    { id: 'c13', t: 11.55, e: 12.92 },
  ];
  for (const b of bloques) {
    tl.set('#' + b.id, { opacity: 1 }, b.t);
    tl.fromTo('#' + b.id, { y: 26 }, { y: 0, duration: 0.26, ease: EASE, immediateRender: false }, b.t);
    tl.to('#' + b.id, { opacity: 0, duration: 0.1, ease: 'power1.in' }, b.e - 0.1);
    /* punch-in del plano de fondo con cada frase */
    tl.fromTo('#v1', { scale: 1.0 }, { scale: 1.065, duration: 0.09, ease: 'power2.out', overwrite: 'auto', immediateRender: false }, b.t);
    tl.to('#v1', { scale: 1.0, duration: 0.4, ease: 'power2.out', overwrite: 'auto' }, b.t + 0.09);
  }

  /* ── karaoke palabra a palabra (como la referencia): cada palabra
     entra con su pop; la amarilla golpea más fuerte ─────────────── */
  function kara(sel, times, big) {
    gsap.utils.toArray(sel).forEach(function (el, i) {
      const t = times[i];
      tl.set(el, { opacity: 1 }, t);
      tl.fromTo(el,
        { yPercent: 118, scale: big ? 1.26 : 1 },
        { yPercent: 0, scale: 1, duration: big ? 0.42 : 0.22,
          ease: big ? 'back.out(1.8)' : 'back.out(2.4)', immediateRender: false }, t);
    });
  }
  kara('#c1p .w', [0.30, 0.62]);        kara('#c1m .w', [1.05, 1.30, 1.50], true);
  kara('#c2m .w', [1.92], true);
  kara('#c3p .w', [2.42]);             kara('#c3m .w', [2.72], true);
  kara('#c4p .w', [3.45, 3.68, 3.92]); kara('#c4m .w', [4.16, 4.26, 4.36], true);
  kara('#c5m .w', [4.43], true);
  kara('#c6m .w', [4.98], true);
  kara('#c7m .w', [5.50], true);
  kara('#c8p .w', [6.95, 7.17, 7.38, 7.60]); kara('#c8m .w', [7.84], true);
  kara('#c9m .w', [8.33, 8.60], true);
  kara('#c10p .w', [9.02]);            kara('#c10m .w', [9.30], true);
  kara('#c10s .w', [9.55, 9.72]);
  kara('#c11m .w', [10.03, 10.20], true);
  kara('#c12p .w', [10.46, 10.82]);    kara('#c12m .w', [11.02, 11.28], true);
  kara('#c13p .w', [11.60]);

  /* ── "MÚSCULO": letras deslizandose por la mascara + golpe ─────── */
  tl.fromTo('#c13 .mx i', { opacity: 0, yPercent: 115 },
    { opacity: 1, yPercent: 0, duration: 0.3, stagger: 0.05, ease: 'back.out(2)', immediateRender: false }, 11.75);
  tl.set('#c13m', { opacity: 1 }, 11.75);
  tl.fromTo('#c13m', { scale: 1.35 }, { scale: 1, duration: 0.45, ease: 'back.out(2.2)', immediateRender: false }, 11.75);

  window.__timelines["prueba-mujer"] = tl;
})();
</script>
</body>
</html>
