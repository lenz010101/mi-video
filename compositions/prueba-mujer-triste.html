<!DOCTYPE html>
<html lang="es" data-composition-variables='[
  {"id":"encabezado","type":"string","label":"Frase de apertura","default":"Si tienes"}
]'>
<head>
<meta charset="utf-8" />
<title>prueba-mujer-triste</title>
<style>
  @font-face{
    font-family:'InterCap'; font-weight:800; font-style:normal;
    src:url('../assets/fonts/inter-800.woff2') format('woff2');
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:1080px; height:1920px; overflow:hidden; background:#000; }
  body{ font-family:'InterCap',system-ui,sans-serif; }

  #root{ position:relative; width:1080px; height:1920px; overflow:hidden; background:#000; }

  /* ── material ─────────────────────────────────────────────────────── */
  .wrap{ position:absolute; inset:0; will-change:transform; }
  .shot{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; will-change:transform,opacity; }

  /* ── subtítulos estilo motion-graphics (logo de la referencia) ───── */
  .cap{ position:absolute; left:40px; right:40px; top:952px;
        text-align:center; opacity:0; will-change:transform,opacity; }
  .cap-pre{ display:block; font-size:66px; line-height:1.04; font-weight:800; color:#fff;
        letter-spacing:-0.005em; text-shadow:0 3px 12px rgba(0,0,0,.55); will-change:transform,opacity; }
  .cap-pre.r{ color:#FF2A24; text-shadow:0 0 22px rgba(255,42,36,.32), 0 3px 12px rgba(0,0,0,.45); }
  .cap-main{ display:block; font-size:148px; line-height:.98; font-weight:800;
        margin-top:18px; will-change:transform,opacity; }
  .cap-main.y{ color:#FFE800; text-shadow:0 0 26px rgba(255,232,0,.45), 0 4px 16px rgba(0,0,0,.35); }
  .cap-main.w{ color:#fff; text-shadow:0 4px 16px rgba(0,0,0,.5); }
  .cap-main.mx i{ display:inline-block; font-style:normal; opacity:0; }
  #c13 .mx i{ will-change:transform,opacity; }
  .cap-sub{ display:block; font-size:66px; line-height:1.04; font-weight:800; color:#fff;
        margin-top:12px; opacity:0; text-shadow:0 3px 12px rgba(0,0,0,.55); will-change:transform,opacity; }
  #c13p{ opacity:0; }

  .fade{ position:absolute; inset:0; background:#000; opacity:0; will-change:opacity; pointer-events:none; }
</style>
</head>
<body>

<div id="root" data-composition-id="prueba-mujer" data-start="0" data-duration="18.75" data-width="1080" data-height="1920" data-fps="30">

  <!-- ═══ MATERIAL ═══ -->
  <div class="wrap" id="w1">
    <video id="v1" class="shot clip" data-start="0" data-duration="12.98" data-track-index="0" src="../assets/prueba/toma-a.mp4" muted playsinline></video>
  </div>
  <video id="v2" class="shot clip" data-start="12.98" data-duration="2.20" data-track-index="0" src="../assets/prueba/espejo.mp4" muted playsinline></video>
  <div class="wrap" id="w3">
    <video id="v3" class="shot clip" data-start="15.18" data-duration="3.50" data-track-index="0" src="../assets/prueba/toma-b.mp4" muted playsinline></video>
  </div>

  <!-- ═══ VOZ (audio de la toma + audio del inserto con su música) ═══ -->
  <audio id="vozA" class="clip" data-start="0"     data-duration="12.98" data-track-index="1" src="../assets/prueba/voz-a.m4a" data-volume="1"></audio>
  <audio id="vozE" class="clip" data-start="12.98" data-duration="2.20"  data-track-index="1" src="../assets/prueba/espejo-a.m4a" data-volume="1"></audio>
  <audio id="vozb" class="clip" data-start="15.18" data-duration="3.50"  data-track-index="1" src="../assets/prueba/voz-b.m4a" data-volume="1"></audio>

  <!-- ═══ SUBTÍTULOS (mismo texto y ritmo que la referencia) ═══ -->
  <div class="cap" id="c1"><span class="cap-pre" id="c1p" data-var-text="encabezado">Si tienes</span><span class="cap-main y" id="c1m">más de 40</span></div>
  <div class="cap" id="c2"><span class="cap-main y" id="c2m">vegana</span></div>
  <div class="cap" id="c3"><span class="cap-pre" id="c3p">y</span><span class="cap-main y" id="c3m">pesas</span></div>
  <div class="cap" id="c4"><span class="cap-pre" id="c4p">lo mismo que</span><span class="cap-main y" id="c4m">a los 30</span></div>
  <div class="cap" id="c5"><span class="cap-main w" id="c5m">puede</span></div>
  <div class="cap" id="c6"><span class="cap-main w" id="c6m">celebrando</span></div>
  <div class="cap" id="c7"><span class="cap-main w" id="c7m">justo</span></div>
  <div class="cap" id="c8"><span class="cap-pre" id="c8p">lo que tienes que</span><span class="cap-main y" id="c8m">vigilar</span></div>
  <div class="cap" id="c9"><span class="cap-main w" id="c9m">porque puedes</span></div>
  <div class="cap" id="c10"><span class="cap-pre" id="c10p">estar</span><span class="cap-main y" id="c10m">pensando</span><span class="cap-sub" id="c10s">lo mismo</span></div>
  <div class="cap" id="c11"><span class="cap-main w" id="c11m">y estar</span></div>
  <div class="cap" id="c12"><span class="cap-pre r" id="c12p">perdiendo lo</span><span class="cap-main y" id="c12m">más importante</span></div>
  <div class="cap" id="c13"><span class="cap-main w" id="c13p">el</span><span class="cap-main y mx" id="c13m"><i>M</i><i>Ú</i><i>S</i><i>C</i><i>U</i><i>L</i><i>O</i></span></div>

  <div class="fade" id="fade"></div>
</div>

<script src="../assets/vendor/gsap.min.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════════════
   PRUEBA-MUJER — la toma de cocina (1.MP4) con la edición de la
   referencia "PRUEBA 30 SEC.mp4": subtítulos palabra a palabra
   (blanca + palabra activa amarilla, rojo para lo negativo, "MÚSCULO"
   tecleado) + inserto de la mujer al espejo + punch-ins por frase.
   Timeline única pausada en window.__timelines["prueba-mujer"]. Build
   síncrono, sin rAF ni timeouts, gsap.ticker.fps sincronizado.
   ══════════════════════════════════════════════════════════════════════ */
(function () {
  gsap.ticker.fps(30);

  if (window.CustomEase) {
    gsap.registerPlugin(CustomEase);
    CustomEase.create('prb', 'M0,0 C0.12,0.86 0.18,1 1,1');
  }
  const EASE = window.CustomEase ? 'prb' : 'power3.out';
  const POP  = 'back.out(2)';

  const tl = gsap.timeline({ paused: true });

  /* ── material: zoom lento + fundido de cierre ───────────────────── */
  tl.fromTo('#w1', { scale: 1.02 }, { scale: 1.075, duration: 12.98, ease: 'none', immediateRender: false }, 0);
  tl.fromTo('#w3', { scale: 1.075 }, { scale: 1.02, duration: 3.50, ease: 'none', immediateRender: false }, 15.18);
  tl.fromTo('#fade', { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'power1.in', immediateRender: false }, 18.2);

  /* ── frases: cada bloque de subtitulo con su tiempo ────────────── */
  const bloques = [
    { id: 'c1',  t: 0.30, e: 1.90 },
    { id: 'c2',  t: 1.90, e: 2.40 },
    { id: 'c3',  t: 2.40, e: 3.40 },
    { id: 'c4',  t: 3.40, e: 4.40 },
    { id: 'c5',  t: 4.40, e: 4.95 },
    { id: 'c6',  t: 4.95, e: 5.45 },
    { id: 'c7',  t: 5.45, e: 6.65 },
    { id: 'c8',  t: 6.90, e: 8.30 },
    { id: 'c9',  t: 8.30, e: 8.95 },
    { id: 'c10', t: 8.95, e: 10.00 },
    { id: 'c11', t: 10.00, e: 10.40 },
    { id: 'c12', t: 10.40, e: 11.55 },
    { id: 'c13', t: 11.55, e: 12.92 },
  ];
  for (const b of bloques) {
    tl.set('#' + b.id, { opacity: 1 }, b.t);
    tl.fromTo('#' + b.id, { y: 26 }, { y: 0, duration: 0.26, ease: EASE, immediateRender: false }, b.t);
    tl.to('#' + b.id, { opacity: 0, duration: 0.1, ease: 'power1.in' }, b.e - 0.1);
    if (document.querySelector('#' + b.id + ' .cap-main')) {
      tl.fromTo('#' + b.id + ' .cap-main', { scale: 1.28 }, { scale: 1, duration: 0.38, ease: POP, immediateRender: false }, b.t + 0.02);
    }
    /* punch-in del plano de fondo con cada frase (overwrite: auto para
       que dos frases seguidas no peleen por el scale) */
    tl.fromTo('#v1', { scale: 1.0 }, { scale: 1.065, duration: 0.09, ease: 'power2.out', overwrite: 'auto', immediateRender: false }, b.t);
    tl.to('#v1', { scale: 1.0, duration: 0.4, ease: 'power2.out', overwrite: 'auto' }, b.t + 0.09);
  }

  /* ── "MÚSCULO" tecleado letra a letra (revelado del original) ──── */
  tl.fromTo('#c13 .mx i', { opacity: 0 }, { opacity: 1, duration: 0.02, stagger: 0.05, ease: 'none', immediateRender: false }, 11.6);
  tl.fromTo('#c13p', { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: EASE, immediateRender: false }, 11.6);

  /* subtitulo del bloque c10 entra un poco despues */
  tl.fromTo('#c10s', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, ease: EASE, immediateRender: false }, 9.45);

  window.__timelines["prueba-mujer"] = tl;
})();
</script>
</body>
</html>
