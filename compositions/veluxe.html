<!DOCTYPE html>
<html
  lang="es"
  data-composition-variables='[
    {"id":"videoSrc","type":"image","label":"Video principal","default":"../demo2/new/master.mp4"},
    {"id":"audioSrc","type":"image","label":"Audio","default":"../demo2/new/audio.m4a"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>VELUXE V3 · promo motel</title>
    <link rel="stylesheet" href="../assets/fonts/fonts.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: #000; }
      #stage {
        position: relative; width: 1080px; height: 1920px;
        overflow: hidden; background: #060306;
        -webkit-font-smoothing: antialiased;
      }
      #vids { position: absolute; inset: 0; }
      #kicker {
        position: absolute; left: 0; top: 200px; width: 1080px; height: 1520px;
        overflow: hidden;
      }
      #kicker video {
        width: 100%; height: 100%; display: block; object-fit: fill;
      }
      /* mecla del borde de la banda video a negro (arriba/abajo dark) */
      #fadeTop {
        position: absolute; left: 0; top: 200px; width: 1080px; height: 90px;
        background: linear-gradient(to bottom, rgba(6, 3, 6, 0.96), rgba(6, 3, 6, 0) 78%);
        z-index: 8; pointer-events: none;
      }
      #fadeBot {
        position: absolute; left: 0; bottom: 200px; width: 1080px; height: 110px;
        background: linear-gradient(to top, rgba(6, 3, 6, 0.92), rgba(6, 3, 6, 0) 70%);
        z-index: 8; pointer-events: none;
      }
    
      /* will-change: elementos animados por GSAP */
      #kicker { will-change: transform; }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="veluxe"
      data-start="0"
      data-duration="9.37"
      data-width="1080"
      data-height="1920"
      data-fps="30"
    >
      <audio
        id="track"
        data-start="0"
        data-duration="9.37"
        data-media-start="0"
        data-track-index="3"
        data-volume="1"
        src="../demo2/new/audio.m4a"
        data-var-src="audioSrc"
        preload="auto"
      ></audio>

      <div id="vids">
        <div id="kicker"><video id="master" src="../demo2/new/master.mp4" data-var-src="videoSrc" data-start="0" data-duration="9.367" muted playsinline preload="auto"></video></div>
        <div id="fadeTop"></div>
        <div id="fadeBot"></div>
      </div>

      <script src="../assets/vendor/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        function build() {
          /* Ticker a la cadencia de captura (data-fps): el renderizador
             recorre la timeline fotograma a fotograma. */
          if (gsap.ticker) gsap.ticker.fps(30);
          var tl = gsap.timeline({ paused: true });
          /* vida sutil: push-in ligado a la banda completa (barato, solo transform) */
          tl.fromTo("#kicker", { scale: 1.0 }, { scale: 1.022, duration: 9.37, ease: "none" }, 0);
          window.__timelines["veluxe"] = tl;
        }
        build();   /* build sincrono: la timeline existe antes del primer fotograma */
      </script>
    </div>
  </body>
</html>
