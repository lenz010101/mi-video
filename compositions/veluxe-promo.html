  <head>
    <meta charset="UTF-8" />
    <title>VELUXE V3 — promo vertical 9:16 (12 s)</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: #000; }
      #stage {
        position: relative; width: 1080px; height: 1920px; overflow: hidden;
        background: #050406; font-family: "Inter", "Helvetica Neue", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      img { display: block; }
      .scene { position: absolute; inset: 0; opacity: 0; }
      #content { position: absolute; inset: 0; will-change: transform; }
      /* split RGB de los cortes (se activa por className desde GSAP) */
      #content.glitch {
        filter: drop-shadow(11px 0 rgba(255, 0, 64, .95)) drop-shadow(-11px 0 rgba(0, 228, 255, .9));
      }

      /* ══════════ ESCENA 1 · CARTEL DE PAPEL (0.00 – 2.00) ══════════ */
      #s1bg {
        position: absolute; inset: 0;

      }
      #flyer {
        position: absolute; left: 220px; top: 520px; width: 640px; height: 800px;

      }
      #dust { position: absolute; inset: 0; }
      #dust i {
        position: absolute; display: block; border-radius: 50%;
        background: radial-gradient(circle, #ff5a4a 0%, rgba(255, 60, 40, .55) 45%, rgba(255, 40, 30, 0) 72%);
        will-change: transform, opacity;
      }
      #whip {
        position: absolute; inset: 0; opacity: 0; transform-origin: 50% 50%;
        background: linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(255, 70, 60, .22) 38%, rgba(255, 140, 70, .16) 56%, rgba(0,0,0,0) 100%);
        will-change: transform, opacity;
      }

      /* ══════════ ESCENA 2 · ENTRADA DEL CLUB (2.00 – 5.00) ══════════ */
      #entrance {
        position: absolute; left: -40px; top: -60px; width: 1160px; height: 2040px;
        object-fit: cover; will-change: transform;
      }
      #s2grade {
        position: absolute; inset: 0; pointer-events: none;
        background:
          radial-gradient(circle 620px at 50% 22%, rgba(255, 40, 30, .20) 0%, rgba(255, 30, 20, 0) 70%),
          linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 26%, rgba(0,0,0,0) 58%, rgba(0,0,0,.82) 100%);

      #neonPlate {

      #bulbs { position: absolute; left: 262px; top: 238px; width: 556px; height: 22px; z-index: 4; }
      #bulbs i {
        position: absolute; top: 0; width: 20px; height: 20px; border-radius: 50%;

      #logoMark {

        background: radial-gradient(ellipse 78% 62% at 50% 46%, rgba(0,0,0,0) 42%, rgba(0,0,0,.55) 78%, rgba(0,0,0,.92) 100%);
      }
    </style>
  </head>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};

        function build() {
          var tl = gsap.timeline({ paused: true });

          /* ───────── ESCENA 1 · 0.00 – 2.00 · CARTEL ─────────
             Push-in lento (0.00 → 1.20) y whip-pan a la derecha
             (1.50 → 1.95). Corte seco a los 2.00. */
          tl.set("#s1", { opacity: 1 }, 0);
          tl.set("#s2", { opacity: 0 }, 0);
          tl.set("#s4", { opacity: 0 }, 0);
          tl.set("#s5", { opacity: 0 }, 0);

          tl.fromTo("#flyer", { opacity: 0, scale: 1.02, rotation: -1.6, x: 0 },
            { opacity: 1, scale: 1.02, rotation: -1.6, x: 0, duration: 0.35, ease: "power2.out" }, 0);
          tl.to("#flyer", { scale: 1.12, duration: 1.2, ease: "power1.out" }, 0.15);

          /* polvo rojo flotando (posiciones fijas: render determinista) */
          var dust = document.querySelectorAll("#dust i");
          for (var i = 0; i < dust.length; i++) {
            tl.fromTo(dust[i], { opacity: 0, y: 90, x: 0 },
              { opacity: 0.85, y: -260, x: (i % 2 ? 26 : -22), duration: 2.3, ease: "none",
                repeat: 2, yoyo: true }, 0.05 + i * 0.11);
          }

          /* whip-pan: el cartel sale disparado y entra un streak rojo */
          tl.to("#flyer", { x: -2100, duration: 0.42, ease: "expo.in" }, 1.52);
          tl.fromTo("#whip", { opacity: 0, scaleX: 0.2, x: -420 },
            { opacity: 1, scaleX: 1, x: 260, duration: 0.34, ease: "power3.out" }, 1.55);
          tl.to("#whip", { opacity: 0, duration: 0.2, ease: "power2.in" }, 1.82);
          tl.set("#s1", { opacity: 0 }, 1.98);

          /* ───────── ESCENA 2 · 2.00 – 5.00 · ENTRADA ─────────
             Zoom-in lento (2.00 → 5.00) + parpadeo del neon. */
          tl.set("#s2", { opacity: 1 }, 2.0);
          tl.fromTo("#entrance", { scale: 1.0, x: 0 },
            { scale: 1.12, x: -18, duration: 3.0, ease: "power1.out" }, 2.0);
          tl.fromTo("#neonPlate", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 2.02);
          tl.fromTo("#neonText", { opacity: 0, scale: 0.92 },
            { opacity: 1, scale: 1, duration: 0.4, ease: "expo.out" }, 2.06);
          tl.fromTo("#bulbs", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none" }, 2.1);

          /* parpadeo del neon: tres caidas cortas, como un tubo viejo */
          var flick = [[2.86, 0.06], [3.52, 0.05], [4.41, 0.07]];
          for (var f = 0; f < flick.length; f++) {
            var t0 = flick[f][0];
            tl.to("#neonText", { opacity: 0.18, duration: 0.03, ease: "none" }, t0);
            tl.to("#bulbs", { opacity: 0.25, duration: 0.03, ease: "none" }, t0);
            tl.to("#neonText", { opacity: 1, duration: flick[f][1], ease: "none" }, t0 + 0.03);
            tl.to("#bulbs", { opacity: 1, duration: flick[f][1], ease: "none" }, t0 + 0.03);
          }

          tl.fromTo("#people", { opacity: 0, y: 60, scale: 0.96 },
            { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "power3.out" }, 2.12);
          tl.fromTo("#cautionL", { opacity: 0, y: 70, rotation: -12 },
            { opacity: 1, y: 0, rotation: -5, duration: 0.45, ease: "back.out(1.8)" }, 2.35);
          tl.fromTo("#cautionR", { opacity: 0, y: 70, rotation: 12 },
            { opacity: 1, y: 0, rotation: 4, duration: 0.45, ease: "back.out(1.8)" }, 2.48);

          /* objetos flotando en dos planos (parallax) */
          tl.fromTo("#fl1", { opacity: 0, x: -260, y: 0, rotation: -24 },
            { opacity: 1, x: 1240, y: -60, rotation: 210, duration: 3.1, ease: "none" }, 2.05);
          tl.fromTo("#fl2", { opacity: 0, x: 220, y: 40, rotation: 18 },
            { opacity: 1, x: -1080, y: -120, rotation: -190, duration: 3.4, ease: "none" }, 2.25);
          tl.fromTo("#fl3", { opacity: 0, x: -160, y: 0, rotation: 16 },
            { opacity: 1, x: 1120, y: 70, rotation: -170, duration: 2.8, ease: "none" }, 2.4);
          tl.fromTo("#fl4", { opacity: 0, x: 140, y: 0, rotation: -12 },
            { opacity: 1, x: -1180, y: 90, rotation: 200, duration: 3.0, ease: "none" }, 2.6);

          /* ───────── TRANSICIÓN · 5.00 – 5.20 · FLASH + GLITCH ───────── */
          tl.set("#s2", { opacity: 0 }, 5.0);
          tl.set("#s3", { opacity: 1 }, 5.0);
          tl.set("#s3", { opacity: 0 }, 5.2);
          tl.fromTo("#flashA", { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, 5.0);
          tl.to("#flashA", { opacity: 0, duration: 0.13, ease: "none" }, 5.05);
          /* split RGB en tres ráfagas + sacudida de cámara */
          var gs = [5.0, 5.06, 5.12];
          for (var g = 0; g < gs.length; g++) {
            tl.set("#content", { className: "+glitch" }, gs[g]);
            tl.set("#content", { className: "-glitch" }, gs[g] + 0.04);
          }
          tl.fromTo("#content", { x: -14, y: 8 }, { x: 0, y: 0, duration: 0.2, ease: "power3.out" }, 5.0);

          /* ───────── ESCENA 4 · 5.20 – 8.00 · PERSONAJES ─────────
             4 cortes de 0.70 s con zoom-punch, shake y split RGB. */
          tl.set("#s4", { opacity: 1 }, 5.2);
          tl.fromTo("#crowd", { scale: 1.06, x: 0 }, { scale: 1.14, x: -14, duration: 2.8, ease: "power1.out" }, 5.2);

          var cuts = [5.2, 5.9, 6.6, 7.3];
          var chars = ["#ch1", "#ch2", "#ch3", "#ch4"];
          var rots = [3.5, -3.5, 2.5, -2.5];
          for (var c = 0; c < cuts.length; c++) {
            var t = cuts[c];
            tl.set(chars[c], { opacity: 1 }, t);
            tl.fromTo(chars[c], { scale: 1.28, rotation: rots[c], x: 30 },
              { scale: 0.97, rotation: 0, x: 0, duration: 0.46, ease: "expo.out" }, t);
            if (c > 0) tl.to(chars[c - 1], { opacity: 0, duration: 0.06, ease: "none" }, t);
            /* shake */
            tl.fromTo("#content", { x: c % 2 ? 16 : -16, y: c % 2 ? -10 : 10 },
              { x: 0, y: 0, duration: 0.18, ease: "power3.out" }, t);
            /* split RGB */
            tl.set("#content", { className: "+glitch" }, t);
            tl.set("#content", { className: "-glitch" }, t + 0.05);
            /* pulso de compás (120 BPM) dentro del plano */
            tl.to(chars[c], { scale: 1.015, duration: 0.09, ease: "power2.out", yoyo: true, repeat: 1 }, t + 0.34);
            tl.to(chars[c], { scale: 1.015, duration: 0.09, ease: "power2.out", yoyo: true, repeat: 1 }, t + 0.84);
          }
          tl.set("#s4", { opacity: 0 }, 7.99);

          /* ───────── ESCENA 5 · 8.00 – 12.00 · MONSTRUO ───────── */
          tl.set("#s5", { opacity: 1 }, 8.0);
          tl.fromTo("#monster", { opacity: 0, scale: 0.86, y: 60, rotation: -2.5 },
            { opacity: 1, scale: 1, y: 0, rotation: 0, duration: 0.85, ease: "expo.out" }, 8.0);
          tl.to("#monster", { scale: 1.08, y: -34, rotation: 1.6, duration: 2.0, ease: "sine.inOut", yoyo: true, repeat: 1 }, 8.9);

          tl.fromTo("#mb1", { opacity: 0, x: -220, y: 0, rotation: -20 },
            { opacity: 1, x: 1180, y: -80, rotation: 200, duration: 3.9, ease: "none" }, 8.05);
          tl.fromTo("#mb2", { opacity: 0, x: 260, y: 30, rotation: 16 },
            { opacity: 1, x: -1120, y: -100, rotation: -190, duration: 3.6, ease: "none" }, 8.2);
          tl.fromTo("#mb3", { opacity: 0, x: -180, y: 0, rotation: 14 },
            { opacity: 1, x: 1140, y: 60, rotation: -180, duration: 3.4, ease: "none" }, 8.35);
          tl.fromTo("#mb4", { opacity: 0, x: 200, y: 0, rotation: -14 },
            { opacity: 1, x: -1200, y: 70, rotation: 200, duration: 3.7, ease: "none" }, 8.5);
          tl.fromTo("#mb5", { opacity: 0, x: -140, y: 0, rotation: 10 },
            { opacity: 1, x: 1080, y: -40, rotation: -160, duration: 3.2, ease: "none" }, 8.7);

          /* ───────── CIERRE · 11.45 · FLASH AL LOGO ───────── */
          tl.set("#s6", { opacity: 1 }, 11.44);
          tl.fromTo("#flashB", { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, 11.45);
          tl.to("#flashB", { opacity: 0, duration: 0.12, ease: "none" }, 11.5);
          tl.set("#content", { className: "+glitch" }, 11.45);
          tl.set("#content", { className: "-glitch" }, 11.5);
          tl.fromTo("#endMark", { opacity: 0, scale: 1.34 },
            { opacity: 1, scale: 1, duration: 0.55, ease: "expo.out" }, 11.55);
          tl.fromTo("#endSub", { opacity: 0, y: 26 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 11.66);
          tl.to("#monster", { opacity: 0.22, duration: 0.4, ease: "power2.in" }, 11.62);
          tl.to("#mFloat", { opacity: 0.18, duration: 0.4, ease: "power2.in" }, 11.62);
          tl.set("#s6", { opacity: 0 }, 11.92);

          /* ───────── GRANO: vibración de película (salto cada 0.08 s) ───────── */
          tl.to("#grain", { x: 14, duration: 0.08, ease: "steps(1)", yoyo: true, repeat: 149 }, 0);
          tl.to("#grain", { y: 10, duration: 0.08, ease: "steps(1)", yoyo: true, repeat: 149 }, 0);

          window.__timelines["veluxe-promo"] = tl;
        }
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(build); else build();
      </script>
    </div>
