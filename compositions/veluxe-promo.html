  <head>
    <meta charset="UTF-8" />
    <title>VELUXE V3 — promo vertical 9:16 (13 s)</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: #000; }
      :root {
        --primary: #ff4d4d;        /* color marca (parametrizable) */
        --primary-soft: rgba(255, 77, 77, .22);
        --primary-glow: rgba(255, 77, 77, .55);
        --primary-deep: rgba(255, 40, 40, .9);
      }
      #stage {
        position: relative; width: 1080px; height: 1920px; overflow: hidden;

        -webkit-font-smoothing: antialiased;
      }
      img { display: block; }
      .scene { position: absolute; inset: 0; opacity: 0; }
      #content { position: absolute; inset: 0; will-change: transform; }

      /* ══════════ ESCENA 1 · CARTEL (0.00 – 2.00) ══════════ */
      #s1bg {
        position: absolute; inset: 0;
        background: radial-gradient(circle 760px at 50% 44%, #171216 0%, #0a0809 58%, #050405 100%);

      }

      #flyerBlur { filter: blur(16px); opacity: 0; }
      #dust { position: absolute; inset: 0; }
      #dust i {
        position: absolute; display: block; border-radius: 50%;
        background: radial-gradient(circle, var(--primary) 0%, var(--primary-glow) 45%, rgba(255, 40, 30, 0) 72%);
        will-change: transform, opacity;

      /* ══════════ ESCENA 2 · ENTRADA (2.00 – 5.00) ══════════ */

      #entrance {
        position: absolute; left: -142px; top: 0; width: 1364px; height: 1920px;

      }
      #neonText {
        position: absolute; left: 0; top: 232px; width: 1080px; text-align: center;
        font-size: 134px; font-weight: 800; letter-spacing: 10px; color: var(--primary);
        text-shadow: 0 0 10px var(--primary-glow), 0 0 30px var(--primary-deep),
                     0 0 70px var(--primary-soft), 0 0 140px var(--primary-soft);
        will-change: opacity; z-index: 3;
      }
      #bulbs {
        position: absolute; left: 0; top: 196px; width: 1080px; height: 22px; z-index: 4;

      }
      /* 3 planos de objetos flotantes con parallax (el mas cercano con blur) */

      /* ══════════ MULTITUD (5.25 – 11.50) ══════════ */
      #crowdWrap { position: absolute; inset: 0; will-change: transform; }

        position: absolute; left: -30px; top: -30px; width: 1140px; height: 1980px;

      #redTint {

        mix-blend-mode: multiply;
      }
      #crowdShade {
        position: absolute; inset: 0;
        background: radial-gradient(circle 900px at 50% 46%, rgba(0,0,0,0) 0%, rgba(0,0,0,.5) 74%, rgba(0,0,0,.88) 100%);
      }

      /* ══════════ PERSONAJES (copia limpia + copia con split RGB) ══════════ */
      .chb {
        position: absolute; left: 50%; top: 47%; width: 1560px; height: 1560px;

      .chr { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: contain; }
      .chrg {

      /* ══════════ TARJETA FINAL ══════════ */
      #endCard { position: absolute; inset: 0; opacity: 0; z-index: 50; }

      #endTxt {
        position: absolute; left: 0; right: 0; top: 980px; text-align: center;

      #slogan {

      #sub2 {

      /* ══════════ GRANO + VIÑETA ══════════ */
      #grain {

      #vignette {
        position: absolute; inset: 0; z-index: 80; pointer-events: none;

      /* will-change: elementos animados por GSAP */
      #s1 { will-change: opacity; }
      #s2 { will-change: opacity; }
      #s3 { will-change: opacity; }
      #s4 { will-change: opacity; }
      #crowdScene { will-change: opacity; }
      #s5 { will-change: opacity; }
      #s5b { will-change: opacity; }
      #s6 { will-change: opacity; }
      #endCard { will-change: opacity, transform; }
    </style>
  </head>

      <script src="../assets/vendor/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};

        function build() {
          /* Color parametrizado: el runtime lo inyecta; aqui se aplica el valor
             effective (defaults -> overrides del host -> --variables de CLI). */
          var V = (window.__hyperframes && window.__hyperframes.getVariables)
            ? window.__hyperframes.getVariables()
            : {};
          if (typeof V.primaryColor === "string" && V.primaryColor !== "") {
            var c = V.primaryColor.replace("#", "");
            if (c.length === 3) c = c[0] + c[0] + c[1] + c[1] + c[2] + c[2];
            var r = parseInt(c.slice(0, 2), 16), g = parseInt(c.slice(2, 4), 16), b = parseInt(c.slice(4, 6), 16);
            if (!isNaN(r)) {
              var root = document.documentElement.style;
              root.setProperty("--primary", V.primaryColor);
              root.setProperty("--primary-soft", "rgba(" + r + "," + g + "," + b + ",.22)");
              root.setProperty("--primary-glow", "rgba(" + r + "," + g + "," + b + ",.55)");
              root.setProperty("--primary-deep", "rgba(" + r + "," + g + "," + b + ",.9)");
            }
          }

          /* ---------- variables en render-time (API HyperFrames 0.8.x) ----------
             El runtime no inyecta el valor: se aplica aqui desde
             window.__hyperframes.getVariables() (defaults -> overrides del host
             -> --variables de CLI). Los atributos data-var-* quedan como
             declaracion legible de que variable manda en cada elemento. */
          var __hfVars = (typeof V !== "undefined" && V)
            ? V
            : ((window.__hyperframes && window.__hyperframes.getVariables)
                ? window.__hyperframes.getVariables() : {});
          document.querySelectorAll("[data-var-text]").forEach(function (el) {
            var k = el.getAttribute("data-var-text");
            if (typeof __hfVars[k] === "string" && __hfVars[k] !== "") el.textContent = __hfVars[k];
          });
          document.querySelectorAll("[data-var-src]").forEach(function (el) {
            var k = el.getAttribute("data-var-src");
            if (typeof __hfVars[k] !== "string" || __hfVars[k] === "") return;
            if (el.getAttribute("src") === __hfVars[k]) return;
            el.setAttribute("src", __hfVars[k]);
            /* si cambia la fuente de audio/video hay que recargarla */
            if (el.tagName === "AUDIO" || el.tagName === "VIDEO") el.load();
          });
          var tl = gsap.timeline({ paused: true });
          var i, t;

          /* ══════════ E1 · 0.00 – 2.00 · CARTEL ══════════ */
          tl.set("#s1", { opacity: 1 }, 0);
          tl.fromTo("#flyer", { opacity: 0, scale: 1.03, x: 0 },
            { opacity: 1, scale: 1.03, x: 0, duration: 0.35, ease: "power2.out" }, 0);
          tl.to("#flyer", { scale: 1.12, duration: 1.25, ease: "power1.out" }, 0.15);

          var dust = document.querySelectorAll("#dust i");
          for (i = 0; i < dust.length; i++) {
            tl.fromTo(dust[i], { opacity: 0, y: 90, x: 0 },
              { opacity: 0.85, y: -260, x: (i % 2 ? 26 : -22), duration: 2.3, ease: "none", repeat: 2, yoyo: true }, 0.05 + i * 0.11);
          }

          /* WHIP-PAN con motion blur: 0.25 s de translacion rapida + copia desenfocada */
          tl.to("#flyer", { x: -1900, duration: 0.25, ease: "expo.in" }, 1.55);
          tl.fromTo("#flyerBlur", { opacity: 0, x: 0, scaleX: 1 },
            { opacity: 0.9, x: -1900, scaleX: 1.7, duration: 0.25, ease: "expo.in" }, 1.55);
          tl.to("#flyerBlur", { opacity: 0, duration: 0.14, ease: "power2.in" }, 1.7);
          tl.set("#s1", { opacity: 0 }, 1.98);

          /* ══════════ E2 · 2.00 – 5.00 · ENTRADA ══════════ */
          tl.set("#s2", { opacity: 1 }, 2.0);
          tl.set("#s3", { opacity: 0 }, 0);
          /* push-in lento 1.00 → 1.15 */
          tl.fromTo("#entWrap", { scale: 1.0, x: 0 },
            { scale: 1.15, x: -22, duration: 3.0, ease: "power1.out" }, 2.0);
          tl.fromTo("#people", { opacity: 0, y: 70, scale: 0.97 },
            { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" }, 2.15);

          /* NEON: parpadeo con saltos de opacidad irregulares (determinista) */
          var steps = [
            [2.06, 1], [2.44, 0.12], [2.50, 1], [2.93, 1], [2.99, 0.35], [3.05, 0.9],
            [3.11, 0.18], [3.17, 1], [3.88, 1], [3.94, 0.10], [4.00, 0.75], [4.06, 1],
            [4.55, 1], [4.60, 0.45], [4.66, 1]
          ];
          for (i = 0; i < steps.length; i++) {
            tl.set("#neonText", { opacity: steps[i][1] }, steps[i][0]);
            tl.set("#bulbs", { opacity: steps[i][1] }, steps[i][0]);
          }

          /* OBJETOS FLOTANTES: 3 planos de parallax (lejos / medio / cerca con blur) */
          tl.fromTo("#flF1", { opacity: 0, x: 0, y: 0, rotation: 0 },
            { opacity: 0.55, x: 1300, y: -70, rotation: 120, duration: 3.0, ease: "none" }, 2.0);
          tl.fromTo("#flF2", { opacity: 0, x: 0, y: 0, rotation: 0 },
            { opacity: 0.55, x: -1300, y: -50, rotation: -140, duration: 3.2, ease: "none" }, 2.25);
          tl.fromTo("#flM1", { opacity: 0, x: 0, y: 0, rotation: 0 },
            { opacity: 0.75, x: 1250, y: -40, rotation: 200, duration: 2.6, ease: "none" }, 2.1);
          tl.fromTo("#flM2", { opacity: 0, x: 0, y: 0, rotation: 0 },
            { opacity: 0.75, x: -1250, y: 60, rotation: -210, duration: 2.8, ease: "none" }, 2.35);
          tl.fromTo("#flN1", { opacity: 0, x: 0, y: 0, rotation: 0 },
            { opacity: 0.9, x: 1400, y: -30, rotation: 260, duration: 2.1, ease: "none" }, 2.15);
          tl.fromTo("#flN2", { opacity: 0, x: 0, y: 0, rotation: 0 },
            { opacity: 0.9, x: -1400, y: 50, rotation: -270, duration: 2.3, ease: "none" }, 2.45);

          /* ══════════ TRANSICION · 5.00 – 5.25 · FLASH + SHAKE ══════════ */
          tl.set("#s2", { opacity: 0 }, 5.0);
          tl.set("#s3", { opacity: 1 }, 5.0);
          tl.fromTo("#flashA", { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none" }, 5.0);
          tl.to("#flashA", { opacity: 0, duration: 0.16, ease: "none" }, 5.04);
          tl.fromTo("#content", { x: -14, y: 9 }, { x: 0, y: 0, duration: 0.22, ease: "power3.out" }, 5.0);
          tl.set("#s3", { opacity: 0 }, 5.25);

          /* ══════════ E4 · 5.25 – 7.65 · 4 PERSONAJES ══════════ */
          tl.set("#s4", { opacity: 1 }, 5.25);
          tl.set("#crowdScene", { opacity: 1 }, 5.25);
          tl.fromTo("#crowdWrap", { scale: 1.04 }, { scale: 1.12, duration: 6.25, ease: "power1.out" }, 5.25);

          var cuts4 = [5.25, 5.85, 6.45, 7.05];
          var boxes4 = ["#chb1", "#chb2", "#chb3", "#chb4"];
          var glitch4 = ["#chg1", "#chg2", "#chg3", "#chg4"];
          var shake4 = [[-8, 6], [8, -7], [-6, -8], [7, 8]];
          var rot4 = [3.5, -3.5, 2.6, -2.6];
          for (i = 0; i < cuts4.length; i++) {
            t = cuts4[i];
            tl.set(boxes4[i], { opacity: 1 }, t);
            tl.fromTo(boxes4[i], { scale: 1.4, rotation: rot4[i], x: 34 },
              { scale: 1.0, rotation: 0, x: 0, duration: 0.36, ease: "expo.out" }, t);
            if (i > 0) tl.set(boxes4[i - 1], { opacity: 0 }, t);
            /* split RGB en el corte */
            tl.set(glitch4[i], { opacity: 1 }, t);
            tl.set(glitch4[i], { opacity: 0 }, t + 0.1);
            /* sacudida de 8 px */
            tl.fromTo("#content", { x: shake4[i][0], y: shake4[i][1] },
              { x: 0, y: 0, duration: 0.18, ease: "power3.out" }, t);
            /* pulso de compas dentro del plano (tras el punch) */
            tl.to(boxes4[i], { scale: 1.012, duration: 0.07, ease: "power2.out", yoyo: true, repeat: 1 }, t + 0.4);
          }
          tl.set("#s4", { opacity: 0 }, 7.64);

          /* ══════════ E5 · 7.65 – 11.50 · CORTE CADA 0.50 s ══════════ */
          tl.set("#s5", { opacity: 1 }, 7.65);
          var cuts5 = [7.65, 8.15, 8.65, 9.15, 9.65, 10.15];
          var boxes5 = ["#chb5", "#chb6", "#chb7", "#chb8", "#chb5", "#chb6"];
          var glitch5 = ["#chg5", "#chg6", "#chg7", "#chg8", "#chg5", "#chg6"];
          var shake5 = [[8, 7], [-8, -6], [7, -8], [-7, 6], [-8, 7], [8, -6]];
          for (i = 0; i < cuts5.length; i++) {
            t = cuts5[i];
            tl.set(boxes5[i], { opacity: 1 }, t);
            tl.fromTo(boxes5[i], { scale: 1.42, rotation: -rot4[i % 4], x: -30 },
              { scale: 1.0, rotation: 0, x: 0, duration: 0.36, ease: "expo.out" }, t);
            if (i > 0) tl.set(boxes5[i - 1], { opacity: 0 }, t);
            tl.set(glitch5[i], { opacity: 1 }, t);
            tl.set(glitch5[i], { opacity: 0 }, t + 0.09);
            tl.fromTo("#content", { x: shake5[i][0], y: shake5[i][1] },
              { x: 0, y: 0, duration: 0.16, ease: "power3.out" }, t);
          }
          /* plano de grupo */
          tl.set("#s5b", { opacity: 1 }, 10.65);
          tl.set("#group", { opacity: 1 }, 10.65);
          tl.fromTo("#group", { scale: 1.12 }, { scale: 1.0, duration: 0.85, ease: "expo.out" }, 10.65);
          tl.set("#s5", { opacity: 0 }, 10.64);

          /* ══════════ CIERRE · 11.50 · FLASH + LOGO (1 s de hold) ══════════ */
          tl.set("#crowdScene", { opacity: 0 }, 11.5);
          tl.set("#s5b", { opacity: 0 }, 11.5);
          tl.set("#s6", { opacity: 1 }, 11.5);
          tl.fromTo("#flashB", { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, 11.5);
          tl.to("#flashB", { opacity: 0, duration: 0.14, ease: "none" }, 11.55);
          tl.fromTo("#endCard", { opacity: 0, scale: 1.18 },
            { opacity: 1, scale: 1, duration: 0.5, ease: "expo.out" }, 11.62);
          tl.set("#s6", { opacity: 0 }, 12.69);

          /* ══════════ GRANO ══════════ */
          tl.to("#grain", { x: 14, duration: 0.08, ease: "steps(1)", yoyo: true, repeat: 158 }, 0);
          tl.to("#grain", { y: 10, duration: 0.08, ease: "steps(1)", yoyo: true, repeat: 158 }, 0);

          window.__timelines["veluxe-promo"] = tl;
        }
        /* Build sincrono: sin promesas ni setTimeout, la linea de tiempo esta
           disponible antes de que el renderizador pida el primer fotograma.
           El ticker de GSAP va a la misma cadencia que la captura (data-fps). */
        if (gsap.ticker) gsap.ticker.fps(30);
        build();
      </script>
    </div>
  </body>
</html>
